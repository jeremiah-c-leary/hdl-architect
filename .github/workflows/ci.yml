# CI: the same checks as `scripts/check`, on every pull request and on main.
# Actions are pinned to the commit of their release (the tag is in the comment).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # the oldest Python pyproject.toml allows, and the one used for development
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install GHDL (the tests analyze the generated VHDL)
        run: sudo apt-get update -q && sudo apt-get install -y -q ghdl && ghdl --version | head -1
      - name: Install hdl-architect from a clean checkout
        run: pip install -e ".[scaffold,flow,test,dev]"
      - name: Check
        run: scripts/check python
      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-python-${{ matrix.python }}
          path: build/test-results.xml
          if-no-files-found: ignore

  js:
    name: HA 2 browser code
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install hdl-architect (the behaviour tests run a real `ha serve`)
        run: pip install -e .
      - name: Install the pinned tools (fails if package.json and the lock file disagree)
        run: npm ci
      - name: Install headless Chromium for the behaviour tests (Playwright's pinned build)
        run: npx playwright install --with-deps chromium
      - name: Check
        run: scripts/check js
