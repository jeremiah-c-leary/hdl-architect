<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1022" height="420" viewBox="0 0 1022 420"><style>svg { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0px; height: 100%; background: #f6f7f9; color: #1d2430; font: 13px / 1.35 system-ui, -apple-system, "Segoe UI", sans-serif; }
body { display: flex; flex-direction: column; }
header#top { display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: #ffffff; border-bottom: 1px solid #d8dde5; }
.brand { font-weight: 700; margin-right: 6px; }
.spacer { flex: 1 1 0%; }
button { font: inherit; color: #1d2430; background: #f6f7f9; border: 1px solid #d8dde5; border-radius: 4px; padding: 2px 8px; cursor: pointer; }
button:hover { border-color: #2f6fde; }
#crumbs a { color: #2f6fde; cursor: pointer; text-decoration: none; }
#crumbs .cur { font-weight: 600; }
#status { color: #6b7686; min-width: 70px; text-align: right; }
#status.err { color: #c0392b; font-weight: 600; }
main { flex: 1 1 0%; display: flex; min-height: 0px; }
aside#side { width: 240px; overflow: auto; background: #ffffff; border-right: 1px solid #d8dde5; padding: 8px; }
aside h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: #6b7686; margin: 10px 0px 4px; }
aside h2 small { text-transform: none; letter-spacing: 0px; font-weight: 400; }
aside input { width: 100%; padding: 3px 6px; border: 1px solid #d8dde5; border-radius: 4px; background: #f6f7f9; color: #1d2430; }
.item { padding: 2px 6px; border-radius: 3px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 3px solid transparent; }
.item:hover { background: #f6f7f9; }
.item.cur { background: #f6f7f9; font-weight: 600; }
.group { color: #6b7686; font-size: 11px; margin-top: 6px; }
#work { flex: 1 1 0%; display: flex; flex-direction: column; min-width: 0px; min-height: 0px; }
#canvasWrap { flex: 1 1 0%; min-height: 0px; overflow: auto; position: relative; }
#hint { position: absolute; left: 12px; bottom: 8px; color: #6b7686; pointer-events: none; }
footer#problems { max-height: 22vh; overflow: auto; background: #ffffff; border-top: 1px solid #d8dde5; padding: 4px 12px; }
footer .p { padding: 1px 0px; }
footer .p.err { color: #c0392b; }
footer .p.warn { color: #b8571b; }
footer .p.info { color: #6b7686; }
#menu { position: fixed; z-index: 10; background: #ffffff; border: 1px solid #d8dde5; border-radius: 6px; box-shadow: rgba(0, 0, 0, 0.18) 0px 6px 20px; padding: 4px 0px; min-width: 190px; }
#menu .mi { padding: 4px 14px; cursor: pointer; }
#menu .mi:hover { background: #f6f7f9; }
#menu .mi.danger { color: #c0392b; }
#menu .sep { border-top: 1px solid #d8dde5; margin: 4px 0px; }
#menu .hd { padding: 2px 14px; color: #6b7686; font-size: 11px; }
svg text { fill: #1d2430; font-size: 12px; user-select: none; }
.band-edge { fill: #e9edf3; }
.band-col { fill: #ffffff; stroke: #d8dde5; }
.band-gutter { fill: #f1f3f6; }
.band-col.drop { fill: rgb(232, 240, 254); }
.title { font-size: 15px; font-weight: 600; }
.subtitle { fill: #6b7686; font-size: 11px; }
.comp { stroke: rgb(135, 149, 168); stroke-width: 1; rx: 4; cursor: grab; }
.comp.sel { stroke: #2f6fde; stroke-width: 3; }
.on-kind { fill: rgb(255, 255, 255); }
.comp-type.on-kind { fill: rgba(255, 255, 255, 0.85); }
.comp-name { font-weight: 600; }
.comp-type { fill: #6b7686; font-size: 11px; }
.port { fill: rgb(43, 52, 64); stroke: rgb(255, 255, 255); stroke-width: 1; cursor: pointer; }
.port.untyped { fill: rgb(255, 255, 255); stroke: rgb(43, 52, 64); }
.port.armed { fill: #e67e22; stroke: #e67e22; }
.port-label { font-size: 11px; }
.port-type { fill: #6b7686; font-size: 10px; }
.wire { fill: none; stroke: #34495e; stroke-width: 1.6; cursor: pointer; }
.wire.bind { stroke: #7f8c9d; stroke-dasharray: 5, 3; }
.wire:hover { stroke: #2f6fde; stroke-width: 3; }
.edge-port { fill: rgb(93, 109, 126); cursor: pointer; }
.edge-port.untyped { fill: #ffffff; stroke: rgb(93, 109, 126); }
.edge-port.armed { fill: #e67e22; }
.grip { fill: transparent; cursor: ns-resize; }
.grip:hover { fill: #2f6fde; opacity: 0.35; }
.port.picked, .edge-port.picked { stroke: #2f6fde; stroke-width: 3; }
.gport { stroke: rgb(255, 255, 255); stroke-width: 1; }
.gport.reset { stroke-dasharray: 2, 1; }
.net-tag { font-size: 10px; font-weight: 600; }
.net { display: flex; align-items: center; gap: 6px; padding: 2px 4px; border-radius: 3px; cursor: pointer; }
.net:hover { background: #f6f7f9; }
.net.armed { outline: 2px solid #e67e22; }
.net .swatch { width: 10px; height: 10px; border-radius: 2px; flex: 0 0 auto; }
.net .freq { margin-left: auto; color: #6b7686; font-size: 11px; }
.net-m { padding-left: 22px; color: #6b7686; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.net-m.loose { padding-left: 8px; }
.hint-s { color: #6b7686; font-size: 11px; }
.pair { fill: none; stroke-width: 1.5; }
.pairlink { color: #2f6fde; cursor: pointer; font-size: 11px; text-decoration: underline; white-space: nowrap; }
#clockTree { position: fixed; inset: 40px 30px; z-index: 5; background: #ffffff; border: 1px solid #d8dde5; border-radius: 8px; box-shadow: rgba(0, 0, 0, 0.25) 0px 10px 40px; display: flex; flex-direction: column; }
#clockTree[hidden] { display: none; }
.ct-bar { display: flex; align-items: center; gap: 14px; padding: 8px 12px; border-bottom: 1px solid #d8dde5; }
.ct-body { flex: 1 1 0%; overflow: auto; background: #f6f7f9; }
.ct-node { stroke: rgb(135, 149, 168); }
.ct-edge { fill: none; stroke-width: 2; }
.ct-edge.reset { stroke-dasharray: 6, 3; }
.ct-edge.sysref { stroke-dasharray: 2, 3; }
.ct-edge:hover { stroke-width: 4; }
#textDlg, #estimateDlg { border: 1px solid #d8dde5; border-radius: 8px; background: #ffffff; color: #1d2430; box-shadow: rgba(0, 0, 0, 0.25) 0px 10px 40px; width: min(560px, 90vw); padding: 14px; }
#textDlg::backdrop, #estimateDlg::backdrop { background: rgba(0, 0, 0, 0.25); }
#textDlg form, #estimateDlg form { display: flex; flex-direction: column; gap: 8px; }
#textDlg textarea { font: inherit; width: 100%; resize: vertical; padding: 6px; border: 1px solid #d8dde5; border-radius: 4px; background: #f6f7f9; color: #1d2430; }
.dlg-buttons { display: flex; justify-content: flex-end; gap: 8px; }
#resourceBanner { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 5px 12px; background: #ffffff; border-bottom: 1px solid #d8dde5; font-size: 12px; }
#resourceBanner:empty { display: none; }
.rb-resource, .rb-bar { display: inline-flex; align-items: center; gap: 6px; }
.rb-name { color: #6b7686; }
.rb-track { position: relative; width: 80px; height: 16px; border: 1px solid #d8dde5; background: #f6f7f9; overflow: hidden; }
.rb-unavailable { background: #d8dde5; }
.rb-fill { position: absolute; inset: 0px auto 0px 0px; }
.rb-level-ok { background: rgb(47, 143, 87); }
.rb-level-margin { background: rgb(211, 155, 28); }
.rb-level-over { background: rgb(180, 35, 24); }
.rb-margin-line { position: absolute; top: 0px; bottom: 0px; width: 2px; background: #1d2430; opacity: 0.6; }
.rb-percent { min-width: 2.8em; }
.rb-no-room { color: rgb(180, 35, 24); }
.rb-error { color: rgb(180, 35, 24); }
.rb-incomplete { color: rgb(154, 103, 0); }
.rb-hierarchy { margin-left: auto; }
#deviceView { position: fixed; inset: 40px 30px; z-index: 5; background: #ffffff; border: 1px solid #d8dde5; border-radius: 8px; box-shadow: rgba(0, 0, 0, 0.25) 0px 10px 40px; display: flex; flex-direction: column; }
#deviceView[hidden] { display: none; }
#dvNote { margin: 10px 12px 0px; color: rgb(154, 103, 0); }
#dvTable { border-collapse: collapse; margin: 12px; font-size: 12px; }
#dvTable td { padding: 3px 8px; white-space: nowrap; }
.dv-head td { color: #6b7686; }
.dv-row { border-top: 1px solid #d8dde5; }
.dv-target { background: #f6f7f9; font-weight: 600; }
.dv-smallest .dv-device { font-weight: 600; }
.dv-tag { margin-left: 8px; padding: 0px 5px; border: 1px solid rgb(47, 143, 87); color: rgb(47, 143, 87); font-size: 11px; font-weight: 400; }
.dv-fits { color: rgb(47, 143, 87); }
.dv-uses-margin { color: rgb(154, 103, 0); }
.dv-does-not-fit { color: rgb(180, 35, 24); }
#resourceView { position: fixed; inset: 40px 30px; z-index: 5; background: #ffffff; border: 1px solid #d8dde5; border-radius: 8px; box-shadow: rgba(0, 0, 0, 0.25) 0px 10px 40px; display: flex; flex-direction: column; }
#resourceView[hidden] { display: none; }
.rv-spacer { flex: 1 1 0%; }
#rvTable { border-collapse: collapse; margin: 12px; font-size: 12px; }
#rvTable td { padding: 3px 10px; }
.rv-head td, .rv-foot td { color: #6b7686; text-align: right; }
.rv-head td:nth-child(-n+2), .rv-foot td:nth-child(-n+2) { text-align: left; }
.rv-foot:first-of-type td, .rv-foot td { border-top: 1px solid #d8dde5; }
.rv-row { cursor: pointer; }
.rv-row:hover { filter: brightness(0.93); }
.rv-name { white-space: nowrap; }
.rv-fold { cursor: pointer; color: #6b7686; }
.rv-number { text-align: right; font-variant-numeric: tabular-nums; }
.rv-status { font-style: italic; color: #6b7686; }
.est-field { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.est-field input { width: 9em; padding: 3px 6px; border: 1px solid #d8dde5; border-radius: 4px; background: #f6f7f9; color: #1d2430; }
.perform { white-space: normal; padding: 3px 6px; }
.perform-head { display: flex; gap: 6px; }
.perform-count { margin-left: auto; color: #6b7686; font-size: 11px; }
.perform-summary { color: #6b7686; font-size: 11px; }
.perform-summary.has-missing { color: #c0392b; }
#footprintBar { position: sticky; top: 0px; left: 0px; z-index: 2; display: flex; align-items: center; gap: 10px; padding: 4px 12px; background: #ffffff; border-bottom: 1px solid #d8dde5; }
#footprintBar[hidden] { display: none; }
.fp-dim { opacity: 0.3; }
.wire.fp-used { stroke-width: 3; }
.fp-missing { fill: none; stroke: #c0392b; stroke-width: 2; stroke-dasharray: 6, 4; }
.fp-badge { font-size: 11px; font-weight: 600; fill: #1d2430; }
#sequenceView { height: 50%; background: #ffffff; border-top: 2px solid #d8dde5; display: flex; flex-direction: column; }
#sequenceView[hidden] { display: none; }
#seqSvg text { font-size: 11px; text-anchor: middle; fill: #1d2430; }
.seq-lane-name { font-weight: 600; }
#seqSvg .seq-lane-def { fill: #6b7686; }
.seq-lane.expandable { cursor: pointer; }
.seq-lifeline { stroke: #d8dde5; stroke-dasharray: 4, 4; }
.seq-bracket { cursor: pointer; }
.seq-bracket-box { fill: none; stroke: #6b7686; stroke-dasharray: 3, 3; }
#seqSvg .seq-bracket-name { text-anchor: start; font-weight: 600; }
.seq-step-box { stroke: rgb(135, 149, 168); }
#seqSvg .seq-step-name { font-weight: 600; fill: rgb(255, 255, 255); }
#seqSvg .seq-step-detail { font-size: 10px; fill: rgba(255, 255, 255, 0.85); }
.seq-arrow { fill: none; stroke: #34495e; stroke-width: 1.6; marker-end: url("#seq-head"); }
.seq-head { fill: #34495e; }
.seq-head-missing { fill: #c0392b; }
.seq-missing .seq-arrow { stroke: #c0392b; stroke-dasharray: 6, 4; marker-end: url("#seq-head-missing"); }
#seqSvg .seq-missing .seq-label { fill: #c0392b; }
.seq-unknown .seq-arrow { stroke: #6b7686; stroke-dasharray: 2, 3; }
#seqSvg .seq-note { text-anchor: start; fill: #6b7686; }
.seq-tabs button.cur { background: #2f6fde; color: rgb(255, 255, 255); border-color: #2f6fde; }
#actionsTable { padding: 10px 12px; }
#actionsTable[hidden], #seqSvg.seq-hidden { display: none; }
.at-table select { max-width: 11em; }
.at-table { border-collapse: collapse; font-size: 12px; }
.at-table th, .at-table td { border: 1px solid #d8dde5; padding: 3px 6px; text-align: left; vertical-align: top; white-space: nowrap; }
.at-table th { background: #f1f3f6; font-weight: 600; }
.at-name { font-weight: 600; }
.at-table .at-hop td { border-left-width: medium; border-left-style: none; border-left-color: currentcolor; border-right-width: medium; border-right-style: none; border-right-color: currentcolor; background: #ffffff; padding: 2px 6px; }
.at-hop-mark { color: #6b7686; text-align: right; }
.at-hop-body &gt; * { margin-right: 8px; vertical-align: middle; }
.at-hop-ends { font-family: ui-monospace, monospace; font-size: 11px; }
.at-pending { font-style: italic; color: #6b7686; }
.at-muted { color: #6b7686; }
.at-missing { color: #c0392b; }
.at-button { font-size: 10px; padding: 0px 4px; margin-left: 3px; }
.at-new-item input { width: 9em; margin-right: 3px; }
.at-add { margin-top: 10px; display: flex; gap: 6px; align-items: center; }
#addPerform { margin-top: 4px; font-size: 11px; }
.at-draft td { background: #f1f3f6; }
.at-own { margin-top: 10px; font-size: 12px; }
