 : Control</title></rect><text x="425" y="434" text-anchor="middle" class="comp-name on-kind">Control</text><text x="425" y="447" text-anchor="middle" class="comp-type on-kind">Control</text><text x="336" y="460" class="port-label on-kind">clk</text><rect x="330" y="346" width="190" height="54" rx="4" class="ct-node" style="fill:#6b7280"><title>CLK_RST_CTRL : CLKRSTCTRL</title></rect><text x="425" y="362" text-anchor="middle" class="comp-name on-kind">CLK_RST_CTRL</text><text x="425" y="375" text-anchor="middle" class="comp-type on-kind">CLKRSTCTRL</text><text x="336" y="388" class="port-label on-kind">sys_clk</text><rect x="330" y="274" width="190" height="54" rx="4" class="ct-node" style="fill:#2f8f57"><title>CLK_GEN_CTRL : CLKGENCTRL</title></rect><text x="425" y="290" text-anchor="middle" class="comp-name on-kind">CLK_GEN_CTRL</text><text x="425" y="303" text-anchor="middle" class="comp-type on-kind">CLKGENCTRL</text><text x="336" y="316" class="port-label on-kind">clk</text><rect x="20" y="122" width="190" height="54" rx="4" class="ct-node" style="fill:#e9edf3"><title>jesd_sysref (sysref · 10 MHz)</title></rect><text x="115" y="138" text-anchor="middle" class="comp-name ">jesd_sysref</text><text x="115" y="151" text-anchor="middle" class="comp-type ">sysref · 10 MHz</text></svg>
