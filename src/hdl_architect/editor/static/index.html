<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HA 2</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header id="top">
  <span class="brand">HA 2</span>
  <button id="back" title="Back (Alt+Left)">◀</button>
  <span id="crumbs"></span>
  <span class="spacer"></span>
  <button id="undo" title="Undo (Ctrl+Z)">↶</button>
  <button id="redo" title="Redo (Ctrl+Shift+Z)">↷</button>
  <span id="status">loading…</span>
  <button id="clockTreeBtn" title="The clock tree of this sheet">Clock tree</button>
  <button id="resetTreeBtn" title="The reset tree of this sheet">Reset tree</button>
  <button id="checkBtn" title="Check the whole model">Check</button>
  <button id="exportBtn" title="Save this sheet as SVG or PNG, for documentation">Export</button>
</header>
<main>
  <aside id="side">
    <section>
      <h2>Sheets</h2>
      <div id="sheets"></div>
    </section>
    <section>
      <h2>Clocks &amp; resets <small>this sheet</small></h2>
      <div id="nets"></div>
    </section>
    <section>
      <h2>Library <small>drag onto a column</small></h2>
      <input id="libFilter" placeholder="filter">
      <div id="library"></div>
    </section>
    <section>
      <h2>Interfaces <small>port defs</small></h2>
      <div id="interfaces"></div>
    </section>
  </aside>
  <div id="canvasWrap">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="hint"></div>
  </div>
</main>
<footer id="problems"></footer>
<div id="menu" hidden></div>
<dialog id="textDlg">
  <form method="dialog">
    <b id="textDlgTitle">Description</b>
    <div class="hint-s" id="textDlgHint">Plain text for readers outside FPGA design. It goes into the VHDL comments and the documents. Empty removes it.</div>
    <textarea id="textDlgText" rows="5"></textarea>
    <div class="dlg-buttons">
      <button value="cancel" type="submit">Cancel</button>
      <button value="ok" type="submit" id="textDlgOk">Save  (Ctrl+Enter)</button>
    </div>
  </form>
</dialog>
<div id="clockTree" hidden>
  <div class="ct-bar">
    <b id="ctTitle">Clock tree</b>
    <label id="ctSysrefL"><input type="checkbox" id="ctSysref"> SYSREF</label>
    <label title="Look inside subsystems: show where a clock really comes from"><input type="checkbox" id="ctFlatten"> flatten hierarchy</label>
    <span class="spacer"></span>
    <button id="ctExportSVG" title="Save this tree as SVG">SVG</button>
    <button id="ctExportPNG" title="Save this tree as PNG (2x)">PNG</button>
    <button id="ctClose" title="Close (Esc)">Close</button>
  </div>
  <div class="ct-body"><svg id="ctSvg" xmlns="http://www.w3.org/2000/svg"></svg></div>
</div>
<script src="/static/app.js"></script>
<script src="/static/clocktree.js"></script>
<script src="/static/export.js"></script>
</body>
</html>
