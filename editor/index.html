// A component's own ports read as "Ports" generically, except for the two component kinds whose
// own sheet already uses "Pins"/"Connectors" terminology for the same underlying concept.
function portsTabLabel(comp){
  if(comp.isFPGA) return 'Pins';
  if(comp.isCCA) return 'Connectors';
  return 'Ports';
}

// ---------- Edit Properties (tabbed) ----------
// One right-click destination with tabs, so configuring a component doesn't mean several
// separate right-clicks. Fixed-size shell (propBody scrolls internally) so switching tabs never
// resizes the window. A single Save (next to Close) commits every tab at once — the draft object
// below holds in-progress edits across tab switches so nothing is lost by not hitting Save before
// flipping tabs. Features is the one exception: it was already fully live/immediate (no Save of
// its own to begin with), so it's untouched here.
function editPropertiesModal(comp, sheet, initialTab){
  const root = document.getElementById('modalRoot');
  let activeTab = initialTab || 'documentation';
  // CCA/HW/FPGA/Hard Macro/Subsystem are containers or physical I/O, not fabric logic — no
  // meaningful LUT/FF/DSP/RAM figures to track. isSubsystem covers Subsystem+FPGA+CCA, so FPGA/CCA
  // are excluded via their own flags and "plain Subsystem" via the isSubsystem-minus-those check.
  const isPlainSubsystem = comp.isSubsystem && !comp.isFPGA && !comp.isCCA;
  const showResources = !(comp.isCCA || comp.isHW || comp.isFPGA || comp.isHardMacro || isPlainSubsystem);
  // BSP report candidates: Register Files are always included (no flag needed); Vendor IP/RTL/Hard
  // Macro are opt-in (see the BSP tab's checkbox, defaults off).
  const showBsp = comp.isRegisterFile || comp.isVendorIP || comp.isCustom || comp.isHardMacro;
  // Clock/reset assignment is a leaf-level concern for most containers — but FPGA and plain
  // Subsystem are the exception: FPGA has real physical clock/reset pins even though it's a
  // container in every other sense, and a Subsystem groups components (and possibly other
  // subsystems) that need their own internal clocking structure, same as an FPGA does. CCA alone
  // stays a pure container with no clocking of its own.
  const showClocking = !comp.isCCA;
  // Only an FPGA actually has a physical device to pick — a Subsystem/CCA is just an organizational
  // container with no target of its own; its contents count toward whichever FPGA it ends up inside.
  const showTargetDevice = comp.isFPGA;
  const tabs = [
    { key:'documentation', label:'Documentation' },
    { key:'ports', label: portsTabLabel(comp) },
    { key:'features', label:'Features' },
    ...(showResources ? [{ key:'resources', label:'Resources' }] : []),
    ...(showBsp ? [{ key:'bsp', label:'BSP' }] : []),
    ...(showClocking ? [{ key:'clocking', label:'Clocking' }] : []),
    ...(showTargetDevice ? [{ key:'targetDevice', label:'Target Device' }] : []),
    { key:'appearance', label:'Appearance' }
  ];
  if(activeTab==='resources' && !showResources) activeTab = 'documentation';
  if(activeTab==='bsp' && !showBsp) activeTab = 'documentation';
  if(activeTab==='clocking' && !showClocking) activeTab = 'documentation';
  if(activeTab==='targetDevice' && !showTargetDevice) activeTab = 'documentation';

  // The getter is lazy (reads draft.clocking at call time, not now) since draft itself isn't
  // constructed until the next line — by the time this actually gets called (during rendering),
  // draft is fully built, so the forward reference is safe.
  const portsAdapter = componentPortsAdapter(comp, sheet, ()=> draft.clocking.clockPorts);
  let portRows = makePortRows(portsAdapter);
  const draft = {
    instanceName: comp.instanceName,
    description: getCompDescription(comp),
    textColor: comp.textColor,
    bgColor: comp.bgColor,
    ipTagId: comp.ipTagId,
    resources: {
      vendorId: (comp.resources && comp.resources.vendorId) || null,
      familyId: (comp.resources && comp.resources.familyId) || null,
      deviceId: (comp.resources && comp.resources.deviceId) || null,
      values: Object.assign({}, (comp.resources && comp.resources.values) || {}),
      notes: comp.resourceNotes || ''
    },
    bsp: {
      included: !!(comp.bsp && comp.bsp.included),
      driverName: (comp.bsp && comp.bsp.driverName) || ''
    },
    clocking: {
      clockPorts: JSON.parse(JSON.stringify(comp.clockPorts || [])),
      resetPorts: JSON.parse(JSON.stringify(comp.resetPorts || []))
    },
    targetDevice: Object.assign({vendorId:null, familyId:null, deviceId:null}, comp.targetDevice || {})
  };

  function commitDraft(){
    if(draft.instanceName.trim()) comp.instanceName = draft.instanceName.trim();
    if(comp.childSheetId){ const sh = state.sheets[comp.childSheetId]; if(sh) sh.name = comp.instanceName; }
    setCompDescription(comp, draft.description);
    comp.textColor = draft.textColor;
    comp.bgColor = draft.bgColor;
    comp.ipTagId = draft.ipTagId;
    comp.resources = {
      vendorId: draft.resources.vendorId,
      familyId: draft.resources.familyId,
      deviceId: draft.resources.deviceId,
      values: draft.resources.values
    };
    comp.resourceNotes = draft.resources.notes;
    comp.targetDevice = draft.targetDevice;
    comp.bsp = { included: draft.bsp.included, driverName: draft.bsp.driverName };
    comp.clockPorts = draft.clocking.clockPorts;
    comp.resetPorts = draft.clocking.resetPorts;
    syncClockingBoundary(comp);
    commitPortRows(portsAdapter, portRows);
    portRows = makePortRows(portsAdapter); // resync working rows to the now-committed real ports
    syncLinkedComponent(comp);
    render();
  }

  function draw(){
    root.innerHTML = '';
    const overlay = document.createElement('div'); overlay.className='overlay';
    const modal = document.createElement('div'); modal.className='modal propModal';
    modal.innerHTML = `<h3>Edit Properties — ${escapeHtml(comp.instanceName)}</h3>
      <div class="propTabs">
        ${tabs.map(t=>`<button class="propTabBtn${t.key===activeTab?' active':''}" data-tab="${t.key}">${escapeHtml(t.label)}</button>`).join('')}
      </div>
      <div id="propBody" class="propBody"></div>
      <div class="modalBtns"><button id="pSaveAll" style="border-color:var(--accent);color:var(--accent);">Save</button><button id="pCancel">Cancel</button></div>`;
    overlay.appendChild(modal); root.appendChild(overlay);
    modal.querySelectorAll('.propTabBtn').forEach(btn=>{
      btn.onclick = ()=>{ activeTab = btn.dataset.tab; draw(); };
    });
    const body = modal.querySelector('#propBody');
    if(activeTab==='documentation') drawDocumentationTab(body, comp, draft);
    else if(activeTab==='ports') renderPortsRowsUI(body, portsAdapter, portRows, null);
    else if(activeTab==='features') editFeaturesModal(comp, comp.ports.map(p=>({key:p.id, label:p.name+' ('+p.side+')'})), false, body);
    else if(activeTab==='resources') drawResourcesTab(body, draft.resources);
    else if(activeTab==='bsp') drawBspTab(body, comp, draft.bsp);
    else if(activeTab==='clocking') drawClockingTab(body, draft.clocking, sheet);
    else if(activeTab==='targetDevice') drawTargetDeviceTab(body, draft.targetDevice);
    else if(activeTab==='appearance') drawAppearanceTab(body, draft, comp);
    modal.querySelector('#pSaveAll').onclick = ()=>{ commitDraft(); root.innerHTML=''; };
    modal.querySelector('#pCancel').onclick = ()=>{ root.innerHTML=''; render(); };
  }
  draw();
}

// `res` is draft.resources. Vendor+Family are always required — resource counts are measured
// after implementation, so they're only meaningful in the context of whichever family they were
// measured on (the exact device doesn't matter for this). Once a family is picked, every one of
// ITS resource columns gets its own field here — not a fixed LUT/FF/DSP set plus an ad-hoc RAM
// list — since the family already defines exactly which resource types are real for it; an unused
// one is simply left at 0 rather than omitted. No restriction is ever enforced — Vendor/Family are
// purely the reference point used for cross-vendor scaling when checking against a different one.
function drawResourcesTab(container, res){
  function draw(){
    const vendor = res.vendorId ? state.deviceVendors.find(v=>v.id===res.vendorId) : null;
    const families = vendor ? vendor.families : [];
    const family = res.familyId ? families.find(f=>f.id===res.familyId) : null;
    container.innerHTML = `
      <label>Vendor</label>
      <select id="rVendor">
        <option value="" ${!vendor?'selected':''}>(unspecified)</option>
        ${state.deviceVendors.map(v=>`<option value="${v.id}" ${v.id===res.vendorId?'selected':''}>${escapeHtml(v.name)}</option>`).join('')}
      </select>
      <label style="margin-top:8px;">Family</label>
      <select id="rFamily" ${!vendor?'disabled':''}>
        <option value="" ${!family?'selected':''}>(unspecified)</option>
        ${families.map(f=>`<option value="${f.id}" ${f.id===res.familyId?'selected':''}>${escapeHtml(f.name)}</option>`).join('')}
      </select>
      ${!family ? '<div style="color:var(--dim);font-size:11px;margin-top:4px;">Pick a vendor and family to measure this against — required, since counts only mean something in that context. Its resource fields appear below once chosen; usage on a different family is estimated from these (LUT input-size ratio, matching type names), an approximation rather than a guarantee.</div>' : ''}
      ${family ? (family.columns.length ? `
      <label style="margin-top:12px;">Resource usage on ${escapeHtml(family.name)}</label>
      <div id="rValueRows"></div>
      ` : `<div style="color:var(--dim);font-size:11px;margin-top:10px;">${escapeHtml(family.name)} has no resource columns defined yet — add them via 🧩 Device Library.</div>`) : ''}
      <label style="margin-top:12px;">Reference</label>
      <div style="color:var(--dim);font-size:11px;margin-bottom:4px;">Where these numbers came from — a breadcrumb back to the source (e.g. a synthesis report, a datasheet, a prior project).</div>
      <textarea id="rNotes" rows="4">${escapeHtml(res.notes)}</textarea>
      <div style="color:var(--dim);font-size:11px;margin-top:6px;">Click Save (bottom of window) to apply.</div>`;
    container.querySelector('#rVendor').onchange = (e)=>{ res.vendorId = e.target.value || null; res.familyId = null; draw(); };
    container.querySelector('#rFamily').onchange = (e)=>{ res.familyId = e.target.value || null; draw(); };
    if(family && family.columns.length){
      const wrap = container.querySelector('#rValueRows');
      family.columns.forEach(c=>{
        const row = document.createElement('div');
        row.innerHTML = `<label style="margin-top:8px;">${escapeHtml(c.label)}</label><input data-col="${c.id}" class="rVal" value="${escapeHtml(res.values[c.id]!=null && res.values[c.id]!=='' ? res.values[c.id] : '0')}">`;
        wrap.appendChild(row);
      });
      wrap.querySelectorAll('.rVal').forEach(el=> el.oninput=(e)=>{ res.values[e.target.dataset.col] = e.target.value; });
    }
    container.querySelector('#rNotes').oninput = (e)=>{ res.notes = e.target.value; };
  }
  draw();
}
// `td` is draft.targetDevice: {vendorId, familyId, deviceId}. Self-contained with its own local
// draw() so picking a vendor/family correctly resets whatever's downstream of it without needing
// the whole Edit Properties modal to re-render.
function drawTargetDeviceTab(container, td){
  function draw(){
    const vendor = td.vendorId ? state.deviceVendors.find(v=>v.id===td.vendorId) : null;
    const families = vendor ? vendor.families : [];
    const family = td.familyId ? families.find(f=>f.id===td.familyId) : null;
    const devices = family ? family.devices : [];
    const device = td.deviceId ? devices.find(d=>d.id===td.deviceId) : null;
    container.innerHTML = `
      <div style="color:var(--dim);font-size:11px;margin-bottom:8px;">Pick this FPGA's target part from the 🧩 Device Library. Used for resource fit-checking against everything placed inside it.</div>
      <label>Vendor</label>
      <select id="tdVendor">
        <option value="" ${!vendor?'selected':''}>(unspecified)</option>
        ${state.deviceVendors.map(v=>`<option value="${v.id}" ${v.id===td.vendorId?'selected':''}>${escapeHtml(v.name)}</option>`).join('')}
      </select>
      <label style="margin-top:8px;">Family</label>
      <select id="tdFamily" ${!vendor?'disabled':''}>
        <option value="" ${!family?'selected':''}>(unspecified)</option>
        ${families.map(f=>`<option value="${f.id}" ${f.id===td.familyId?'selected':''}>${escapeHtml(f.name)}</option>`).join('')}
      </select>
      <label style="margin-top:8px;">Device</label>
      <select id="tdDevice" ${!family?'disabled':''}>
        <option value="" ${!device?'selected':''}>(unspecified)</option>
        ${devices.map(d=>`<option value="${d.id}" ${d.id===td.deviceId?'selected':''}>${escapeHtml(d.name)}</option>`).join('')}
      </select>
      ${device ? `
      <label style="margin-top:12px;">Capacity</label>
      <table style="border-collapse:collapse;font-size:12px;width:100%;">
        <tbody>
          ${family.columns.map(c=>`<tr>
            <td style="padding:3px 8px 3px 0;color:var(--dim);">${escapeHtml(c.label)}${c.kind==='lut' && c.lutInputs ? ` (${c.lutInputs}-input)` : ''}</td>
            <td style="padding:3px 0;font-weight:600;">${escapeHtml(device.values[c.id]||'—')}</td>
          </tr>`).join('')}
        </tbody>
      </table>
      ` : (family && family.columns.length===0 ? '<div style="color:var(--dim);font-size:11px;margin-top:10px;">This family has no resource columns defined yet — add them via 🧩 Device Library.</div>' : '')}

// ---------- Protocols manager ----------
// Fully live (no Save button) — like Features, edits apply immediately. Nothing here touches any
// component; it only edits the shared registry that protocol-tagged ports reference by id.
// ---------- Deployment Diagram (nested-containment view, no wires) ----------
// A separate, read-only view of the design: System containing CCAs containing FPGAs containing
// components/Subsystems, recursively, as nested boxes rather than the schematic column/gutter
// layout. Deliberately shows no connections at all — this is a structural "what lives where" view.
const ALLOC_HEADER_H = 24, ALLOC_PAD = 10, ALLOC_GAP = 10, ALLOC_LEAF_W = 120, ALLOC_LEAF_H = 32, ALLOC_LEAF_GAP = 4;

// isContainer is driven by comp.isSubsystem (true for Subsystem/FPGA/CCA), not by whether it
// currently has any children — an empty CCA should still render as an (empty) container, not
// collapse into looking like a leaf block.
function buildAllocationNodeForComponent(comp, filterFn, collapsedIds){
  const isContainer = !!comp.isSubsystem;
  const childComponents = (isContainer && comp.childSheetId && state.sheets[comp.childSheetId]) ? state.sheets[comp.childSheetId].components.filter(filterFn) : [];
  const isCollapsed = isContainer && childComponents.length>0 && collapsedIds.has(comp.id);
  const node = {
    id: comp.id,
    label: comp.instanceName,
    bg: comp.bgColor || typeDefaultBgColor(comp) || '#3a4a63',
    textColor: comp.textColor || '#fff',
    isContainer,
    isCollapsed,
    hasChildren: childComponents.length>0,
    children: isCollapsed ? [] : childComponents.map(c=>buildAllocationNodeForComponent(c, filterFn, collapsedIds))
  };
  return node;
}
function buildAllocationTree(sheet, filterFn, collapsedIds){
  filterFn = filterFn || (()=>true);
  collapsedIds = collapsedIds || new Set();
  return { id:'__root__', label: sheet.name, bg: '#2a3441', textColor:'#fff', isContainer:true, isCollapsed:false, children: sheet.components.filter(filterFn).map(c=>buildAllocationNodeForComponent(c, filterFn, collapsedIds)) };
}
// Leaf (non-hierarchical) siblings are grouped into a single stacked column rather than each
// claiming their own column — keeps a container from FPGA to a System from sprawling sideways
// when it holds several small leaf blocks alongside one deep subsystem.
// A collapsed container is sized exactly like a leaf — same width, same height — not as an
// (empty) container with its own header and padding, so collapsing something visually shrinks it
// down to an ordinary-looking block rather than leaving a tall, mostly-empty header shell behind.
function measureAllocNode(node){
  if(!node.isContainer || node.isCollapsed){
    node._w = ALLOC_LEAF_W; node._h = ALLOC_LEAF_H;
    return;
  }
  const leaves = node.children.filter(c=>!c.isContainer);
  const containers = node.children.filter(c=>c.isContainer);
  containers.forEach(measureAllocNode);
  const columns = [];
  if(leaves.length){
    columns.push({ w: ALLOC_LEAF_W, h: leaves.length*ALLOC_LEAF_H + (leaves.length-1)*ALLOC_LEAF_GAP, isLeafGroup:true, leaves });
  }
  containers.forEach(c=> columns.push({ w:c._w, h:c._h, node:c }));
  if(columns.length===0){
    node._w = ALLOC_LEAF_W; node._h = ALLOC_HEADER_H + ALLOC_LEAF_H + ALLOC_PAD*2; node._columns = [];
    return;
  }
  const totalW = columns.reduce((s,c)=>s+c.w,0) + ALLOC_GAP*(columns.length-1) + ALLOC_PAD*2;
  const maxH = Math.max(...columns.map(c=>c.h));
  node._w = Math.max(ALLOC_LEAF_W, totalW);
  node._h = ALLOC_HEADER_H + maxH + ALLOC_PAD*2;
  node._columns = columns;
}
function positionAllocNode(node, x, y){
  node._x = x; node._y = y;
  if(!node.isContainer || !node._columns) return;
  let cx = x + ALLOC_PAD;
  const cy = y + ALLOC_HEADER_H + ALLOC_PAD;
  node._columns.forEach(col=>{
    if(col.isLeafGroup){
      let ly = cy;
      col.leaves.forEach(lf=>{ lf._x = cx; lf._y = ly; lf._w = ALLOC_LEAF_W; lf._h = ALLOC_LEAF_H; ly += ALLOC_LEAF_H + ALLOC_LEAF_GAP; });
    } else {
      positionAllocNode(col.node, cx, cy);
    }
    cx += col.w + ALLOC_GAP;
  });
}
// Wraps `text` to fit `maxWidthPx` at `fontSize`, up to `maxLines`; anything past that is
// truncated with an ellipsis rather than overflowing the box. Character width is an approximation
// (SVG has no native text measurement here) but comfortably conservative for our fonts.
function wrapAllocLabel(text, maxWidthPx, fontSize, maxLines){
  const maxChars = Math.max(3, Math.floor(maxWidthPx / (fontSize*0.58)));
  const words = String(text).split(' ');
  let lines = [];
  let cur = '';
  words.forEach(w=>{
    let piece = cur ? cur+' '+w : w;
    while(piece.length > maxChars){
      if(cur){ lines.push(cur); cur=''; piece = w; }
      if(piece.length > maxChars){ lines.push(piece.slice(0,maxChars)); piece = piece.slice(maxChars); }
    }
    cur = piece;
  });
  if(cur) lines.push(cur);
  if(lines.length===0) lines = [''];
  if(lines.length > maxLines){
    lines = lines.slice(0, maxLines);
    let last = lines[maxLines-1];
    if(last.length > maxChars-1) last = last.slice(0, maxChars-1);
    lines[maxLines-1] = last + '…';
  }
  return lines;
}
function renderAllocNode(svg, node, onToggle){
  if(!node.isContainer || node.isCollapsed){
    const isCollapsedContainer = node.isContainer && node.isCollapsed;
    const rect = svgEl('rect',{x:node._x,y:node._y,width:node._w,height:node._h,fill:node.bg,stroke:'#0b0e14','stroke-width':1,rx:2},svg);
    const fontSize = 11, lineH = fontSize+2;
    const maxLines = Math.max(1, Math.floor((node._h-4)/lineH));
    const lines = wrapAllocLabel(isCollapsedContainer ? '▸ '+node.label : node.label, node._w-8, fontSize, maxLines);
    let ty = node._y + node._h/2 - (lines.length-1)*lineH/2 + fontSize*0.35;
    const texts = [];
    lines.forEach(line=>{
      const t = svgEl('text',{x:node._x+node._w/2,y:ty,'text-anchor':'middle',fill:node.textColor,'font-size':fontSize},svg);
      t.textContent = line;
      texts.push(t);
      ty += lineH;
    });
    if(isCollapsedContainer){
      rect.style.cursor = 'pointer';
      rect.setAttribute('title', 'Click to expand');
      texts.forEach(t=> t.style.pointerEvents = 'none');
      rect.addEventListener('click', ()=> onToggle(node.id));
    }
    return;
  }
  svgEl('rect',{x:node._x,y:node._y,width:node._w,height:node._h,fill:'#151a24',stroke:'#3a4a63','stroke-width':1},svg);
  const headerRect = svgEl('rect',{x:node._x,y:node._y,width:node._w,height:ALLOC_HEADER_H,fill:node.bg},svg);
  const toggleMark = node.hasChildren ? (node.isCollapsed ? '▸ ' : '▾ ') : '';
  const headerLine = wrapAllocLabel(toggleMark+node.label, node._w-8, 12, 1)[0];
  const headerLabel = svgEl('text',{x:node._x+node._w/2,y:node._y+ALLOC_HEADER_H/2+4,'text-anchor':'middle',fill:node.textColor,'font-size':12,'font-weight':'600'},svg);
  headerLabel.textContent = headerLine;
  if(node.hasChildren && node.id!=='__root__'){
    headerRect.style.cursor = 'pointer';
    headerRect.setAttribute('title', node.isCollapsed ? 'Click to expand' : 'Click to collapse');
    headerLabel.style.pointerEvents = 'none';
    headerRect.addEventListener('click', ()=> onToggle(node.id));
  }
  (node._columns||[]).forEach(col=>{
    if(col.isLeafGroup) col.leaves.forEach(lf=> renderAllocNode(svg, lf, onToggle));
    else renderAllocNode(svg, col.node, onToggle);
  });
}

// ---------- Feature Mapping (another Visualization) ----------
// Finds every component ON THE CURRENTLY ACTIVE SHEET that has at least one Feature, and renders
// whichever one is selected as a sequence diagram. A feature-ref step's target always lives on the
// calling component's own child sheet (never anywhere else — see the parent→child structural rule
// Features have always followed), so resolving one never needs to search beyond that one sheet.
// The root System sheet has no owning component — nothing sits "above" it — so it can't hold
// Features the normal way (comp.features). But two CCAs, say, are both direct children of System,
// and connecting something under one to something under the other has no other valid common
// ancestor to define that connection on. So the System sheet holds its own Features directly
// (sheet.features), and this wraps that in a component-shaped object so the entire existing
// Feature/step machinery (editFeaturesModal, buildFeatureSequence, ...) can treat it exactly like
// any other owner without needing a parallel implementation. Its own "child sheet" is the System
// sheet itself, since that's where the components its steps reference actually live.
function systemPseudoComponent(sheet){
  return { id: 'sys_'+sheet.id, instanceName: sheet.name, features: sheet.features,
    childSheetId: sheet.id, bgColor: null, textColor: null, ports: [] };
}
// A feature belongs to the sheet it actually operates within — the owning component's own child
// sheet — not the sheet the component instance happens to be placed on. So viewing the FPGA sheet
// offers the FPGA's own features (not crossbar/PS's own leaf-level ones), and viewing the CCA
// sheet offers the CCA's own features. The root System sheet has no owning component, so its own
// Features (see systemPseudoComponent) are offered when viewing the System sheet itself instead —
// the one case where a sheet's Features are found on itself rather than on whatever sits above it.
function collectSheetFeatureOptions(sheet){
  let owner;
  if(!sheet.parentSheetId || !sheet.parentComponentId){
    if(sheet.kind!=='system') return [];
    owner = systemPseudoComponent(sheet);
  } else {
    const parentSheet = state.sheets[sheet.parentSheetId];
    owner = parentSheet ? parentSheet.components.find(c=>c.id===sheet.parentComponentId) : null;
    if(!owner) return [];
  }
  const options = [];
  (owner.features||[]).forEach(feat=>{
    const pullsInOtherFeatures = feat.steps.some(s=> s.kind==='feature-ref');
    if(pullsInOtherFeatures) options.push({comp:owner, feat});
  });
  return options;
}
// The ancestry of a sheet, root to leaf — used to draw the nested container frames (System, CCA,
// FPGA, ...) that a feature's participants live inside, mirroring the actual hierarchy rather than
// flattening it away.
function buildFrameChain(sheet){
  const chain = [];
  let s = sheet;
  while(s){ chain.unshift(s); s = s.parentSheetId ? state.sheets[s.parentSheetId] : null; }
  return chain;
}
// Given a component living on homeSheet, entered via feat (one of that component's own Features) —
// determines who calls it, by tracing feat's own first step back to real wiring. A port-event step
// with direction 'in' is traced directly: find the connection on homeSheet touching that port, and
// whatever's on the other end is the caller — unless that's homeSheet's own boundary, meaning the
// call comes from outside this sheet entirely (a break, same as no caller at all). A port-event

      const laneX = colX[i].x0 + EXP_LANE_W/2;
      const bg = c.comp.bgColor || typeDefaultBgColor(c.comp) || '#3a4a63';
      const textColor = c.comp.textColor || '#cfd8e3';
      const rect = svgEl('rect', {x:laneX-70, y:boxY, width:140, height:EXP_BOX_H, rx:3, fill:bg}, svg);
      const label = svgEl('text', {x:laneX, y:boxY+EXP_BOX_H/2+4, 'text-anchor':'middle', fill:textColor, 'font-size':12, 'font-weight':600, 'pointer-events':'none'}, svg);
      label.textContent = c.canExpand ? '▸ '+c.comp.instanceName : c.comp.instanceName;
      if(c.canExpand){
        rect.style.cursor = 'pointer';
        rect.setAttribute('title','Click to expand');
        rect.addEventListener('click', ()=> onToggle(c.comp.id));
      }
      const rec = { laneX, top: boxY+EXP_BOX_H, bottom: boxY+EXP_BOX_H+24, frame: myFrameRec };
      lifelineRegistry.push(rec);
      colConn[i] = { entryX:laneX, exitX:laneX, entryRec:rec, exitRec:rec };
    });

    // How much extra vertical room is needed before entering this NOT-YET-rendered expansion's own
    // content: its own header stack, plus — if its own first participant is ALSO an unrendered
    // expansion — however much depth THAT needs too, recursively. An arrow landing on (or leaving
    // from) such a component must already account for this before its own row is assigned; otherwise
    // the row lands at whatever a flat count would suggest, which can be shallower than where that
    // nested level's own boxes actually sit — landing the arrow above or inside them instead of below.
    function pendingEntryDepth(subM){
      let depth = subM.nFrames*EXP_FRAME_HEADER_H;
      if(subM.cols.length && subM.cols[0].isExpanded) depth += pendingEntryDepth(subM.cols[0].sub);
      return depth;
    }
    bumpForEntry = function(compId){
      const i = m.cols.findIndex(c=>c.comp.id===compId);
      if(i>=0 && !colConn[i] && m.cols[i].isExpanded) yState.y += pendingEntryDepth(m.cols[i].sub);
    };
    // Renders a column's own full sub-diagram the first time anything needs to know its position —
    // either as something arrows enter, or as something an arrow's source resolves through. Once
    // rendered, its own {entryX, exitX, entryRec, exitRec} are fixed and simply looked up on any
    // later reference. suppress is only meaningful the first time (when it actually triggers the
    // render); a later, cached lookup just returns what was already decided. Callers are expected to
    // have already applied bumpForEntry beforehand if this render might be freshly triggered here.
    //
    // A column touched by more than one distinct occasion (see measureExpandable) is handled
    // differently: its shared frame — header, lanes, boxes — is set up once, on the very first
    // occasion reached, and each occasion after that draws its OWN arrows into that same, already-
    // existing frame rather than reusing a single, cached position. occIdx, when given explicitly
    // (from an arrow's own toOccasion/fromOccasion), says exactly which occasion this call is about;
    // left out, it means "whichever hasn't been drawn yet" while any remain, or "whatever was drawn
    // last" once they're all done — covering the handful of places (the diagram's own very first
    // participant, the final entryX/exitX lookup) that ask for a position without processing a
    // specific arrow.
    ensureRendered = function(compId, suppress, occIdx){
      const i = m.cols.findIndex(c=>c.comp.id===compId);
      if(i<0) return colConn[i];
      const c = m.cols[i];
      if(c.sub && c.sub.occasions){
        if(!colConn[i]) colConn[i] = { occState:null, drawn:{}, maxDrawn:-1 };
        const entry = colConn[i];
        let idx;
        if(occIdx==='advance'){
          idx = entry.maxDrawn+1 < c.sub.occasions.length ? entry.maxDrawn+1 : entry.maxDrawn;
          if(idx<0) idx = 0;
        } else if(typeof occIdx==='number'){
          idx = occIdx;
        } else {
          // Lookup-only: whatever's already been established, or occasion 0 if this is genuinely
          // the very first thing to ever touch this column (nothing drawn yet, nothing to look up).
          idx = entry.maxDrawn>=0 ? entry.maxDrawn : 0;
        }
        if(entry.drawn[idx]) return entry.drawn[idx];
        const occ = c.sub.occasions[idx];
        const res = renderExpandable(svg, c.sub, expandedIds, colX[i].x0, childY0, yState, onToggle, lifelineRegistry, frameRegistry, myFrameRec, entry.occState?null:compId, idx===0?suppress:false, entry.occState, occ.arrows, {lastTouched:occ.lastTouched, lastTouchedFeat:occ.lastTouchedFeat}, occ.firstParticipant);
        entry.occState = res.state;
        entry.drawn[idx] = { entryX:res.entryX, exitX:res.exitX, entryRec:res.entryRec, exitRec:res.exitRec };
        entry.maxDrawn = Math.max(entry.maxDrawn, idx);
        return entry.drawn[idx];
      }
      if(colConn[i]) return colConn[i];
      const sub = renderExpandable(svg, c.sub, expandedIds, colX[i].x0, childY0, yState, onToggle, lifelineRegistry, frameRegistry, myFrameRec, compId, suppress);
      colConn[i] = { entryX:sub.entryX, exitX:sub.exitX, entryRec:sub.entryRec, exitRec:sub.exitRec };
      return colConn[i];
    };
    // Where should an arrow ENTERING this participant land? A collapsed lifeline: its own lane.
    // Expanded: wherever ITS OWN first participant lands, recursively — i.e. its own entryX, since
    // that's exactly the same question one level deeper. Always triggers with suppress=true: entering
    // this component from outside means ITS OWN leading fresh-entry arrow, if it has one, would just
    // be redrawing the SAME arrival a second time — see the arrow loop below. touchY, when given,
    // grows the resolved leaf lifeline's own tracked bottom to cover this specific use, AND propagates
    // that growth up through every frame actually containing that leaf — however many levels away
    // this particular touch happens to originate from.
    resolveEntryX = function(comp, touchY, occIdx){
      if(!comp) return innerLeft;
      const conn = ensureRendered(comp.id, true, occIdx);
      if(touchY!=null && conn.entryRec){ conn.entryRec.bottom = Math.max(conn.entryRec.bottom, touchY+24); touchFrame(conn.entryRec.frame, touchY); }
      return conn.entryX;
    };
    // Where should an arrow LEAVING this participant (as a source) originate? A collapsed lifeline:
    // its own lane, same as entry — arriving and departing are the same instant when there's nothing
    // in between. Expanded: wherever its own LAST arrow's target ends up (recursively) — since that's
    // the last thing that happens before its sequence hands off outward. If it has no arrows at all
    // (a bare participant, nothing internal), entry and exit coincide there too. No suppression here —
    // exiting never has the redundant-arrival problem entering does.
    resolveExitX = function(comp, touchY, occIdx){
      if(!comp) return innerLeft;
      const conn = ensureRendered(comp.id, false, occIdx);
      if(touchY!=null && conn.exitRec){ conn.exitRec.bottom = Math.max(conn.exitRec.bottom, touchY+24); touchFrame(conn.exitRec.frame, touchY); }
      return conn.exitX;
    };
  }

  // The very first participant of THIS occasion has no incoming arrow ONLY when its own feature's
  // own first step is itself that participant (a direct feature-ref, nothing before it, backward-
  // tracing to nothing) — in that case nothing else in this occasion's own arrows will ever render
  // it, so it must be rendered immediately, starting this occasion's own sequence fresh. This
  // applies to every occasion, not just the first ever reached for this column — a later occasion
  // whose own first participant happens to be a genuine dead end (Serial Subsystem's own entry
  // within "Receive Serial Data," say, tracing to nothing) needs the exact same forced advance, or
  // it's simply never explicitly touched at all, and a later lookup of it as someone else's caller
  // would silently return whatever an EARLIER occasion left behind instead. Since nothing here
  // targets it directly, it stands in for this occasion's own leading edge — so if this is the
  // very first occasion of the outermost diagram, entered under suppression, that cascades into it
  // too (never for a later occasion, which always genuinely needs its own leading arrow shown). If
  // the first step is instead an entry (a self port-event), arrowsToProcess[0] targets this
  // participant directly, and the arrow loop below already renders it in its own turn.
  const occFirstParticipant = firstParticipantOverride || (m.cols.length ? m.cols[0].comp : null);
  if(occFirstParticipant){
    const fpCol = m.cols.find(c=>c.comp.id===occFirstParticipant.id);
    if(fpCol && fpCol.isExpanded && !(arrowsToProcess.length && arrowsToProcess[0].to && arrowsToProcess[0].to.id===occFirstParticipant.id)){
      bumpForEntry(occFirstParticipant.id);
      ensureRendered(occFirstParticipant.id, !priorState && !!suppressLeadingEntry, 'advance');
    }
  }

  // Every arrow is its own complete, independent message — its own new row, its own arrowhead,
  // regardless of whether its endpoints happen to be expanded components. An expanded endpoint
  // only ever changes WHERE (which X) the arrow's own end resolves to, never whether it shares a
  // row with anything else. Two temporally distinct events are always two separate rows, even
  // between the same pair of components on the same ports (three DAC writes, say). The one
  // exception: this diagram's own leading fresh entry, when this whole diagram was itself entered
  // under suppression — that's not a separate event, it's the SAME arrival already being drawn by
  // whichever outer arrow led here, just resolving one level deeper — so it's skipped entirely
  // (still resolved, for position/rendering purposes, just not drawn). This only applies on the
  // very first entry, never a later re-entry for a subsequent occasion — those are independent,
  // later sequences that genuinely need their own leading arrow shown if they have no real caller.
  // Either endpoint's own bump (if it's a freshly-entered expansion) is applied BEFORE this arrow's
  // own row, so the row itself already clears wherever that nested content's own boxes will
  // actually sit.
  arrowsToProcess.forEach((a, ai)=>{
    if(ai===0 && !a.from && suppressLeadingEntry && !priorState){
      resolveEntryX(a.to, null, 'advance');
      return;
    }
    if(a.from) bumpForEntry(a.from.id);
    bumpForEntry(a.to.id);
    yState.y += EXP_ARROW_GAP;
    const y = yState.y;
    // A self-loop's own drawn shape (see drawSeqArrow) drops 16px below its own row and then its
    // own arrowhead extends a further 4px past that — 20px total, versus a normal arrow's own ~4px
    // arrowhead — so touching the lifeline at the plain row Y leaves the dashed line stopping short
    // of the loop's own actual bottom edge. Touch deeper here specifically for a self-loop so the
    // lifeline clears it with the same margin a normal arrow already gets.
    const touchY = y + (a.isSelfLoop ? 20 : 0);
    const fromX = a.from ? resolveExitX(a.from, touchY) : innerLeft;
    const toX = resolveEntryX(a.to, touchY, 'advance');
    drawSeqArrow(svg, fromX, toX, y);
  });

  // A genuine exit — the truly-last-reached participant's own arc actually has an output — needs
  // its own, visible arrow leaving this frame, the same way a genuine entry (nothing tracing back
  // to a real caller) already gets a visible arrow entering it: an arrow that leaves this scope
  // entirely says "this is consumed elsewhere," and that fact deserves to be drawn even when
  // nothing here says where "elsewhere" is. This only applies at the outermost, directly-viewed
  // level, though — inside a nested, expanded frame, that same exit is already being shown as
  // part of whatever outer arrow continues from this component's own resolveExitX; drawing it a
  // second time here would just duplicate that one fact with two overlapping arrowheads. A
  // Consumer's own lack of output already renders as its own self-loop above, so only a
  // Passthrough or Originator last participant reaches this at all. lastTouchedOverride carries a
  // single occasion's own lastTouched/lastTouchedFeat when this call is rendering one occasion of
  // a multi-occasion column — but that path is always nested (parentFrameRec is never null there),
  // so this block never actually fires for it regardless.
  const finalLastTouched = lastTouchedOverride ? lastTouchedOverride.lastTouched : m.lastTouched;
  const finalLastTouchedFeat = lastTouchedOverride ? lastTouchedOverride.lastTouchedFeat : m.lastTouchedFeat;
  if(!parentFrameRec && finalLastTouched){
    const lastArcType = classifyArc(finalLastTouchedFeat);
    if(lastArcType==='passthrough' || lastArcType==='originator'){
      yState.y += EXP_ARROW_GAP;
      const y = yState.y;
      const fromX = resolveExitX(finalLastTouched, y);
      drawSeqArrow(svg, fromX, innerRight, y);
    }
  }

  // This diagram's own entryX/exitX (and the leaf lifeline records they ultimately correspond to),
  // for whoever (if anyone) is one level up and needs to resolve a position through this level.
  // entryX is always this diagram's own first participant's own entry, however it was reached.
  // exitX is the LAST participant actually reached by this feature's own step list (m.lastTouched,
  // or lastTouchedOverride for one occasion of a multi-occasion column) — not simply the last arrow
  // drawn, since an Originator's own step draws no arrow of its own at all but is still,
  // structurally, the last thing that happened here. If nothing was reached at all, exit coincides
  // with entry (nothing happened here).
  let entryX = innerLeft, entryRec = null;
  const entryParticipant = firstParticipantOverride || (m.cols.length ? m.cols[0].comp : null);
  if(entryParticipant){
    const e = ensureRendered(entryParticipant.id, true, firstParticipantOverride ? undefined : 0);
    entryX = e.entryX; entryRec = e.entryRec;
  }
  let exitX = entryX, exitRec = entryRec;
  if(finalLastTouched){
    const x = ensureRendered(finalLastTouched.id, false);
    exitX = x.exitX; exitRec = x.exitRec;
  }
  const state = { nFrames, innerLeft, innerRight, childY0, myFrameRec, touchFrame, colConn, colX, bumpForEntry, ensureRendered, resolveEntryX, resolveExitX };
  return { entryX, exitX, entryRec, exitRec, frameRightX: innerRight, frameRec: myFrameRec, state };
}
function drawSeqArrow(svg, x1, x2, y){
  if(x1===x2){
    const loopW = 40;
    svgEl('path', {d:`M ${x1} ${y} h ${loopW} v 16 h -${loopW}`, fill:'none', stroke:'#5ec8d8', 'stroke-width':1.5}, svg);
    svgEl('path', {d:`M ${x1+6} ${y+16-4} L ${x1} ${y+16} L ${x1+6} ${y+16+4}`, fill:'none', stroke:'#5ec8d8', 'stroke-width':1.5}, svg);
    return;
  }
  svgEl('line', {x1, y1:y, x2, y2:y, stroke:'#5ec8d8', 'stroke-width':1.5}, svg);
  const dir = x2>x1 ? 1 : -1;
  svgEl('path', {d:`M ${x2-dir*8} ${y-4} L ${x2} ${y} L ${x2-dir*8} ${y+4}`, fill:'#5ec8d8', stroke:'#5ec8d8'}, svg);
}

// Walks every System's full hierarchy and collects: Register Files (always) plus any Vendor
// IP/RTL/Hard Macro explicitly flagged "Include in BSP report" (see Edit Properties → BSP). No
// protocol filtering — inclusion is purely the type+flag rule, so crossbars/interconnect fabric
// are excluded simply by never getting flagged, not by guessing from their protocol.
function collectBspEntries(){
  const entries = [];
  function walk(sheet, pathParts){
    sheet.components.forEach(comp=>{
      const included = comp.isRegisterFile || !!(comp.bsp && comp.bsp.included);
      if(included){
        const protocols = comp.ports.filter(p=>p.protocolId).map(p=>{
          const proto = state.protocols.find(x=>x.id===p.protocolId);
          return (proto ? proto.name : '(deleted protocol)') + (p.protocolRole ? ' ('+p.protocolRole+')' : '');
        });
        entries.push({
          name: comp.instanceName,
          type: componentKindLabel(comp),
          driverName: (comp.bsp && comp.bsp.driverName) || '',
          protocols: [...new Set(protocols)].join(', '),
          path: pathParts.join(' :: ')
        });
      }
      if(comp.childSheetId && state.sheets[comp.childSheetId]){
        walk(state.sheets[comp.childSheetId], pathParts.concat(comp.instanceName));
      }
    });
  }
  Object.values(state.sheets).filter(s=> effectiveSheetKind(s)==='system').forEach(sys=> walk(sys, [sys.name]));
  return entries;
}

// ---------- Clocks & Resets (definitions + bulk assignment matrix) ----------
// Kept deliberately off the canvas entirely (see drawClockingTab's comment) — clock/reset fan out
// to nearly everything, so drawing them as wires would swamp the diagram. This is the whole story:
// a shared registry (Define) plus a matrix to assign it across every leaf component at once
// (Assign), so you're not opening Edit Properties one component at a time for something this
// pervasive.
// One row per clock/reset PORT on a component that sits directly on `sheet` (not recursive —
// clock/reset scope is local to a sheet now, so there's no hierarchy to walk).
function collectClockPortRows(sheet){
  const rows = [];
  sheet.components.forEach(comp=>{
    if(!comp.isCCA) (comp.clockPorts||[]).forEach(port=> rows.push({comp, port}));
  });
  return rows;
}
function collectResetPortRows(sheet){
  const rows = [];
  sheet.components.forEach(comp=>{
    if(!comp.isCCA) (comp.resetPorts||[]).forEach(port=> rows.push({comp, port}));
  });
  return rows;
}

// ---------- Clock Chain diagram (generation-rank layout, not hierarchy) ----------
// Column = how many generation-hops a component is from something it can drive without waiting on
// anything else on this sheet (an external/unmodeled source, or no gated input at all). A generator
// with several inputs takes the SHALLOWEST one that justifies a rank — not the deepest — so a
// component that's both a source-fed generator AND a downstream consumer (e.g. PS, fed externally
// but also fed a derived clock) sits at its earliest possible column; the derived input is simply
// routed backward to reach it. This is deliberately the opposite of ordinary dependency-graph
// layering (which would take the max), per direct instruction: "generators first... if a generator
// is also a consumer, it must be placed as a generator first."
const CLOCK_CHAIN_PALETTE = ['#e64980','#4dabf7','#51cf66','#fcc419','#845ef7','#ff922b','#20c997','#f06595','#748ffc','#94d82d'];
function isClockPortMeaningful(sheet, port){
  const domainId = port.assignedClockId;

      const g = branchGutterFor(plan, col);

      branchXIndex.set(g+':'+domainId+':f', gutterBranchCount[g]++);
    });
    if(plan.bwd.length){
      const minCol = Math.min(...plan.bwd.map(t=>t.col));
      for(let g=minCol; g<plan.gc; g++){
        if(g<0||g>layout.maxRank) continue;
        branchXIndex.set(g+':'+domainId+':b', gutterBranchCount[g]++);
      }
    }
  });
  let x = 10 + CC_EXT_LABEL_W;
  const colX = []; // colX[i] = left edge of column i's boxes
  const externalStubX = x; x += CC_EXT_STUB_W;
  for(let i=0;i<=layout.maxRank;i++){
    colX.push(x); x += CC_COMP_W;
    x += CC_GUTTER_PAD*2 + Math.max(0,gutterBranchCount[i]-1)*CC_BAR_GAP;
  }
  const hasExit = layout.allDomains.some(d=>d.exitsToParent);
  const exitStubX = hasExit ? (x + CC_GUTTER_PAD) : null;
  const totalW = hasExit ? (exitStubX + CC_EXT_STUB_W + 100) : (x + 20);

  // y layout: Y comes from the family-tree row assignment (buildClockChainLayout), a row number
  // shared globally across columns — not independent per-column stacking. That's what lets an
  // aligned parent/child pair in different columns land at the exact same Y, so the wire between
  // them is a straight horizontal run with no vertical bar needed at all.
  function rowY(row){ return CC_TOP + row*(CC_COMP_H+CC_ROW_GAP); }
  let maxBottom = CC_TOP;
  const genY = [];
  const termStackY = new Map(); // group -> y, keyed by group array reference
  for(let i=0;i<=layout.maxRank;i++){
    const ys = new Map();
    const usedYsInCol = [];
    function claimY(preferredY){
      let y = preferredY;
      while(usedYsInCol.some(u=> Math.abs(u-y) < (CC_COMP_H+CC_ROW_GAP)*0.9)) y += CC_COMP_H + CC_ROW_GAP;
      usedYsInCol.push(y);
      return y;
    }
    (layout.genColumns[i]||[]).forEach(comp=>{
      const y = claimY(rowY(layout.rowOf.get(comp.id) ?? 0));
      ys.set(comp.id, y);
      maxBottom = Math.max(maxBottom, y+CC_COMP_H);
    });
    genY.push(ys);
    (layout.terminalGroupsByCol[i]||[]).forEach(group=>{
      const groupRow = Math.min(...group.map(c=> layout.rowOf.get(c.id) ?? 0));
      const y = claimY(rowY(groupRow));
      termStackY.set(group, y);
      maxBottom = Math.max(maxBottom, y+CC_COMP_H+(group.length>1?10:0));
    });
  }
  // Unified lookup from ANY relevant component to its actual rendered center-Y and column — the
  // routing pass below needs this rather than recomputing from rowOf directly, since claimY's
  // collision avoidance above can shift a box away from its naive row position, and a pure
  // consumer folded into a terminal group has no Y of its own at all — it shares its group's.
  const actualCenterY = new Map(); // comp.id -> center Y
  const actualCol = new Map(); // comp.id -> column index
  // Per-PORT Y, not just per-component — a component with more than one clock port (say, two
  // inputs from two different clocks) needs each one to land at its own distinct height, or every
  // connection touching that component converges on the same point and overlaps right at the edge
  // it enters. Drawn as small markers on the component's own edge, same idea as the box itself.
  const portY = new Map(); // port.id -> y
  function assignPortYs(comp, y0){
    const mid = y0 + CC_COMP_H/2;
    function centerAssign(ports){
      const n = ports.length;
      const startOffset = -(n-1)/2 * 16;
      ports.forEach((p,i)=>{ portY.set(p.id, mid + startOffset + i*16); });
    }
    centerAssign((comp.clockPorts||[]).filter(p=>p.direction==='input'));
    centerAssign((comp.clockPorts||[]).filter(p=>p.direction==='output'));
  }
  for(let i=0;i<=layout.maxRank;i++){
    (layout.genColumns[i]||[]).forEach(comp=>{
      actualCenterY.set(comp.id, genY[i].get(comp.id)+CC_COMP_H/2); actualCol.set(comp.id, i);
      assignPortYs(comp, genY[i].get(comp.id));
    });
    (layout.terminalGroupsByCol[i]||[]).forEach(group=>{
      const y0 = termStackY.get(group);
      const y = y0+CC_COMP_H/2;
      group.forEach(c=>{ actualCenterY.set(c.id, y); actualCol.set(c.id, i); });
      assignPortYs(group[0], y0); // only the representative's own ports are ever drawn/tapped
    });
  }
  function portYOf(port, fallbackCompId){
    return port ? (portY.get(port.id) ?? actualCenterY.get(fallbackCompId)) : actualCenterY.get(fallbackCompId);
  }
  // A backward connection's fallback jog can reach below the last row's normal bottom edge (it
  // needs room below whichever of its own generator/targets sits lowest) — account for that before
  // finalizing the canvas height, or that jog gets silently clipped by the SVG's own viewBox.
  routingPlans.forEach((plan, domainId)=>{
    if(plan.bwd.length){
      const d = layout.allDomains.find(x=>x.id===domainId);
      const gy = portYOf(d.generatorPort, d.generator.id);
      const allYs = plan.bwd.map(t=> portYOf(t.port, t.comp.id)).concat([gy]);
      const jogY = Math.max(...allYs) + CC_COMP_H/2 + 14;
      maxBottom = Math.max(maxBottom, jogY);
    }
  });
  // An exit's straight path at the generator's own row can cross through a real, unrelated box —
  // a different output port on the same generator might have its OWN same-row target sitting in
  // the last column, and since ports on one component sit close together, an exit anchored at a
  // NEARBY port's row can still fall within that box's height even though it has nothing to do
  // with this specific clock. Detour any exit whose straight path would cross something it isn't
  // actually connected to, to a dedicated row below everything — computed once here so both the
  // canvas height and the actual drawing agree on where each detoured exit ends up.
  const domainExitY = new Map(); // domain.id -> y
  let exitDetourCount = 0;
  function boxSpansY(compId, y){
    const cy = actualCenterY.get(compId);
    return cy !== undefined && Math.abs(cy-y) < CC_COMP_H/2;
  }
  routingPlans.forEach((plan, domainId)=>{
    const d = layout.allDomains.find(x=>x.id===domainId);
    if(!d.exitsToParent) return;
    const gy = portYOf(d.generatorPort, d.generator.id);
    let blocked = false;
    for(let col=plan.gc+1; col<=layout.maxRank && !blocked; col++){
      (layout.genColumns[col]||[]).forEach(comp=>{ if(boxSpansY(comp.id, gy)) blocked = true; });
      (layout.terminalGroupsByCol[col]||[]).forEach(group=>{ const rep=group[0]; if(boxSpansY(rep.id, gy)) blocked = true; });
    }
    if(blocked){
      const y = maxBottom + 20 + exitDetourCount*20;
      exitDetourCount++;
      domainExitY.set(domainId, y);
      maxBottom = Math.max(maxBottom, y);
    } else {
      domainExitY.set(domainId, gy);
    }
  });
  const totalH = maxBottom + 40;

  const svg = svgEl('svg', {width:totalW, height:totalH, viewBox:`0 0 ${totalW} ${totalH}`}, container);

  function tapArrow(fromX, fromY, toX, toY, color, kind){
    const dash = kind==='reset' ? '5,3' : 'none';
    svgEl('line',{x1:fromX,y1:fromY,x2:toX,y2:toY,stroke:color,'stroke-width':2,'stroke-dasharray':dash},svg);
    const dir = toX>=fromX ? 1 : -1, s=5;
    svgEl('polygon',{points:`${toX},${toY} ${toX-dir*s},${toY-s} ${toX-dir*s},${toY+s}`,fill:color},svg);
  }
  function drawBox(x0, y0, comp, isGen){
    const bg = comp.bgColor || typeDefaultBgColor(comp) || '#3a4a63';
    svgEl('rect',{x:x0,y:y0,width:CC_COMP_W,height:CC_COMP_H,rx:3,fill:bg,stroke:'#0b0e14','stroke-width':1.5},svg);
    const lines = wrapAllocLabel(comp.instanceName, CC_COMP_W-10, 11, 2);
    let ty = y0+14;
    lines.forEach(line=>{ svgEl('text',{x:x0+CC_COMP_W/2,y:ty,'text-anchor':'middle',fill:'#fff','font-size':11},svg).textContent=line; ty+=13; });
  }

  // Each column (0..maxRank) renders its own generators, then any terminal (pure-consumer) groups
  // that share that same computed rank — continuing the same vertical stack from directly above.
  function drawPortMarker(x0, p, hideLabel){
    const y = portY.get(p.id);
    if(y===undefined) return;
    const domainId = p.assignedClockId;
    const d = domainId ? layout.allDomains.find(x=>x.id===domainId) : null;
    const color = d ? d.color : '#5a6578';
    const px = p.direction==='input' ? x0-6 : x0+CC_COMP_W-6;
    svgEl('rect',{x:px,y:y-6,width:12,height:12,fill:color,stroke:'#0b0e14','stroke-width':1},svg);
    if(hideLabel) return;
    const labelX = p.direction==='input' ? x0+8 : x0+CC_COMP_W-8;
    svgEl('text',{x:labelX,y:y+3,'text-anchor': p.direction==='input'?'start':'end','font-size':9,fill:'#e8ecf2'},svg).textContent = p.name;
  }
  for(let colIdx=0; colIdx<=layout.maxRank; colIdx++){
    const x0 = colX[colIdx];
    (layout.genColumns[colIdx]||[]).forEach(comp=>{
      const y0 = genY[colIdx].get(comp.id);
      drawBox(x0, y0, comp, true);
      (comp.clockPorts||[]).forEach(p=> drawPortMarker(x0, p, false));
      // Only external (no on-sheet generator) inputs need anything else drawn here — every other
      // connection, forward or backward, was already fully drawn by the routing pass above,
      // arrowheads included. A true ingress input always reaches the far-left external lane and
      // connects with a line spanning however many columns lie in between — not just when its
      // consuming component happens to land in column 0, since a component can have both a direct
      // ingress input AND a real intra dependency that ranks it further right.
      (comp.clockPorts||[]).forEach(p=>{
        if(p.direction!=='input') return;
        const domainId = p.assignedClockId;
        const d = domainId ? layout.allDomains.find(x=>x.id===domainId) : null;
        const py = portY.get(p.id);
        if(d && d.generatorRank===null){
          svgEl('rect',{x:externalStubX-4,y:py-6,width:12,height:12,fill:d.color},svg);
          tapArrow(externalStubX+8, py, x0, py, d.color, 'clock');
          svgEl('text',{x:externalStubX-10,y:py+3,'text-anchor':'end','font-size':9,fill:d.color},svg).textContent = d.name;
        }
      });
    });

    // This column's terminal (pure-consumer) groups, if any — sharing colX[colIdx], continuing
    // the same vertical stack directly below this column's own generators.
    (layout.terminalGroupsByCol[colIdx]||[]).forEach(group=>{
      const y0 = termStackY.get(group);
      const rep = group[0];
      if(group.length>1){
        for(let k=Math.min(group.length,3)-1;k>=0;k--){
          svgEl('rect',{x:x0+k*CC_STACK_OFFSET,y:y0+k*CC_STACK_OFFSET,width:CC_COMP_W,height:CC_COMP_H,rx:3,
            fill: rep.bgColor||typeDefaultBgColor(rep)||'#3a4a63', stroke:'#0b0e14','stroke-width':1.5},svg);
        }
        svgEl('text',{x:x0+CC_COMP_W/2,y:y0+18,'text-anchor':'middle',fill:'#fff','font-size':11},svg).textContent = rep.instanceName;
        const badgeX = x0+CC_COMP_W+(Math.min(group.length,3)-1)*CC_STACK_OFFSET;
        svgEl('circle',{cx:badgeX, cy:y0-2, r:11, fill:'#1a2130', stroke:'#7c8798','stroke-width':1},svg);
        svgEl('text',{x:badgeX,y:y0+2,'text-anchor':'middle',fill:'#cfd8e3','font-size':10,'font-weight':'600'},svg).textContent = `${group.length}`;
      } else {
        drawBox(x0, y0, rep, false);
      }
      (rep.clockPorts||[]).forEach(p=> drawPortMarker(x0, p, false));
      (rep.clockPorts||[]).forEach(p=>{
        const domainId = p.assignedClockId;
        if(p.direction!=='input' || !domainId) return;
        const d = layout.allDomains.find(x=>x.id===domainId);
        if(!d || d.generatorRank!==null) return; // real generators handled entirely by the routing pass above
        // External/boundary-sourced input reaching a TERMINAL consumer: same far-left external
        // lane as any other ingress input, for visual consistency — a clock crossing this sheet's
        // own boundary reads the same way regardless of which column its consumer lands in.
        const py = portY.get(p.id);
        svgEl('rect',{x:externalStubX-4,y:py-6,width:12,height:12,fill:d.color},svg);
        tapArrow(externalStubX+8, py, x0, py, d.color, 'clock');
        svgEl('text',{x:externalStubX-10,y:py+3,'text-anchor':'end','font-size':9,fill:d.color},svg).textContent = d.name;
      });
    });
  }
  // Draw each domain's routing: a forward connection is one straight line at the generator's own
  // row, arrowheads dropped in directly at each same-row target, and a short vertical branch (with
  // its own sub-taps) at the last gutter before each different-row target's column — never any
  // earlier, so a straight-through run never has to detour around a branch meant for something
  // else. A domain with no real on-sheet target left to reach (only an exit, or nothing at all)
  // still gets its trunk drawn far enough to reach the exit lane.
  const tapRadius = 5;
  function arrowheadAt(tx, ty, color){
    const s = tapRadius;
    svgEl('polygon',{points:`${tx},${ty} ${tx-s},${ty-s} ${tx-s},${ty+s}`,fill:color},svg);
  }
  routingPlans.forEach((plan, domainId)=>{
    const d = layout.allDomains.find(x=>x.id===domainId);
    const gy = portYOf(d.generatorPort, d.generator.id);
    const gRightEdge = colX[plan.gc] + CC_COMP_W;
    const dash = d.kind==='reset' ? '5,3' : 'none';
    // The plain gy-level trunk only needs to reach as far as branches require — same-row targets
    // and the exit are drawn as their own independent paths below.
    let gyReachX = gRightEdge;
    plan.fwd.branchByCol.forEach((targets,col)=>{
      const g = branchGutterFor(plan, col);
      const gx = colX[g] + CC_COMP_W + CC_GUTTER_PAD + (branchXIndex.get(g+':'+domainId+':f')||0)*CC_BAR_GAP;
      gyReachX = Math.max(gyReachX, gx);
    });
    if(gyReachX > gRightEdge){
      svgEl('line',{x1:gRightEdge,y1:gy,x2:gyReachX,y2:gy,stroke:d.color,'stroke-width':2,'stroke-dasharray':dash},svg);
    }
    plan.fwd.sameRow.forEach(t=>{
      const ty = portYOf(t.port, t.comp.id);
      const tx = colX[t.col];
      if(Math.abs(ty-gy) > 0.5){
        const elbowX = tx - 10;
        svgEl('line',{x1:gRightEdge,y1:gy,x2:elbowX,y2:gy,stroke:d.color,'stroke-width':2,'stroke-dasharray':dash},svg);
        svgEl('line',{x1:elbowX,y1:gy,x2:elbowX,y2:ty,stroke:d.color,'stroke-width':2,'stroke-dasharray':dash},svg);
        svgEl('line',{x1:elbowX,y1:ty,x2:tx,y2:ty,stroke:d.color,'stroke-width':2,'stroke-dasharray':dash},svg);
      } else if(tx > gRightEdge){
        svgEl('line',{x1:gRightEdge,y1:gy,x2:tx,y2:gy,stroke:d.color,'stroke-width':2,'stroke-dasharray':dash},svg);
      }
      arrowheadAt(tx, ty, d.color);
    });
    plan.fwd.branchByCol.forEach((targets,col)=>{
      const g = branchGutterFor(plan, col);
      const gx = colX[g] + CC_COMP_W + CC_GUTTER_PAD + (branchXIndex.get(g+':'+domainId+':f')||0)*CC_BAR_GAP;
      const tys = targets.map(t=> portYOf(t.port, t.comp.id));
      const y1 = Math.min(gy, ...tys), y2 = Math.max(gy, ...tys);
      svgEl('line',{x1:gx,y1,x2:gx,y2,stroke:d.color,'stroke-width':2,'stroke-dasharray':dash},svg);
      targets.forEach(t=>{
        const ty = portYOf(t.port, t.comp.id);
        svgEl('line',{x1:gx,y1:ty,x2:colX[t.col],y2:ty,stroke:d.color,'stroke-width':2,'stroke-dasharray':dash},svg);
        arrowheadAt(colX[t.col], ty, d.color);
      });
    });
    // Backward targets (rare): a component consuming a clock generated by something ranked LATER
    // than itself. Doesn't fit the single-direction trunk model — the generator's output is on its
    // right edge, so reaching leftward would mean crossing back through its own box — so this
    // falls back to a simple local bar-and-jog instead, using the gutter width already reserved
    // for it above.
    if(plan.bwd.length){
      const minCol = Math.min(...plan.bwd.map(t=>t.col));
      const allYs = plan.bwd.map(t=> portYOf(t.port, t.comp.id)).concat([gy]);
      const jogY = Math.max(...allYs) + CC_COMP_H/2 + 14;
      const segX = [];
      for(let g=minCol; g<plan.gc; g++){
        const gx = colX[g] + CC_COMP_W + CC_GUTTER_PAD + (branchXIndex.get(g+':'+domainId+':b')||0)*CC_BAR_GAP;
        segX.push(gx);
        svgEl('line',{x1:gx,y1:Math.min(gy,jogY),x2:gx,y2:Math.max(gy,jogY),stroke:d.color,'stroke-width':2,'stroke-dasharray':dash},svg);
      }
      svgEl('line',{x1:colX[plan.gc],y1:gy,x2:segX[segX.length-1],y2:gy,stroke:d.color,'stroke-width':2,'stroke-dasharray':dash},svg);
      svgEl('line',{x1:segX[0],y1:jogY,x2:segX[segX.length-1],y2:jogY,stroke:d.color,'stroke-width':2,'stroke-dasharray':dash},svg);
      plan.bwd.forEach(t=>{
        const gx = colX[t.col] + CC_COMP_W + CC_GUTTER_PAD + (branchXIndex.get(t.col+':'+domainId+':b')||0)*CC_BAR_GAP;
        const ty = portYOf(t.port, t.comp.id);
        svgEl('line',{x1:gx,y1:jogY,x2:gx,y2:ty,stroke:d.color,'stroke-width':2,'stroke-dasharray':dash},svg);
        svgEl('line',{x1:gx,y1:ty,x2:colX[t.col]+CC_COMP_W,y2:ty,stroke:d.color,'stroke-width':2,'stroke-dasharray':dash},svg);
        arrowheadAt(colX[t.col]+CC_COMP_W, ty, d.color);
      });
    }
    if(d.exitsToParent){
      const exitY = domainExitY.get(domainId);
      if(exitY !== gy){
        const elbowX = gRightEdge + 10;
        svgEl('line',{x1:gRightEdge,y1:gy,x2:elbowX,y2:gy,stroke:d.color,'stroke-width':2,'stroke-dasharray':dash},svg);
        svgEl('line',{x1:elbowX,y1:gy,x2:elbowX,y2:exitY,stroke:d.color,'stroke-width':2,'stroke-dasharray':dash},svg);
        svgEl('line',{x1:elbowX,y1:exitY,x2:exitStubX+8,y2:exitY,stroke:d.color,'stroke-width':2,'stroke-dasharray':dash},svg);
      } else {
        svgEl('line',{x1:gRightEdge,y1:gy,x2:exitStubX+8,y2:gy,stroke:d.color,'stroke-width':2,'stroke-dasharray':dash},svg);
      }
      svgEl('rect',{x:exitStubX+8,y:exitY-6,width:12,height:12,fill:d.color},svg);
      svgEl('text',{x:exitStubX+24,y:exitY+4,'font-size':9,fill:d.color},svg).textContent = d.name;
    }
  });
}
// Scoped to whichever sheet is active when opened — clocks/resets are local to a container level
// (see syncClockingBoundary), so "the whole design's clocks" isn't a meaningful list anymore.
function openClocksModal(){
  const root = document.getElementById('modalRoot');
  let flattened = false;

  function draw(){
    const sheet = curSheet();
    ensureSheetClocking(sheet);
    root.innerHTML = '';
    const overlay = document.createElement('div'); overlay.className='overlay';
    const modal = document.createElement('div'); modal.className='modal clocksModal';
    modal.style.width = '95vw'; modal.style.maxWidth = '1400px';
    modal.innerHTML = `<h3>Clocks & Resets — ${escapeHtml(sheet.name)}</h3>
      <div style="color:var(--dim);font-size:11px;margin-top:-6px;margin-bottom:8px;">Local to this sheet. Switch sheets (tabs above the canvas) to work on a different container's clocks. Assign on the left; the chain on the right updates live as you drag.</div>
      <div style="display:flex;gap:14px;align-items:flex-start;">
        <div style="flex:0 0 340px;">
          <div style="font-weight:600;font-size:12px;color:var(--accent);margin-bottom:4px;">Clock Assignment</div>
          <div id="ckAssign" style="border:1px solid var(--line);border-radius:4px;padding:8px;max-height:70vh;overflow-y:auto;"></div>
        </div>
        <div style="flex:1 1 auto;min-width:0;">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
            <div style="font-weight:600;font-size:12px;color:var(--accent);">Clock Diagram</div>
            <label style="font-size:11px;color:var(--dim);display:flex;align-items:center;gap:5px;cursor:pointer;" title="Recursively inline every Subsystem/CCA/FPGA's own interior, so every clock dependency across the whole design is visible in one diagram — not just this sheet's local view.">
              <input type="checkbox" id="ckFlatten" ${flattened?'checked':''}> Flatten hierarchy
            </label>
          </div>
          <div id="ckChain" style="border:1px solid var(--line);border-radius:4px;padding:8px;max-height:70vh;overflow:auto;"></div>
        </div>
      </div>
      <div class="modalBtns"><button id="ckClose">Close</button></div>`;
    overlay.appendChild(modal); root.appendChild(overlay);
    const assignBody = modal.querySelector('#ckAssign');
    const chainBody = modal.querySelector('#ckChain');
    function refreshChain(){ chainBody.innerHTML=''; renderClockChainDiagram(chainBody, flattened ? buildFlattenedSheet(sheet) : sheet); }
    drawClocksAssignTab(assignBody, sheet, refreshChain);
    refreshChain();
    modal.querySelector('#ckFlatten').onchange = (e)=>{ flattened = e.target.checked; refreshChain(); };
    modal.querySelector('#ckClose').onclick = ()=>{ root.innerHTML=''; render(); };
  }
  draw();
}
// The matrix: SOURCE clock ports (outputs — real component output ports, plus any incoming
// boundary pass-through clock, which acts as a source from this sheet's perspective) as columns;
// SINK clock ports (inputs — real component input ports, plus any outgoing boundary pass-through,
// which needs to be fed by something internal) as rows. A checked cell means that source feeds
// that sink. A row can only have one checked cell (a sink port has exactly one driver), enforced
// the same way single assignment always has been — setting a port's assignedClockId simply
// overwrites whatever it held before, so checking a new cell in a row naturally un-checks any
// other. A column can have many checked cells (one source fanning out to several sinks) — that's
// normal and expected. Where either side of a cell is a boundary pass-through, that pass-through's
// own id IS the shared clock id (it can't be renamed to alias something else — it's tied to a
// specific parent port), so it drives what the OTHER side gets assigned to, not the reverse.
// Checking a cell where BOTH sides are boundary pass-throughs is refused — merging two distinct
// real boundary crossings into one doesn't mean anything.
function collectClockMatrixItems(sheet){
  const realSources = [], realSinks = [], boundarySources = [], boundarySinks = [];
  sheet.components.forEach(comp=>{
    if(comp.isCCA) return;
    (comp.clockPorts||[]).forEach(port=>{
      const label = comp.instanceName+'.'+port.name;
      if(port.direction==='output') realSources.push({ kind:'port', comp, port, label });
      else realSinks.push({ kind:'port', comp, port, label });
    });
  });
  sheet.clocks.forEach(d=>{
    const dir = boundaryClockDirection(sheet, d);
    if(dir==='input') boundarySources.push({ kind:'boundary', clock:d, label:d.name });
    else if(dir==='output') boundarySinks.push({ kind:'boundary', clock:d, label:d.name });
  });
  // The "sandwich": clocks coming INTO this container are listed first among sources, and clocks
  // going OUT of it sort last among sinks — so the list reads top-to-bottom as in, through, out.
  return { sources: [...boundarySources, ...realSources], sinks: [...realSinks, ...boundarySinks] };
}
// A source's color comes from its actual clock once it's connected to one (kept consistent with
// how that same clock would be colored anywhere else), and from a stable placeholder — based on
// its own position among the sources — before that, so every column is visually distinct from the
// moment the grid is drawn, not just once wired up.
function clockMatrixSourceColor(sheet, item, index){
  if(item.kind==='boundary') return clockDomainColor(sheet, 'clock', item.clock.id);
  if(item.port.assignedClockId) return clockDomainColor(sheet, 'clock', item.port.assignedClockId);
  return CLOCK_CHAIN_PALETTE[index % CLOCK_CHAIN_PALETTE.length];
}
function clockMatrixCellState(sourceItem, sinkItem){
  if(sourceItem.kind==='boundary' && sinkItem.kind==='boundary') return 'disabled';
  const sinkClockId = sinkItem.kind==='boundary' ? null : sinkItem.port.assignedClockId; // boundary sinks aren't "assigned" themselves
  if(sourceItem.kind==='boundary'){
    // A boundary source's own id is the shared identity; the sink is checked iff it's assigned to it.
    return (sinkItem.kind==='port' && sinkItem.port.assignedClockId===sourceItem.clock.id) ? 'checked' : 'unchecked';
  }
  if(sinkItem.kind==='boundary'){
    return (sourceItem.port.assignedClockId===sinkItem.clock.id) ? 'checked' : 'unchecked';
  }
  // Neither is boundary: checked iff both real ports share the same non-null clock id.
  return (sourceItem.port.assignedClockId && sourceItem.port.assignedClockId===sinkItem.port.assignedClockId) ? 'checked' : 'unchecked';
}
function setClockMatrixCell(sheet, sourceItem, sinkItem, checked){
  if(sourceItem.kind==='boundary' && sinkItem.kind==='boundary') return;
  if(!checked){
    if(sinkItem.kind==='port'){ sinkItem.port.assignedClockId = null; syncClockingBoundary(sinkItem.comp); syncLinkedComponent(sinkItem.comp); }
    // Unchecking a boundary sink means "nothing feeds it" — that's whatever component output
    // still points at it stops pointing at it; simplest correct action is clearing the SOURCE
    // side instead, since the boundary sink has no field of its own to clear.
    else if(sourceItem.kind==='port'){ sourceItem.port.assignedClockId = null; syncClockingBoundary(sourceItem.comp); syncLinkedComponent(sourceItem.comp); }
    return;
  }
  let clockId;
  if(sourceItem.kind==='boundary') clockId = sourceItem.clock.id;
  else if(sinkItem.kind==='boundary') clockId = sinkItem.clock.id;
  else {
    // Only the SOURCE's own existing clock counts here — never the sink's. The sink is being
    // (re)connected to this source specifically; if it already had a different clock from wherever
    // it used to be, that has no bearing on what this source's identity should be. Falling back to
    // the sink's prior clock silently merged two unrelated sources together the moment a sink that
    // used to belong to one was dragged onto the other.
    clockId = sourceItem.port.assignedClockId;
    if(!clockId){
      const d = newClock('CLK'+(sheet.clocks.length+1));
      sheet.clocks.push(d);
      clockId = d.id;
    }
  }
  if(sinkItem.kind==='port'){
    if(!trySetClockAssignment(sheet, sinkItem.comp, sinkItem.port, clockId)) return;
  }
  if(sourceItem.kind==='port'){
    trySetClockAssignment(sheet, sourceItem.comp, sourceItem.port, clockId);
  }
}
function clearSinkAssignment(sheet, sinkItem){
  if(sinkItem.kind==='port'){
    sinkItem.port.assignedClockId = null;
    syncClockingBoundary(sinkItem.comp); syncLinkedComponent(sinkItem.comp);
  } else {
    // Boundary sink: it has no field of its own — clear whichever real port currently points at it.
    sheet.components.forEach(comp=> (comp.clockPorts||[]).forEach(p=>{
      if(p.assignedClockId===sinkItem.clock.id){ p.assignedClockId = null; syncClockingBoundary(comp); syncLinkedComponent(comp); }
    }));
  }
}
// A hierarchical list instead of a grid: each source is a fixed top-level group; each sink is a
// draggable item living under whichever source currently feeds it (or under "Unassigned" if
// nothing does yet). Dragging a sink onto a different group reassigns it — same underlying
// connection logic as before (setClockMatrixCell), just triggered by a drop instead of a checkbox.
// Typing a name on a source always ensures THAT source has a clock uniquely its own — if it
// doesn't have one yet, a new one is created; if its current clock is shared with some OTHER
// source (two sources should never really share one clock, but see the note in
// setClockMatrixCell about how that could previously happen), it's split off onto a brand-new
// clock instead of renaming the shared one out from under the other source. This also happens to
// be the fix for any already-merged sources: retyping a name on either one detaches it cleanly.
function isClockSharedWithOtherSource(sources, thisIndex, clockId){
  return sources.some((s,i)=> i!==thisIndex && s.kind==='port' && s.port.assignedClockId===clockId);
}
function renameOrDetachSourceClock(sheet, sources, sourceIndex, newName){
  const sourceItem = sources[sourceIndex];
  if(sourceItem.kind==='boundary'){
    sourceItem.clock.name = newName;
    return;
  }
  const currentId = sourceItem.port.assignedClockId;
  if(!currentId || isClockSharedWithOtherSource(sources, sourceIndex, currentId)){
    const d = newClock(newName);
    sheet.clocks.push(d);
    trySetClockAssignment(sheet, sourceItem.comp, sourceItem.port, d.id);
  } else {
    const d = sheet.clocks.find(c=>c.id===currentId);
    if(d) d.name = newName;
  }
}
function drawClocksAssignTab(container, sheet, onChange){
  const { sources, sinks } = collectClockMatrixItems(sheet);
  if(sources.length===0 || sinks.length===0){
    container.innerHTML = '<div style="color:var(--dim);font-size:12px;padding:8px 0;">Need at least one output clock port (source) and one input clock port (sink) on this sheet — add them via each component\'s Edit Properties → Clocking tab.</div>';
    return;
  }
  function draw(){
    const sourceColors = sources.map((s,i)=> clockMatrixSourceColor(sheet, s, i));
    const groupOf = sinks.map(sink=>{
      for(let ci=0; ci<sources.length; ci++){
        if(clockMatrixCellState(sources[ci], sink)==='checked') return ci;
      }
      return null;
    });
    container.innerHTML = '';
    const root = document.createElement('div');
    root.style.cssText = 'font-size:12px;';

    function makeSinkItem(ri, color){
      const sink = sinks[ri];
      const item = document.createElement('div');
      item.textContent = sink.label;
      item.draggable = true;
      item.style.cssText = `margin-left:22px;padding:4px 8px;color:${color};font-weight:600;cursor:grab;border-radius:3px;`;
      item.addEventListener('mouseenter', ()=>{ item.style.background = 'var(--panel2)'; });
      item.addEventListener('mouseleave', ()=>{ item.style.background = ''; });
      item.addEventListener('dragstart', (e)=>{
        e.dataTransfer.setData('text/plain', String(ri));
        e.dataTransfer.effectAllowed = 'move';
      });
      return item;
    }
    function makeGroup(sourceLabel, headerColor, sourceIndexOrNull, currentName){
      const groupEl = document.createElement('div');
      groupEl.style.cssText = 'margin-bottom:2px;border-radius:4px;';
      const header = document.createElement('div');
      header.style.cssText = `padding:5px 8px;color:${headerColor};font-weight:600;font-size:11px;background:var(--bg);border-radius:3px;display:flex;align-items:center;gap:8px;`;
      const labelSpan = document.createElement('span');
      labelSpan.textContent = sourceLabel;
      labelSpan.style.cssText = 'white-space:normal;word-break:break-word;flex:0 1 180px;';
      header.appendChild(labelSpan);
      if(sourceIndexOrNull!==null){
        const nameInput = document.createElement('input');
        nameInput.type = 'text';
        nameInput.value = currentName || '';
        nameInput.placeholder = 'name this wire…';
        nameInput.style.cssText = `flex:1;background:var(--panel2);border:1px solid var(--line);color:${headerColor};padding:2px 6px;border-radius:3px;font-size:11px;font-family:inherit;`;
        nameInput.addEventListener('click', (e)=> e.stopPropagation());
        nameInput.addEventListener('change', (e)=>{
          const val = e.target.value.trim();
          if(val) renameOrDetachSourceClock(sheet, sources, sourceIndexOrNull, val);
          draw();
          if(onChange) onChange();
        });
        header.appendChild(nameInput);
      }
      groupEl.appendChild(header);
      groupEl.addEventListener('dragover', (e)=>{ e.preventDefault(); e.dataTransfer.dropEffect='move'; groupEl.style.outline = '1px dashed var(--accent)'; });
      groupEl.addEventListener('dragleave', ()=>{ groupEl.style.outline = ''; });
      groupEl.addEventListener('drop', (e)=>{
        e.preventDefault();
        groupEl.style.outline = '';
        const ri = +e.dataTransfer.getData('text/plain');
        const sinkItem = sinks[ri];
        if(sourceIndexOrNull===null){
          clearSinkAssignment(sheet, sinkItem);
        } else {
          const sourceItem = sources[sourceIndexOrNull];
          if(sourceItem.kind==='boundary' && sinkItem.kind==='boundary'){
            alert('Both of these are pass-through clocks from this sheet\'s own parent component, representing two different boundary crossings — they can\'t be linked to each other.');
          } else {
            setClockMatrixCell(sheet, sourceItem, sinkItem, true);
          }
        }
        draw();
        if(onChange) onChange();
      });
      return groupEl;
    }

    sources.forEach((src, ci)=>{
      const currentClockId = src.kind==='boundary' ? src.clock.id : src.port.assignedClockId;
      const currentClock = currentClockId ? sheet.clocks.find(c=>c.id===currentClockId) : null;
      const group = makeGroup(src.label, sourceColors[ci], ci, currentClock ? currentClock.name : '');
      sinks.forEach((sink, ri)=>{ if(groupOf[ri]===ci) group.appendChild(makeSinkItem(ri, sourceColors[ci])); });
      root.appendChild(group);
    });
    const unassignedGroup = makeGroup('(Unassigned)', 'var(--dim)', null);
    sinks.forEach((sink, ri)=>{ if(groupOf[ri]===null) unassignedGroup.appendChild(makeSinkItem(ri, 'var(--text)')); });
    root.appendChild(unassignedGroup);

    container.appendChild(root);
  }
  draw();
}

function findProtocolRefNode(nodes, protocolId){
  for(const n of nodes){
    if(n.type==='protocol' && n.protocolId===protocolId) return n;
    if(n.type==='folder'){ const f = findProtocolRefNode(n.children, protocolId); if(f) return f; }
  }
  return null;
}
function openProtocolsModal(){

    const modal = document.createElement('div'); modal.className='modal';

    const proto = selectedId ? state.protocols.find(p=>p.id===selectedId) : null;

    modal.innerHTML = `<h3>Protocols</h3>
      <div style="display:flex;gap:14px;align-items:flex-start;">

          <div style="display:flex;gap:6px;margin-top:6px;">

            <button id="pgNewProtoRoot">+ Protocol</button>
          </div>
        </div>
        <div style="flex:1 1 auto;min-width:0;">
