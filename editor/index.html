          <div style="font-weight:600;font-size:13px;color:var(--accent);margin-bottom:6px;">${escapeHtml(proto.name)}</div>
          <div style="display:flex;gap:6px;margin-bottom:12px;">
            <button id="prRename">Rename</button><button id="prDelete" style="color:var(--bad);">Delete</button>
          </div>
          <label>Roles <span style="color:var(--dim);font-weight:normal;">(optional — e.g. Master / Slave)</span></label>
          <div id="prRoles"></div>
          <button id="prAddRole" style="margin-top:4px;">+ Add Role</button>
          <label style="margin-top:14px;">Signals <span style="color:var(--dim);font-weight:normal;">(optional — leave empty and fill in later)</span></label>
          <div id="prSignals"></div>
          <button id="prAddSignal" style="margin-top:4px;">+ Add Signal</button>
          ` : '<div style="color:var(--dim);font-size:11px;">Select a protocol on the left, or create a new one.</div>'}
        </div>
      </div>
      <div class="modalBtns"><button id="prClose">Close</button></div>`;
    overlay.appendChild(modal); root.appendChild(overlay);

    // ---------- Left pane: the grouping tree ----------
    const treeBody = modal.querySelector('#pgTree');
    function addFolderTo(childrenArr){
      const nm = prompt('Group name:', 'New Group'); if(!nm || !nm.trim()) return;
      childrenArr.push(protocolGroupFolder(nm.trim()));
      draw();
    }
    function addProtocolTo(childrenArr){
      const nm = prompt('Protocol name:', 'New Protocol'); if(!nm || !nm.trim()) return;
      const p = newProtocol(nm.trim());
      state.protocols.push(p);
      childrenArr.push({ id: uid('pref'), type:'protocol', protocolId: p.id });
      selectedId = p.id;
      draw();
    }
    function renderProtoLeaf(protocolId, container, depth){
      const p = state.protocols.find(x=>x.id===protocolId);
      if(!p) return; // a stale reference (shouldn't normally happen) — just skip it rather than error
      const d = document.createElement('div');
      d.textContent = p.name;
      d.style.cssText = `padding:2px 6px;padding-left:${depth*12+6}px;cursor:pointer;border-radius:3px;`
        + (p.id===selectedId ? 'background:var(--accent);color:#fff;' : '');
      d.onmouseenter = ()=>{ if(p.id!==selectedId) d.style.background='var(--panel2)'; };
      d.onmouseleave = ()=>{ if(p.id!==selectedId) d.style.background=''; };
      d.onclick = ()=>{ selectedId = p.id; draw(); };
      container.appendChild(d);
    }
    function renderGroupNode(node, container, depth){
      const head = document.createElement('div');
      head.style.cssText = `padding-left:${depth*12}px;display:flex;align-items:center;gap:4px;font-weight:600;`;
      const label = document.createElement('span');
      label.textContent = (collapsedGroups.has(node.id)?'▸ ':'▾ ') + node.name;
      label.style.cursor = 'pointer';
      label.onclick = ()=>{ if(collapsedGroups.has(node.id)) collapsedGroups.delete(node.id); else collapsedGroups.add(node.id); draw(); };
      head.appendChild(label);
      const mkBtn = (txt, title, fn)=>{ const b=document.createElement('button'); b.textContent=txt; b.title=title; b.style.cssText='font-size:10px;padding:0px 4px;line-height:1.6;'; b.onclick=(e)=>{ e.stopPropagation(); fn(); }; return b; };
      head.appendChild(mkBtn('+G','Add sub-group here', ()=>addFolderTo(node.children)));

      head.appendChild(mkBtn('×','Delete group (protocols inside become ungrouped, not deleted)', ()=>{

          removeProtocolGroupNode(state.protocolGroups, node.id);
          draw();

      if(!collapsedGroups.has(node.id)){

    const ungrouped = state.protocols.filter(p=> !groupedProtocolIds(state.protocolGroups).has(p.id));

    }
    state.protocolGroups.forEach(node=> renderGroupNode(node, treeBody, 0));

    modal.querySelector('#pgNewFolderRoot').onclick = ()=> addFolderTo(state.protocolGroups);
    modal.querySelector('#pgNewProtoRoot').onclick = ()=> addProtocolTo(state.protocolGroups);

    // ---------- Right pane: the selected protocol's own definition (unchanged from before) ----------
    if(proto){
      modal.querySelector('#prRename').onclick = ()=>{
        const nm = prompt('Protocol name:', proto.name); if(!nm || !nm.trim()) return;
        proto.name = nm.trim(); draw();
      };
      modal.querySelector('#prDelete').onclick = ()=>{
        if(confirm('Delete protocol "'+proto.name+'"? Ports already tagged with it keep working but will show as referencing a deleted protocol.')){
          state.protocols = state.protocols.filter(p=>p.id!==proto.id);
          const refNode = findProtocolRefNode(state.protocolGroups, proto.id);
          if(refNode) removeProtocolGroupNode(state.protocolGroups, refNode.id);
          selectedId = null;
          draw();
        }
      };
      const rolesWrap = modal.querySelector('#prRoles');
      if(proto.roles.length===0) rolesWrap.innerHTML = '<div style="color:var(--dim);font-size:11px;">No roles yet.</div>';
      proto.roles.forEach((r,i)=>{
        const row = document.createElement('div'); row.className='portRow';
        row.innerHTML = `<input value="${escapeHtml(r)}" data-i="${i}" class="roleName" style="flex:2;">
          <button data-i="${i}" class="roleDel">×</button>`;
        rolesWrap.appendChild(row);
      });
      rolesWrap.querySelectorAll('.roleName').forEach(el=> el.oninput=(e)=>{ proto.roles[+e.target.dataset.i] = e.target.value; });
      rolesWrap.querySelectorAll('.roleDel').forEach(el=> el.onclick=(e)=>{ proto.roles.splice(+e.target.dataset.i,1); draw(); });
      modal.querySelector('#prAddRole').onclick = ()=>{ proto.roles.push('Role'+(proto.roles.length+1)); draw(); };

      const sigWrap = modal.querySelector('#prSignals');
      // Every ordered pair of the protocol's own roles — Master/Slave gives exactly the two
      // options a signal's direction actually needs; a protocol with no roles yet (roles are
      // optional) offers none, since a role-based direction genuinely has nothing to be built from.
      const dirOptions = [];
      (proto.roles||[]).forEach(a=> (proto.roles||[]).forEach(b=>{ if(a!==b) dirOptions.push(a+' → '+b); }));
      if(proto.signals.length===0) sigWrap.innerHTML = '<div style="color:var(--dim);font-size:11px;">No signals yet — that\'s fine, add them whenever you\'re ready.</div>';
      proto.signals.forEach((s,i)=>{
        const row = document.createElement('div'); row.className='portRow';
        // A signal's own current value might not be one of the protocol's own current role pairs —
        // a role got renamed or deleted after this was set, or it's pre-migration text the import
        // step didn't recognize. Either way, keep it as its own selectable option rather than
        // silently dropping it the moment the dropdown renders.
        const opts = s.direction && !dirOptions.includes(s.direction) ? [s.direction, ...dirOptions] : dirOptions;
        row.innerHTML = `<input value="${escapeHtml(s.name)}" data-i="${i}" class="sigName" placeholder="signal name" style="flex:2;">
          <select data-i="${i}" class="sigDir" style="flex:1;">
            <option value="">(none)</option>
            ${opts.map(o=>`<option value="${escapeHtml(o)}" ${s.direction===o?'selected':''}>${escapeHtml(o)}</option>`).join('')}
          </select>
          <button data-i="${i}" class="sigDel">×</button>`;
        sigWrap.appendChild(row);
      });
      sigWrap.querySelectorAll('.sigName').forEach(el=> el.oninput=(e)=>{ proto.signals[+e.target.dataset.i].name = e.target.value; });
      sigWrap.querySelectorAll('.sigDir').forEach(el=> el.onchange=(e)=>{ proto.signals[+e.target.dataset.i].direction = e.target.value; draw(); });
      sigWrap.querySelectorAll('.sigDel').forEach(el=> el.onclick=(e)=>{ proto.signals.splice(+e.target.dataset.i,1); draw(); });
      modal.querySelector('#prAddSignal').onclick = ()=>{ proto.signals.push(newProtocolSignal('SIGNAL'+(proto.signals.length+1),'')); draw(); };
    }
    modal.querySelector('#prClose').onclick = ()=>{ root.innerHTML=''; render(); };
  }
  draw();
}


// Every non-container leaf under `sheet`, recursing through any Subsystem found along the way
// (an FPGA's own sheet can only contain Subsystem/Hard Macro/Register File/Vendor IP/RTL per the
// sheet content rules — never another FPGA or CCA — so this never needs to stop early).
function collectLeavesUnderSheet(sheet){
  const leaves = [];
  (sheet.components||[]).forEach(comp=>{
    if(comp.isSubsystem){
      if(comp.childSheetId && state.sheets[comp.childSheetId]) leaves.push(...collectLeavesUnderSheet(state.sheets[comp.childSheetId]));
    } else {
      leaves.push(comp);
    }
  });
  return leaves;
}
// Every FPGA component anywhere in the design, with a breadcrumb path for display (e.g. "CCA1 >
// FPGA1"), found by walking down from the System sheet through every container.
function findAllFpgas(){
  const found = [];
  function walk(sheet, path){
    (sheet.components||[]).forEach(comp=>{
      if(comp.isFPGA){
        found.push({ comp, path: path.concat(comp.instanceName) });
      } else if(comp.isSubsystem && comp.childSheetId && state.sheets[comp.childSheetId]){
        walk(state.sheets[comp.childSheetId], path.concat(comp.instanceName));
      }
    });
  }
  const root = state.sheets[state.rootSheetId];
  if(root) walk(root, []);
  return found;
}
// Matches one component's own declared resource usage (whichever family it was measured on)
// against a target family's columns: exact name match first (no scaling needed — it's the same
// declared type), otherwise same-kind match (scaling LUT counts by input-size ratio when both
// sides declare one), otherwise unmatched. Returns null if the component has no usable resource
// data at all (no family picked, or every value is zero) — the caller decides what that means
// (counts toward "no data" for a flat total, or just contributes nothing to a subtree's sum).
function matchComponentResourceUsage(comp, family){
  const res = comp.resources;
  if(!res || !res.familyId) return null;
  const refVendor = res.vendorId ? state.deviceVendors.find(v=>v.id===res.vendorId) : null;
  const refFamily = refVendor ? refVendor.families.find(f=>f.id===res.familyId) : null;
  if(!refFamily) return null;
  const hasAnyData = refFamily.columns.some(c=> +(res.values[c.id]||0) > 0);
  if(!hasAnyData) return null;

  const usage = new Map(); // columnId -> amount, only for columns this component actually contributes to
  const unmatched = [];
  refFamily.columns.forEach(refCol=>{
    const amount = +(res.values[refCol.id]||0);
    if(amount<=0) return;
    const norm = refCol.label.trim().toLowerCase();
    let targetCol = family.columns.find(c=>c.label.trim().toLowerCase()===norm);
    let scaled = amount;
    if(!targetCol){
      targetCol = family.columns.find(c=>c.kind===refCol.kind);
      if(targetCol && refCol.kind==='lut' && refCol.lutInputs && targetCol.lutInputs && refCol.lutInputs!==targetCol.lutInputs){
        scaled = amount * (refCol.lutInputs / targetCol.lutInputs);
      }
    }
    if(targetCol) usage.set(targetCol.id, (usage.get(targetCol.id)||0) + scaled);
    else unmatched.push(refCol.label);
  });
  return { usage, unmatched };
}
// The fit-check for one FPGA: sums every leaf underneath it into the target device's own resource
// columns. Returns null if the FPGA has no fully-selected target device yet. `kind` on each device
// column drives matching — LUTs/FFs/DSP sum by kind, RAM matches by declared name (case/whitespace
// -insensitive) since primitive names vary by vendor and there's no universal schema to match on
// otherwise. A component's own declared vendor/family (from Resources, whichever scope it's set
// to) is used as its resource-characterization reference: if it differs from the target's, LUTs
// are scaled by input-size ratio (a genuine estimate, not a guarantee) when both sides declare one;
// everything else sums directly, since there's no more specific model to scale by yet.
function computeFpgaUtilization(fpgaComp){
  const td = fpgaComp.targetDevice;
  if(!td || !td.vendorId || !td.familyId || !td.deviceId) return null;
  const vendor = state.deviceVendors.find(v=>v.id===td.vendorId);
  const family = vendor ? vendor.families.find(f=>f.id===td.familyId) : null;
  const device = family ? family.devices.find(d=>d.id===td.deviceId) : null;
  if(!vendor || !family || !device) return null;

  const colUsage = new Map(); // columnId -> accumulated number
  family.columns.forEach(c=> colUsage.set(c.id, 0));
  const unmatchedTypes = []; // {comp, label} — a resource type that couldn't be matched to any target column
  let noDataCount = 0;

  if(!fpgaComp.childSheetId || !state.sheets[fpgaComp.childSheetId]) return {
    vendor, family, device, columns: family.columns.map(c=>({column:c, used:0})), unmatchedTypes, noDataCount, leafCount:0
  };
  const leaves = collectLeavesUnderSheet(state.sheets[fpgaComp.childSheetId]);

  leaves.forEach(comp=>{
    const result = matchComponentResourceUsage(comp, family);
    if(!result){ noDataCount++; return; }
    result.usage.forEach((amount, colId)=> colUsage.set(colId, colUsage.get(colId) + amount));
    result.unmatched.forEach(label=> unmatchedTypes.push({comp, label}));
  });

  const columns = family.columns.map(c=>({ column:c, used: colUsage.get(c.id) }));
  return { vendor, family, device, columns, unmatchedTypes, noDataCount, leafCount: leaves.length };
}
// Same underlying data as computeFpgaUtilization, but preserving the hierarchy instead of
// flattening to one total — each Subsystem node's own usage is the sum of everything beneath it,
// computed bottom-up, so a subsystem's number is never anything other than its children's numbers
// added together (never a separately-measured, potentially-inconsistent figure of its own, since
// only leaf components carry a Resources tab at all).
function computeHierarchicalUtilization(sheet, family){
  function walkComponent(comp){
    if(comp.isSubsystem){
      const children = (comp.childSheetId && state.sheets[comp.childSheetId] ? state.sheets[comp.childSheetId].components : []).map(walkComponent);
      const usage = new Map();
      children.forEach(child=> child.usage.forEach((amount, colId)=> usage.set(colId, (usage.get(colId)||0) + amount)));
      return { comp, isContainer:true, children, usage, hasData: children.some(c=>c.hasData) };
    }
    const result = matchComponentResourceUsage(comp, family);
    const usage = new Map();
    if(result) result.usage.forEach((amount, colId)=> usage.set(colId, amount));
    return { comp, isContainer:false, children:[], usage, hasData: !!result };
  }
  return sheet.components.map(walkComponent);
}
function fmtNum(n){
  const r = Math.round(n*10)/10;
  return String(r);
}
function openResourceUtilizationModal(){

  const kindLabels = {lut:'LUT', ff:'FF', dsp:'DSP', ram:'RAM', other:'Other'};
  const ruCollapsedSubsystems = new Set(); // which Subsystem rows are collapsed in the hierarchical breakdown, by component id

    const modal = document.createElement('div'); modal.className='modal';
    modal.style.cssText = 'width:auto;min-width:640px;max-width:94vw;max-height:88vh;overflow-y:auto;';

    modal.innerHTML = `<h3>Resource Utilization</h3>
      <div style="color:var(--dim);font-size:11px;margin-top:-6px;margin-bottom:10px;">Every FPGA in the design, checked against its own selected target device. An estimate, not a guarantee — see 🧩 Device Library and each component's Resources tab for the underlying data.</div>

        <div style="font-weight:600;font-size:12px;color:var(--accent);margin-bottom:6px;">Fit margin (headroom reserved on top of raw usage)</div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          ${Object.keys(kindLabels).map(k=>`<div style="flex:0 0 auto;">
            <label style="margin:0;">${kindLabels[k]} %</label>
            <input id="rm_${k}" type="number" min="0" max="95" value="${state.resourceMargins[k]}" style="width:70px;">
          </div>`).join('')}
        </div>
      </div>

    overlay.appendChild(modal); root.appendChild(overlay);

    Object.keys(kindLabels).forEach(k=>{
      modal.querySelector('#rm_'+k).oninput = (e)=>{
        const v = e.target.value===''? 0 : Math.max(0, Math.min(95, +e.target.value));
        state.resourceMargins[k] = v;
        drawFpgaList();
      };
    });

    function drawFpgaList(){
      const wrap = modal.querySelector('#ruFpgaList');
      if(fpgas.length===0){ wrap.innerHTML = '<div style="color:var(--dim);font-size:11px;">No FPGA components in this design yet.</div>'; return; }
      wrap.innerHTML = '';
      fpgas.forEach(({comp, path})=>{
        const panel = document.createElement('div');
        panel.style.cssText = 'border:1px solid var(--line);border-radius:4px;padding:10px;margin-bottom:12px;';
        const util = computeFpgaUtilization(comp);
        const pathStr = path.length>1 ? path.slice(0,-1).join(' > ') + ' > ' : '';
        if(!util){
          panel.innerHTML = `<div style="font-weight:600;font-size:12px;">${escapeHtml(pathStr)}<span style="color:var(--accent);">${escapeHtml(comp.instanceName)}</span></div>
            <div style="color:var(--dim);font-size:11px;margin-top:4px;">No target device selected — set one in Edit Properties → Target Device.</div>`;
          wrap.appendChild(panel);
          return;
        }
        const rows = util.columns.map(({column, used})=>{
          const margin = state.resourceMargins[column.kind] ?? state.resourceMargins.other;
          const capNum = +(util.device.values[column.id]) || 0;
          const marginAdjusted = capNum * (1 - margin/100);
          let color = '#4caf7d', status = 'OK';
          if(capNum<=0){ color = 'var(--dim)'; status = 'no capacity data'; }
          else if(used > capNum){ color = '#e05c5c'; status = 'over capacity'; }
          else if(used > marginAdjusted){ color = '#e0a75c'; status = 'within margin'; }
          const pct = capNum>0 ? Math.min(100, (used/capNum)*100) : 0;
          const marginPct = capNum>0 ? Math.max(0, Math.min(100, (marginAdjusted/capNum)*100)) : 0;
          return `<div style="margin-top:6px;">

        const breakdownId = 'ruBreak_' + comp.id;
        panel.innerHTML = `<div style="font-weight:600;font-size:12px;">${escapeHtml(pathStr)}<span style="color:var(--accent);">${escapeHtml(comp.instanceName)}</span></div>
          <div style="color:var(--dim);font-size:11px;margin-top:2px;">${escapeHtml(util.vendor.name)} / ${escapeHtml(util.family.name)} / ${escapeHtml(util.device.name)}</div>

        const toggleBtn = panel.querySelector('.ruToggleBreakdown');
        const breakdownWrap = panel.querySelector('#'+breakdownId);
        function renderBreakdown(){
          const childSheet = comp.childSheetId ? state.sheets[comp.childSheetId] : null;
          const tree = childSheet ? computeHierarchicalUtilization(childSheet, util.family) : [];
          // The FPGA itself must be the top-most row — wrap the child tree with a synthetic root
          // node using the FPGA's own already-computed total (util.columns), so this figure is
          // guaranteed to match the summary bars above rather than being recomputed separately.
          const fpgaUsage = new Map();
          util.columns.forEach(c=> fpgaUsage.set(c.column.id, c.used));
          const fpgaNode = { comp, isContainer:true, children: tree, usage: fpgaUsage, hasData:true };
          breakdownWrap.innerHTML = `<table style="border-collapse:collapse;font-size:11px;width:100%;">
            <thead><tr>
              <th style="text-align:left;padding:4px 8px;border-bottom:1px solid var(--line);">Component</th>
              ${util.family.columns.map(c=>`<th style="text-align:right;padding:4px 8px;border-bottom:1px solid var(--line);">${escapeHtml(c.label)}</th>`).join('')}
            </tr></thead>
            <tbody>${renderUtilizationTree([fpgaNode], util.family, 0)}</tbody>
          </table>`;
          breakdownWrap.querySelectorAll('.ruCollapseToggle').forEach(btn=>{
            btn.onclick = (e)=>{
              e.stopPropagation();
              const id = btn.dataset.compid;
              if(ruCollapsedSubsystems.has(id)) ruCollapsedSubsystems.delete(id); else ruCollapsedSubsystems.add(id);
              renderBreakdown();
            };
          });
        }
        toggleBtn.onclick = ()=>{
          const showing = breakdownWrap.style.display !== 'none';
          if(showing){ breakdownWrap.style.display = 'none'; toggleBtn.textContent = 'Show hierarchical breakdown ▾'; return; }
          toggleBtn.textContent = 'Hide hierarchical breakdown ▴';
          breakdownWrap.style.display = 'block';
          renderBreakdown();
        };
      });
    }
    // Renders one level of the hierarchical breakdown as table rows: every component at this
    // level, indented by depth, colored to match its own canvas appearance (bgColor/textColor,
    // falling back to the same per-type defaults the Deployment Diagram uses) — a Subsystem's own
    // row is always exactly the sum of its children, right below it when expanded, and each
    // Subsystem gets its own collapse toggle rather than one all-or-nothing switch for the whole
    // tree, so a large design can be narrowed down to just the part being examined.
    function renderUtilizationTree(nodes, family, depth){
      return nodes.map(node=>{
        const bg = node.comp.bgColor || typeDefaultBgColor(node.comp) || '#3a4a63';
        const textColor = node.comp.textColor || '#cfd8e3';
        const isCollapsed = ruCollapsedSubsystems.has(node.comp.id);
        const hasChildren = node.isContainer && node.children.length>0;
        const toggle = hasChildren
          ? `<button class="ruCollapseToggle" data-compid="${node.comp.id}" title="${isCollapsed?'Expand':'Collapse'}" style="background:none;border:none;color:inherit;cursor:pointer;padding:0 4px 0 0;font-size:10px;">${isCollapsed?'▸':'▾'}</button>`
          : '<span style="display:inline-block;width:14px;"></span>';
        const cells = family.columns.map(c=> `<td style="text-align:right;padding:3px 8px;">${fmtNum(node.usage.get(c.id)||0)}</td>`).join('');
        const row = `<tr style="background:${bg};color:${textColor};">
            <td style="padding:3px 8px;padding-left:${8+depth*18}px;white-space:nowrap;">${toggle}${escapeHtml(node.comp.instanceName)}</td>
            ${cells}
          </tr>`;
        const childRows = (hasChildren && !isCollapsed) ? renderUtilizationTree(node.children, family, depth+1) : '';
        return row + childRows;
      }).join('');
    }
    drawFpgaList();
    modal.querySelector('#ruClose').onclick = ()=>{ root.innerHTML=''; render(); };
  }
  draw();
}

function parseCsv(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c==='"'){
        if(text[i+1]==='"'){ field+='"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if(c==='"') inQuotes = true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\r'){ /* skip, \n (or end) closes the row */ }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => !(r.length===1 && r[0].trim()===''));
}
// Imports device rows into an EXISTING family — never creates new resource columns, since a
// column's kind/LUT-input metadata can't be inferred from a CSV header alone. A device matched by
// name (case-insensitive) has its values updated in place; an unrecognized name is added fresh.
function importFamilyCsv(family, text){
  const rows = parseCsv(text);
  if(rows.length < 1) return { added:0, updated:0, unmatchedCols:[] };
  const header = rows[0];
  const colForCsvIdx = header.slice(1).map(h=>{
    const norm = h.trim().toLowerCase();
    return family.columns.find(c=>c.label.trim().toLowerCase()===norm) || null;
  });
  const unmatchedCols = header.slice(1).filter((h,i)=>!colForCsvIdx[i] && h.trim());
  let added = 0, updated = 0;
  for(let r=1;r<rows.length;r++){
    const row = rows[r];
    if(!row[0] || !row[0].trim()) continue;
    const devName = row[0].trim();
    let dev = family.devices.find(d=>d.name.trim().toLowerCase()===devName.toLowerCase());
    if(!dev){ dev = newDevice(devName); family.devices.push(dev); added++; }
    else updated++;
    colForCsvIdx.forEach((col,i)=>{
      if(!col) return;
      const val = row[i+1];
      if(val!==undefined && val!=='') dev.values[col.id] = val;
    });
  }
  return { added, updated, unmatchedCols };
}
// Whole-library export: one row per (Vendor, Family, Device, Resource Type, Value) — a "long"
// format rather than fixed columns, since resource columns genuinely vary by family and a single
// flat table can't give every family the same column set. Every device gets at least one row —
// one per column if its family has any, blank Type/Value if not — so a device that exists but has
// no values entered yet (or whose family has no columns defined at all) still shows up, the same
// way the per-family export already always includes every device regardless of what's filled in.
function exportAllDevicesCsv(){
  const rows = [['Vendor','Family','Device','Resource Type','Value']];
  state.deviceVendors.forEach(v=>{
    v.families.forEach(f=>{
      f.devices.forEach(d=>{
        if(f.columns.length){
          f.columns.forEach(c=> rows.push([v.name, f.name, d.name, c.label, d.values[c.id]||'']));
        } else {
          rows.push([v.name, f.name, d.name, '', '']);
        }
      });
    });
  });
  return rows.map(row=> row.map(cell=> '"'+String(cell).replace(/"/g,'""')+'"').join(',')).join('\r\n');
}
// Whole-library import: find-or-create the vendor, family, and device named in each row — always,
// as long as those three names are present — then, only if a resource type and value are BOTH
// given, find-or-create the matching column and set it. This mirrors export: a row with a blank
// Type/Value still creates its device (useful for a device with no data yet, or a family with no
// columns), it just doesn't set anything on a column. A resource type already in the global 🧩
// Device Library catalog is reused as-is (kind, LUT input size and all); an unrecognized one is
// added to the catalog as kind 'other' so nothing is silently dropped — worth reviewing and
// reclassifying afterward if it's actually a LUT or RAM type, since 'other' doesn't get
// cross-vendor scaling.
function importAllDevicesCsv(text){
  const rows = parseCsv(text);
  const result = { vendorsAdded:0, familiesAdded:0, columnsAdded:0, devicesAdded:0, devicesUpdated:0, rowsSkipped:0 };
  if(rows.length < 2) return result;
  const header = rows[0].map(h=>h.trim().toLowerCase());
  const idx = { vendor: header.indexOf('vendor'), family: header.indexOf('family'), device: header.indexOf('device'), type: header.indexOf('resource type'), value: header.indexOf('value') };
  if(Object.values(idx).some(i=>i<0)) { result.malformed = true; return result; }
  const touchedDevices = new Set();
  for(let r=1;r<rows.length;r++){
    const row = rows[r];
    const vName = (row[idx.vendor]||'').trim(), fName = (row[idx.family]||'').trim(),
          dName = (row[idx.device]||'').trim(), tName = (row[idx.type]||'').trim(), val = (row[idx.value]||'').trim();
    if(!vName || !fName || !dName){ result.rowsSkipped++; continue; }
    let vendor = state.deviceVendors.find(v=>v.name.trim().toLowerCase()===vName.toLowerCase());
    if(!vendor){ vendor = newDeviceVendor(vName); state.deviceVendors.push(vendor); result.vendorsAdded++; }
    let family = vendor.families.find(f=>f.name.trim().toLowerCase()===fName.toLowerCase());
    if(!family){ family = newDeviceFamily(fName); vendor.families.push(family); result.familiesAdded++; }
    let dev = family.devices.find(d=>d.name.trim().toLowerCase()===dName.toLowerCase());
    if(!dev){ dev = newDevice(dName); family.devices.push(dev); result.devicesAdded++; }
    else if(!touchedDevices.has(dev)) result.devicesUpdated++;
    touchedDevices.add(dev);
    if(!tName || val===''){ continue; } // device (and vendor/family) already created above; nothing to set on a column
    let col = family.columns.find(c=>c.label.trim().toLowerCase()===tName.toLowerCase());
    if(!col){
      const preset = state.resourceTypes.find(t=>t.name.trim().toLowerCase()===tName.toLowerCase());
      col = preset ? newDeviceColumn(preset.name, preset.kind, preset.lutInputs) : newDeviceColumn(tName, 'other');
      if(!preset) state.resourceTypes.push(newResourceType(tName, 'other'));
      family.columns.push(col);
      result.columnsAdded++;
    }
    dev.values[col.id] = val;
  }
  return result;
}
function drawDeviceTable(container, family, onChange){
  const cols = family.columns;
  container.innerHTML = `<table style="border-collapse:collapse;font-size:12px;">
    <thead><tr>
      <th style="text-align:left;padding:4px 8px;border-bottom:1px solid var(--line);">Device</th>
      ${cols.map((c,ci)=>`<th style="padding:4px 8px;border-bottom:1px solid var(--line);min-width:80px;">
        <div style="display:flex;align-items:center;justify-content:center;gap:4px;">
          <span style="font-weight:600;">${escapeHtml(c.label)}</span>
          <button data-ci="${ci}" class="dtColDel" title="Delete column" style="flex:0 0 auto;padding:1px 5px;line-height:1;">×</button>
        </div>
      </th>`).join('')}
      <th></th>
    </tr></thead>
    <tbody>
      ${family.devices.length ? family.devices.map((d,di)=>`<tr>
        <td style="padding:4px 8px;"><input data-di="${di}" class="dtDevName" value="${escapeHtml(d.name)}" style="font-weight:600;"></td>
        ${cols.map((c,ci)=>`<td style="padding:4px 8px;"><input data-di="${di}" data-ci="${ci}" class="dtVal" value="${escapeHtml(d.values[c.id]||'')}"></td>`).join('')}
        <td style="padding:4px 8px;"><button data-di="${di}" class="dtDevDel" title="Delete device">×</button></td>
      </tr>`).join('') : `<tr><td colspan="${cols.length+2}" style="padding:8px;color:var(--dim);">No devices yet.</td></tr>`}
    </tbody>
  </table>`;
  container.querySelectorAll('.dtColDel').forEach(el=> el.onclick=(e)=>{
    const col = cols[+e.target.dataset.ci];
    if(confirm('Delete column "'+col.label+'"? Values already entered for it are lost.')){
      family.columns.splice(+e.target.dataset.ci,1);
      family.devices.forEach(d=> delete d.values[col.id]);
      onChange();
    }
  });
  container.querySelectorAll('.dtDevName').forEach(el=> el.oninput=(e)=>{ family.devices[+e.target.dataset.di].name = e.target.value; });
  container.querySelectorAll('.dtVal').forEach(el=> el.oninput=(e)=>{
    const d = family.devices[+e.target.dataset.di];
    const col = cols[+e.target.dataset.ci];
    d.values[col.id] = e.target.value;
  });
  container.querySelectorAll('.dtDevDel').forEach(el=> el.onclick=(e)=>{
    const d = family.devices[+e.target.dataset.di];
    if(confirm('Delete device "'+d.name+'"?')){
      family.devices.splice(+e.target.dataset.di,1);
      onChange();
    }
  });
}
function openIpTagsModal(){
  const root = document.getElementById('modalRoot');
  function draw(){
    root.innerHTML = '';
    const overlay = document.createElement('div'); overlay.className='overlay';
    const modal = document.createElement('div'); modal.className='modal';
    modal.style.width = '420px';
    modal.innerHTML = `<h3>IP Tags</h3>
      <div style="color:var(--dim);font-size:11px;margin-top:-6px;margin-bottom:8px;">A controlled vocabulary for classifying components (Edit Properties → Documentation) — third-party IP, reused from a previous effort, new development, or whatever categories make sense for this design.</div>
      <div id="itList"></div>
      <button id="itAdd" style="margin-top:6px;">+ New Tag</button>
      <div class="modalBtns"><button id="itClose">Close</button></div>`;

    const list = modal.querySelector('#itList');
    if(state.ipTags.length===0) list.innerHTML = '<div style="color:var(--dim);font-size:11px;">No tags defined yet.</div>';
    state.ipTags.forEach((t,i)=>{
      const row = document.createElement('div'); row.className='portRow';
      row.innerHTML = `<input value="${escapeHtml(t.name)}" data-i="${i}" class="itName" style="flex:2;">
        <button data-i="${i}" class="itDel" title="Delete">×</button>`;
      list.appendChild(row);
    });
    list.querySelectorAll('.itName').forEach(el=> el.oninput=(e)=>{ state.ipTags[+e.target.dataset.i].name = e.target.value; });
    list.querySelectorAll('.itDel').forEach(el=> el.onclick=(e)=>{
      const tag = state.ipTags[+e.target.dataset.i];
      if(confirm('Delete tag "'+tag.name+'"? Components already tagged with it keep working but will show as (untagged) until reassigned.')){
        state.ipTags.splice(+e.target.dataset.i,1);
        draw();
      }
    });
    modal.querySelector('#itAdd').onclick = ()=>{ state.ipTags.push(newIpTag('New Tag')); draw(); };
    modal.querySelector('#itClose').onclick = ()=>{ root.innerHTML=''; render(); };
  }
  draw();
}

sted frame's own header (<b>▾</b>) to collapse it back, the same single-click, ▾/▸ convention the Deployment Diagram uses. An expanded lifeline, used as an arrow's endpoint, resolves to a position rather than a drawn line of its own: entering one lands on its own first participant (however deeply nested), and leaving one departs from its own last arc's own exit (also however deeply nested) — so a chain of expansions collapses to exactly the real entry and real exit, with everything in between shown only as that lifeline's own separate rows. The root System sheet has no owning component the normal way, but right-click its own boundary margin → <b>Edit Features…</b> to give it Features anyway — the one place this is needed, since two components that only share System as a common ancestor (two CCAs, say) have nowhere else valid to define a connection between them. <b>BSP Interface Report</b> lists every Register File plus any Vendor IP/RTL/Hard Macro flagged for it (see the <b>BSP</b> tab in Edit Properties — a checkbox, off by default, plus a driver name field), with an Export CSV button (Path first, then Component/Type/Driver Name/Protocol). <b>Resource Utilization</b> checks every FPGA's usage against its target device — see the 🧩 Device Library section below for how it works — and each FPGA panel has a <b>Show hierarchical breakdown</b> toggle — a table with the FPGA itself as the top row and every component beneath it indented underneath, resource types as columns with a header row, each row colored to match that component's own canvas appearance (its bgColor/textColor, or the same per-type defaults the Deployment Diagram falls back to), and each Subsystem individually collapsible via its own ▾/▸ toggle. A Subsystem's own row is always exactly the sum of what's beneath it, never a separately-measured figure of its own. More view types can land under this same menu later.<br><br>
      <b>⏱️ Clocks & Resets</b> is deliberately separate from the diagram entirely — clock/reset fan out to nearly everything, and drawing them as wires would make the diagram unreadable. It's also <b>local to whichever sheet is active</b> — each container level (System/CCA/FPGA/Subsystem) has its own clock/reset list, not one flat design-wide registry, so a subsystem's internal clock wiring is self-contained and survives being copied or reused elsewhere. Every non-container component, plus FPGA and plain Subsystem specifically, gets a default input <b>clock port</b> and <b>reset port</b> automatically when placed (Edit Properties → <b>Clocking</b>) — rename, redirect to output, add more, or remove, same as regular ports but never drawn on the canvas. CCA alone stays a pure container with no clocking of its own. For a Subsystem/FPGA/CCA specifically, each of its clock/reset ports automatically keeps a matching local, pass-through clock/reset in sync on its <i>own</i> child sheet — that's how a clock crosses a hierarchy boundary: explicitly, through a port, never by reaching into a parent's or a global list. A Subsystem's interior can hold any component type, including further Subsystems, each with this exact same Clocking tab, Assign panel, and Chain diagram — so a nested subsystem's own internal clocking is fully self-contained at whatever level it's defined. The Chain diagram has a <b>Flatten hierarchy</b> checkbox, off by default, for switching between two genuinely different questions: with it off, the diagram shows only this sheet's own local structure — every Subsystem/CCA/FPGA one level down is one opaque box, which is what you want to confirm this level's own wiring is correct in isolation. Checked, it recursively inlines every one of those containers' own interiors — Subsystem within Subsystem, however deep — so only true leaf components (Hard Macro, RTL, Vendor IP, Register File, HW) ever appear, connected directly across every boundary crossing a chain of erent source to reassign it — it takes on that source's color and moves there immediately. Anything not yet connected sits under <b>(Unassigned)</b>; drag a sink there to clear it. Each source's header has a text field for naming the actual wire/clock it represents — typing a name always gives that source a clock uniquely its own, splitting it off from another source if it currently (and incorrectly) shares one, rather than renaming a clock two different sources both depend on. A source can have any number of sinks under it (one clock is free to fan out to several places); a sink can only ever be under one source at a time, since it only has one driver. Where a pass-through clock is involved, its own identity drives the connection — it can't be renamed to alias something else, since it's tied to a specific port one level up; dragging one pass-through onto another is refused, since that would collapse two distinct real boundary crossings into one. The <b>Chain</b> diagram sits alongside the list in the same window and updates live as you drag, so you can watch the cascade take shape as you wire things up — it's a generation-order diagram, not a hierarchy one, governed by four rules. Every clock is classified as it crosses this sheet's own boundary: an <b>Ingress</b> clock enters the container, an <b>Egress</b> clock leaves it, an <b>Intra</b> clock only ever exists inside it. Every component is classified the same way: a <b>Consumer</b> has input clocks and no output clocks; a <b>Generator</b> has at least one output clock. Ranking then places components left to right (Lowest Rank = leftmost) by: (1) Consumer components sit at the Highest Rank; (2) a Generator that only drives Egress clock(s) and consumes no Ingress clock also sits at the Highest Rank, since nothing else on this sheet depends on it — it's not doing further generation work; (3) a Generator that only consumes Ingress clock(s) sits at the Lowest Rank; (4) a Generator that consumes an Intra clock and drives an Intra clock sits somewhere in between, ranked recursively among itself and the Lowest tier exactly like a normal chain — one rank past the <i>deepest</i> of its inputs, not the shallowest, so it's never placed before something it genuinely depends on. Having an Ingress input too doesn't change this — that input simply contributes its own "immediately available" rank into the same comparison, same as any other input would; a Generator only stays at the Lowest Rank if it has no real on-sheet dependency at all. This is what keeps a genuine multi-level generation chain visually distinct instead of collapsing into one column, while anything that's really just a dead end for this sheet — a Consumer, or a Generator whose only job is handing a clock back out to the parent — reads clearly as the end of the line, sharing the Highest Rank together. Pure consumers with the exact same set of clocks/resets tapped stack into an overlapping "more than one" visual; a uniquely-wired one stays a single box. Since row placement happens before that stacking is known, a group's own row is its shallowest member's row, and every OTHER member's own row — allocated during the family-tree walk, now unused since only one combined box represents the whole group — is compacted away afterward, so the diagram doesn't carry blank vertical space for leaves that turned out to be collapsed into a stack. Component placement within each column follows a family-tree layout, not simple top-to-bottom stacking: starting from each Lowest-rank component in turn, its whole line of descent — the components consuming what it generates, and what THEY generate, and so on — is traced out depth-first, with the primary (first) child at each step inheriting the exact same row as its parent, so a straight, direct run of generation needs no vertical bend at all. A component with more than one consumer sends every consumer after the first to a fresh row below, and once one Lowest-rank component's entire line of descent is placed, the next one continues from the next free row rather than crowding in underneath. A generator with an egress output is the one exception to "first child inherits the row": its own row needs to stay completely clear all the way to the exit lane, so that connection can be a single straight line with no detour — so none of its children inherit its row, not even the first, and all of them get their own fresh row below instead — this is what keeps unrelated generation chains visually separated instead of tangled together. Every clock port gets its own small marker on the component's edge, with its own name labeled just inside the box next to it — inputs on the left (label to the right, toward the middle), outputs on the right (label to the left) — colored to match whatever clock it's on, and centered as a group around the component's own vertical middle: a component with just one input (or one output) always has that single port sitting exactly in the middle of its side, and additional ports on the same side spread out symmetrically around that same center rather than stacking from a corner. Each connection lands at the exact port it belongs to rather than the component's general midpoint, which is what keeps two ports on the same component from ever converging on one point and overlapping — and also what a small elbow right before a target corrects for when even a "same row" pairing doesn't share the exact same pixel row, which can happen whenever either side has more than one port. A connection travels as one straight line at the GENERATOR's own port row toward a same-row target (or straight to the exit label, for a clock that only exits to the parent — shown as a plain line with no arrowhead, to visually distinguish a clock leaving the sheet from one still being consumed by something on it, with the line always running all the way to touch the square rather than stopping short of it, and both the ingress square and the egress square colored to match the clock, same as the port markers; an ingress input always reaches this same far-left lane regardless of which rank its consuming component ends up at, since a component can have both a direct ingress input and a real dependency on something else that ranks it further right). Since a generator with an egress output never lets any child inherit its row (see the row-placement rule above), its egress line is normally a single straight run all the way to the exit lane with no bend at all. The detour logic still exists as a fallback for a row collision that rule doesn't cover — a straight path blocked by something unrelated from a completely different part of the diagram — in which case the egress line takes a clean path below everything rather than crossing through it. — but a DIFFERENT-row target only reuses that same run, bending late right before its own column, if a same-row target already gives the run a reason to reach that far. Otherwise it bends immediately after the generator instead, then travels at the TARGET's own row the rest of the way — there's no other reason for it to cross through whatever unrelated component happens to sit in between at the generator's own height, the way it would if it stayed at that height the whole way across. That's what keeps two unrelated connections from ever having to detour around each other: a straight-through run never bends just because something else happens to branch nearby, and a branch never appears before the point where it's actually needed. A connection that passes through another component's row along the way (possible once aligned components share a row) is drawn honestly across it rather than hidden underneath it. The rare exception is a component consuming a clock from something ranked LATER than itself — reaching backward doesn't fit this single-direction model, since a generator's output sits on its own right edge, so this case falls back to a simple bar-and-jog instead. Reset domains are dashed to distinguish them from clocks even without color.<br><br>
      The <b>🔌 Protocols</b> toolbar button manages reusable protocol definitions (AXI4-Stream, AXI4-Lite, and any you add) — a name, optional roles (Master/Slave), and an optional signal list. A protocol doesn't need its signals filled in to be usable; define it with just a name and flesh it out later. Every port on a component's Ports tab carries the same fields — name, side, Protocol, Role, Clock — so tagging a port with a protocol (and role, if it has any) is just picking it from that port's own dropdown, on any port, at any time, rather than a separate creation step; picking "(none)" removes it again. This tags <i>one</i> port with the protocol rather than expanding it into every underlying signal — the diagram stays at the block level, while the protocol's full signal list (once you fill it in) is there for later use, e.g. VHDL generation. Protocols are saved/loaded with <b>Export/Import Library</b>, alongside the component library.<br><br>
      The <b>🏷️ IP Tags</b> toolbar button manages a controlled vocabulary for classifying components — seeded with Third-Party IP, Reused, and New Development, but fully yours to rename, delete, or add to. Every component gets one from Edit Properties → <b>Documentation</b>, a dropdown limited to whatever's currently defined rather than free text, so reporting on a whole design stays meaningful instead of accumulating near-duplicate spellings. Deleting a tag still in use doesn't break anything already tagged with it — it just shows as untagged until reassigned.<br><br>
      The <b>🧩 Device Library</b> toolbar button manages FPGA parts as Vendor → Family → Device, mirroring how real part numbers are organized. A family's resource columns come from a global, extensible <b>resource type</b> catalog (seeded with LUT6, LUT4, FF, DSP, RAMB36, UltraRAM) — picking a type from the <b>+ Add Resource Column</b> dropdown both sets its category and becomes the column's title directly, no separate naming step; the delete (×) sits right next to the title itself. <b>+ New Type...</b> defines one on the spot (name, category, and — for a LUT-category type — its input size, used for cross-vendor fit-estimation) and adds it to the catalog for reuse in other families too. Two levels of CSV import/export: per-family <b>Export CSV</b> / <b>Import CSV</b> work on one family's device table as a flat file (device rows × that family's own resource columns) — export, edit, re-import; a device matched by name (case-insensitive) has its values updated, an unrecognized name added fresh, an unrecognized column name reported and skipped. <b>Export All (CSV)</b> / <b>Import All (CSV)</b>, at the top of the window, cover the <i>whole</i> library in one file — since resource columns vary by family, this uses one row per Vendor/Family/Device/Resource Type/Value rather than fixed columns, so a single spreadsheet can carry devices from every family and vendor at once. Import is fully additive: an unrecognized vendor, family, resource type, or device is created on the spot (a resource type not already in the 🧩 catalog is added as kind "Other" — worth reclassifying afterward if it's actually LUT/FF/DSP/RAM, since only a correctly-classified type gets cross-vendor scaling), while a recognized one just has its value updated — so building an entire library from a spreadsheet, or re-importing after edits, never creates duplicates. An FPGA component picks its target device from here via its own <b>Target Device</b> tab (three cascading dropdowns — picking a different vendor or family resets whatever's downstream of it), with a live read-only capacity summary once a device is fully selected.<br><br>
      A leaf component's own <b>Resources</b> tab always requires a <b>Vendor</b> and <b>Family</b> — a resource count is only meaningful in the context of whichever family it was actually measured on (the exact device doesn't matter for this), picked from the same 🧩 Device Library, not typed as free text. No restriction is ever enforced; Vendor/Family are purely the reference point used to estimate usage elsewhere (LUT input-size ratio, matching type names) when checking against a different one. Once a family is chosen, every one of <i>its</i> resource columns gets its own field, defaulting to 0 — not a fixed LUT/FF/DSP set plus a separate RAM list to manage, since the family already defines exactly which resource types are real for it; an unused one is just left at 0. <b>Reference</b> is a free-text breadcrumb back to where the numbers came from — a synthesis report, a datasheet, a prior project.<br><br>
      <b>Resource Utilization</b> (under 🗺️ Visualizations) finds every FPGA in the design and, for each one with a target device selected, sums every leaf component underneath it (recursing through any Subsystem) into that device's own resource columns — a bar per column, colored by how it compares to capacity once your per-resource-kind margin is applied (editable right there in the view). A component's declared family is used to scale LUT counts by input-size ratio when it differs from the target's; everything else sums directly, since there's no more specific model to scale by yet — it's an estimate, not a synthesis result. A resource type that couldn't be matched to any column on the target device by name is flagged rather than silently dropped, same for how many components underneath have no resource data entered at all. An FPGA with no target device yet shows a reminder instead of a broken chart.<br><br>
      Right-click a component for a menu: open its linked sheet or show it alongside the current one (if it has one), <b>Flip Ports (Left ↔ Right)</b> to flip every one of its ports at once, or delete it — plus <b>Edit Properties…</b> for everything else (renaming, description, colors, ports, features). A component shows its instance name plus its entity/type name underneath (e.g. "Ethernet Subsystem : Subsystem") — like a VHDL label : entity pair. Right-click a single port (or a boundary port) for its own menu — <b>Move to Other Side</b> flips just that one port, or <b>Delete</b> — and a linked port on the other side of a hierarchy boundary (a component's own port and its matching boundary port one level down) follows automatically either way, same as renaming already did. Right-click a connection to delete it directly. Right-click empty space in a column → <b>Add Component</b> to drop in one of the base classes allowed there without dragging, or <b>Remove Column</b> to delete that column (components in it move into the neighboring column). Right-click the gutter between columns → <b>Add Column</b>. Right-click empty boundary margin space → <b>Edit Pins/Connectors/Ports…</b> to open the owning component's Ports tab directly (or a small standalone editor on the root System sheet, which has no owning component).<br><br>
      <b>Show Alongside</b> opens a Subsystem/CCA/FPGA's own sheet in a second panel next to this one — both fully interactive and independently laid out, so you can see the whole system and its internals at once without losing context. Close it with the × on its header.
    </div>
    <div class="modalBtns"><button id="hClose">Close</button></div>`;
  overlay.appendChild(modal); root.appendChild(overlay);
  modal.querySelector('#hClose').onclick = ()=>{ root.innerHTML=''; };
}

function normalizeComponent(comp){
  if(comp.instanceName===undefined) comp.instanceName = comp.name || comp.entityName || 'Component';
  if(comp.entityName===undefined) comp.entityName = comp.instanceName;
  // Legacy diagrams (from before atomic/subsystem was tracked explicitly) keep hierarchy access
  // if they already had a linked sheet; anything else is treated as atomic.
  if(comp.isSubsystem===undefined) comp.isSubsystem = !!comp.childSheetId;
  if(comp.isHW===undefined) comp.isHW = false;
  if(comp.isHardMacro===undefined) comp.isHardMacro = false;
  if(comp.isRegisterFile===undefined) comp.isRegisterFile = false;
  if(comp.isCustom===undefined) comp.isCustom = false;
  if(comp.isVendorIP===undefined) comp.isVendorIP = false;
  if(comp.isFPGA===undefined) comp.isFPGA = false;
  if(comp.isCCA===undefined) comp.isCCA = false;
  if(comp.resourceRoadmap===undefined) comp.resourceRoadmap = false;
  if(comp.resourceNotes===undefined) comp.resourceNotes = '';
  if(comp.resources===undefined) comp.resources = { vendorId:null, familyId:null, deviceId:null, values:{} };
  if(comp.resources.vendorId===undefined) comp.resources.vendorId = null;
  if(comp.resources.familyId===undefined) comp.resources.familyId = null;
  if(comp.resources.deviceId===undefined) comp.resources.deviceId = null;
  if(comp.resources.values===undefined){
    // Migrate the earlier separate luts/flipFlops/dsp/ram fields into the generic per-column
    // values map — only possible if a family was already selected, since a plain number has no
    // column to land on otherwise. Matches by kind (first lut/ff/dsp-kind column) and, for RAM,
    // by name; anything that can't be resolved this way is simply not carried forward.
    comp.resources.values = {};
    const vendor = comp.resources.vendorId ? state.deviceVendors.find(v=>v.id===comp.resources.vendorId) : null;
    const fam = vendor && comp.resources.familyId ? vendor.families.find(f=>f.id===comp.resources.familyId) : null;
    if(fam){
      const lutCol = fam.columns.find(c=>c.kind==='lut');
      const ffCol = fam.columns.find(c=>c.kind==='ff');
      const dspCol = fam.columns.find(c=>c.kind==='dsp');
      if(lutCol && comp.resources.luts) comp.resources.values[lutCol.id] = comp.resources.luts;
      if(ffCol && comp.resources.flipFlops) comp.resources.values[ffCol.id] = comp.resources.flipFlops;
      if(dspCol && comp.resources.dsp) comp.resources.values[dspCol.id] = comp.resources.dsp;
      (comp.resources.ram||[]).forEach(r=>{
        const col = fam.columns.find(c=>c.kind==='ram' && c.label.trim().toLowerCase()===(r.label||'').trim().toLowerCase());
        if(col && r.count) comp.resources.values[col.id] = r.count;
      });
    }
  }
  if(comp.ipTagId===undefined) comp.ipTagId = null;
  if(comp.targetDevice===undefined) comp.targetDevice = { vendorId:null, familyId:null, deviceId:null };
  if(comp.portsLocked===undefined) comp.portsLocked = false;
  if(comp.linkedId===undefined) comp.linkedId = null;
  if(comp.bsp===undefined) comp.bsp = { included:false, driverName:'' };
  if(comp.clockPorts===undefined) comp.clockPorts = [];
  if(comp.resetPorts===undefined) comp.resetPorts = [];
  if(comp.hwSlot===undefined) comp.hwSlot = null;
  if(comp.description===undefined) comp.description = '';
  if(comp.textColor===undefined) comp.textColor = null;
  if(comp.bgColor===undefined) comp.bgColor = null;
  if(comp.features===undefined) comp.features = [];
}

// Components in the same column (or the same HW slot) may not overlap vertically. Sorts each
// group by current y and pushes any that overlap the one above it down by the minimum gap.
function resolveComponentOverlaps(sheet){
  const groups = {};
  sheet.components.forEach(c=>{
    const key = c.hwSlot ? ('hw:'+c.hwSlot) : ('col:'+c.columnIndex);
    (groups[key] = groups[key] || []).push(c);
  });
  Object.values(groups).forEach(list=>{
    list.sort((a,b)=> a.y-b.y);
    for(let i=1;i<list.length;i++){
      const prev = list[i-1], cur = list[i];
      const minY = prev.y + prev.height + MIN_COMPONENT_GAP;
      if(cur.y < minY) cur.y = minY;
    }
  });
}
// After ANY structural change (overlap push, a drag settling, etc.) some component's y may have
// moved for reasons unrelated to a specific wire — but every wire touching it still needs to stay
// horizontal. This re-aligns every connected port to its owner's current position, cascading
// outward through the whole connection graph, and repeats a few times to let things settle
// (a moved component can realign a neighbor, which can then need its own overlap re-checked, etc).
function realignAllConnectedPorts(sheet){
  sheet.components.forEach(comp=>{
    comp.ports.forEach(p=>{
      const involved = sheet.connections.some(c=> connTouches(c,'component',comp.id,p.id));
      if(involved) realign(sheet, {kind:'component', componentId:comp.id, portId:p.id}, comp.y+p.offset);
    });
  });
}
function settleSheet(sheet){
  for(let pass=0; pass<3; pass++){
    resolveComponentOverlaps(sheet);
    realignAllConnectedPorts(sheet);
  }
  resolveComponentOverlaps(sheet);
}
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

function renderPeek(){
  const peekWrap = document.getElementById('peekWrap');
  if(!peekSheetId || !state.sheets[peekSheetId]){
    peekWrap.style.display = 'none';
    peekSheetId = null;
    return;

function flattenSheets(){
  const roots = Object.values(state.sheets).filter(s=>!s.parentSheetId)
    .sort((a,b)=> a.name.localeCompare(b.name));
  const result = [];
  function visit(s, depth){
    result.push({ sheet:s, depth });
    Object.values(state.sheets).filter(c=>c.parentSheetId===s.id)
      .sort((a,b)=> a.name.localeCompare(b.name))
      .forEach(c=>visit(c, depth+1));
  }
  roots.forEach(r=>visit(r,0));
  return result;
}
function renderTabs(){
  const tabs = document.getElementById('tabs');
  tabs.innerHTML='';
  flattenSheets().forEach(({sheet:s, depth})=>{
    const d = document.createElement('div');
    d.className = 'tab' + (s.id===state.activeSheetId ? ' active':'');
    d.textContent = (depth>0 ? '↳ ' : '') + s.name;
    d.title = depth>0 ? 'Subsystem sheet' : 'Root sheet';
    d.onclick = ()=>{ state.activeSheetId = s.id; render(); };
    tabs.appendChild(d);
  });
}

const collapsedFolders = new Set();
function renderLibraryNode(node, container, depth){
  if(node.type==='folder'){
    const head = document.createElement('div');
    head.className='libFolder';
    head.style.paddingLeft = (depth*10)+'px';
    head.textContent = (collapsedFolders.has(node.id)?'▸ ':'▾ ') + node.name;
    head.onclick = ()=>{
      if(collapsedFolders.has(node.id)) collapsedFolders.delete(node.id); else collapsedFolders.add(node.id);
      renderLibrary();
    };
    container.appendChild(head);
    if(!collapsedFolders.has(node.id)){
      node.children.forEach(ch=>renderLibraryNode(ch, container, depth+1));
    }
  } else {
    const d = document.createElement('div');
    const typeClass = node.type==='subsystem' ? ' subsystemItem' : node.type==='hw' ? ' hwItem'
      : node.type==='hardmacro' ? ' hmItem' : node.type==='regfile' ? ' regItem'
      : node.type==='custom' ? ' customItem' : node.type==='vendorip' ? ' vendoripItem'
      : node.type==='fpga' ? ' fpgaItem' : node.type==='cca' ? ' ccaItem' : '';
    d.className = 'libItem' + typeClass;
    d.style.marginLeft = (depth*10)+'px';
    d.draggable = true;
    // Type is conveyed by the left border color (and the name itself) — no colored text tag.
    d.innerHTML = `${node.name}`;
    d.ondragstart = (e)=>{ e.dataTransfer.setData('text/plain', node.id); };
    d.oncontextmenu = (e)=>{ e.preventDefault();
      if(node.features===undefined) node.features = [];
      showContextMenu(e.clientX, e.clientY, [
        { label: 'Edit Features…', action: ()=> editFeaturesModal(node, node.ports.map(p=>({key:p.name, label:p.name+' ('+p.side+')'})), true) },
        { separator:true },
        { label: 'Remove from Library', danger:true, action: ()=>{
            if(confirm('Remove "'+node.name+'" from library?')){ removeLibNode(state.library, node.id); render(); }
          } }
      ]);
    };
    container.appendChild(d);
  }
}
function renderLibrary(){
