<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FPGA Hierarchy Editor</title>
<style>
  :root{
    --bg:#0b0e14;
    --panel:#11151d;
    --panel2:#151a24;
    --line:#232a38;
    --grid:#171d29;
    --gutter:#12161f;
    --text:#cfd8e3;
    --dim:#7c8798;
    --accent:#5ec8d8;
    --accent2:#f2b64c;
    --good:#6fd08c;
    --bad:#e5636b;
    --comp-fill:#182233;
    --comp-border:#3a4a63;
    --port-fill:#5ec8d8;
    --port-border:#0b0e14;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:'JetBrains Mono','Consolas','SFMono-Regular',Menlo,monospace;
    font-size:13px;overflow:hidden;}
  #app{display:flex;flex-direction:column;height:100%;}
  #topbar{display:flex;flex-direction:column;
    background:var(--panel);border-bottom:1px solid var(--line);}
  #topbarRow1{display:flex;align-items:center;gap:14px;padding:8px 12px;flex-wrap:wrap;}
  #topbarRow2{display:flex;align-items:center;gap:4px;padding:0 12px 8px;border-top:1px solid var(--line);
    padding-top:6px;flex-wrap:wrap;}
  #brand{font-weight:700;letter-spacing:1px;color:var(--accent);font-size:12px;white-space:nowrap;}
  #tabs{display:flex;gap:4px;row-gap:4px;flex:1;flex-wrap:wrap;align-items:center;}
  .tab{padding:4px 10px;background:var(--panel2);border:1px solid var(--line);
    border-radius:3px;cursor:pointer;color:var(--dim);white-space:nowrap;}
  .tab.active{color:var(--accent);border-color:var(--accent);}
  #actions{display:flex;gap:6px;flex-wrap:wrap;}
  button, .fileBtn{background:var(--panel2);color:var(--text);border:1px solid var(--line);
    padding:5px 9px;border-radius:3px;cursor:pointer;font-family:inherit;font-size:12px;}
  button:hover, .fileBtn:hover{border-color:var(--accent);color:var(--accent);}
  .fileBtn{display:inline-block;}
  #main{flex:1;display:flex;overflow:hidden;}
  #sidebar{width:240px;background:var(--panel);border-right:1px solid var(--line);
    padding:12px;overflow-y:auto;flex-shrink:0;}
  #sidebar h3{margin:0 0 8px;font-size:11px;letter-spacing:1px;color:var(--dim);text-transform:uppercase;}
  #libActions{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;padding-bottom:10px;
    border-bottom:1px solid var(--line);}
  #libActions button, #libActions .fileBtn{width:100%;box-sizing:border-box;text-align:center;font-size:11px;}
  .libFolder{cursor:pointer;color:var(--dim);font-size:11px;padding:5px 2px;user-select:none;
    letter-spacing:0.5px;text-transform:uppercase;border-top:1px solid var(--line);margin-top:2px;}
  .libFolder:first-child{border-top:none;margin-top:0;}
  .libFolder:hover{color:var(--accent);}
  .libItem{background:var(--comp-fill);border:1px solid var(--comp-border);border-radius:3px;
    padding:6px 8px;margin-bottom:6px;cursor:grab;font-size:12px;}
  .libItem:hover{border-color:var(--accent);}
  .libItem.subsystemItem{border-color:#9aa3af;}
  .libItem.hwItem{border-color:#a78bfa;}
  .libItem.hmItem{border-color:#6d9eeb;}
  .libItem.regItem{border-color:#e0c341;}
  .libItem.customItem{border-color:#4fc27d;}
  .libItem.vendoripItem{border-color:#e0973f;}
  .libItem.fpgaItem{border-color:#e0776e;}
  .libItem.ccaItem{border-color:#8fcf8f;}
  .tag.hwTag{color:#a78bfa;border-color:#a78bfa;}
  .tag.hmTag{color:#6d9eeb;border-color:#6d9eeb;}
  .tag.regTag{color:#e0c341;border-color:#e0c341;}
  .tag.customTag{color:#4fc27d;border-color:#4fc27d;}
  .tag.vendoripTag{color:#e0973f;border-color:#e0973f;}
  .tag.fpgaTag{color:#e0776e;border-color:#e0776e;}
  .tag.ccaTag{color:#8fcf8f;border-color:#8fcf8f;}
  .libItem small{display:block;color:var(--dim);font-size:10px;margin-top:2px;}
  .tag{font-size:9px;color:var(--accent2);border:1px solid var(--accent2);padding:0 3px;
    border-radius:2px;margin-left:4px;}
  #hint{color:var(--dim);font-size:11px;margin-top:14px;line-height:1.5;}
  #canvasArea{flex:1;display:flex;overflow:hidden;}
  #canvasWrap{flex:1;overflow:auto;background:var(--bg);position:relative;}
  #peekWrap{flex:1;overflow:hidden;display:none;flex-direction:column;border-left:2px solid var(--accent);background:var(--bg);}
  #peekHeader{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;
    background:var(--panel);border-bottom:1px solid var(--line);font-size:12px;color:var(--accent);flex-shrink:0;}
  #peekCanvasWrap{flex:1;overflow:auto;}
  svg text{user-select:none;}
  .comp-rect{fill:var(--comp-fill);stroke:var(--comp-border);stroke-width:1.5;cursor:grab;}
  .comp-rect:hover{stroke:var(--accent);}
  .comp-rect.selected{stroke:var(--accent2);stroke-width:3;}
  .comp-label{fill:var(--text);font-size:11px;pointer-events:none;}
  .resize-handle{fill:var(--dim);cursor:ns-resize;opacity:0.6;}
  .resize-handle:hover{fill:var(--accent);}
  .port-rect{fill:var(--port-fill);stroke:var(--port-border);stroke-width:1;cursor:pointer;}
  .port-rect.armed{fill:var(--accent2);}
  .port-label{fill:var(--dim);font-size:9px;pointer-events:none;}
  .conn-line{stroke:var(--accent);stroke-width:1.75;fill:none;cursor:pointer;}
  .conn-line:hover{stroke:var(--accent2);stroke-width:2.5;}
  .col-band{fill:var(--grid);}
  .gutter-band{fill:var(--gutter);}
  .bound-band{fill:#0e2229;}
  .hw-band{fill:#241a10;}
  .conn-band{fill:#12242b;}
  .col-caption{fill:var(--dim);font-size:9px;letter-spacing:1px;}
  .col-caption-sub{fill:var(--dim);font-size:8px;opacity:0.75;}
  .sheet-banner{fill:var(--panel2);}
  .sheet-banner-text{fill:var(--accent);font-size:13px;font-weight:700;letter-spacing:0.5px;}
  .sheet-banner-seg{cursor:pointer;}
  .sheet-banner-seg:hover{text-decoration:underline;}
  .sheet-banner-sep{fill:var(--dim);font-weight:400;}
  .bport-rect{fill:var(--accent2);stroke:var(--port-border);cursor:pointer;}
  .bport-rect.unlinked{fill:var(--bad);}
  /* modal */
  #modalRoot .overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);
    display:flex;align-items:center;justify-content:center;z-index:50;}
  #modalRoot .modal{background:var(--panel);border:1px solid var(--line);border-radius:6px;
    padding:18px;width:340px;max-height:80vh;overflow-y:auto;}
  #modalRoot .modal h3{margin-top:0;color:var(--accent);font-size:13px;}
  .propTabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;flex-wrap:wrap;}
  .propTabBtn{background:none;border:none;border-bottom:2px solid transparent;color:var(--dim);
    padding:6px 10px;font-family:inherit;font-size:12px;cursor:pointer;}
  .propTabBtn:hover{color:var(--text);}
  .propTabBtn.active{color:var(--accent);border-bottom-color:var(--accent);}
  #modalRoot .modal.propModal{width:540px;height:520px;max-height:80vh;display:flex;flex-direction:column;overflow:hidden;}
  #modalRoot .modal.propModal .propTabs{flex:0 0 auto;}
  #modalRoot .modal.propModal .propBody{flex:1 1 auto;overflow-y:auto;min-height:0;}
  #modalRoot .modal.propModal .modalBtns{flex:0 0 auto;}
  #modalRoot .modal.clocksModal{width:auto;min-width:480px;max-width:92vw;max-height:80vh;overflow-y:auto;}
  #modalRoot .modal.clocksModal table{max-width:100%;}
  #modalRoot .modal.clocksModal #ckBody{overflow-x:auto;}
  #modalRoot .modal.dynModal{width:640px;max-width:92vw;max-height:85vh;display:flex;flex-direction:column;overflow:hidden;}
  #modalRoot .modal.dynModal .propTabs{flex:0 0 auto;}
  #modalRoot .modal.dynModal .propBody{flex:0 1 auto;overflow-y:auto;min-height:0;}
  #modalRoot .modal.dynModal .modalBtns{flex:0 0 auto;}
  #modalRoot label{display:block;font-size:11px;color:var(--dim);margin:8px 0 3px;}
  #modalRoot input,#modalRoot select,#modalRoot textarea{width:100%;background:var(--panel2);border:1px solid var(--line);
    color:var(--text);padding:5px 6px;border-radius:3px;font-family:inherit;font-size:12px;}
  #modalRoot textarea{resize:vertical;}
  #modalRoot input[type=checkbox]{width:auto;display:inline-block;}
  #modalRoot input[type=color]{height:32px;padding:2px;cursor:pointer;}
  .portRow{display:flex;gap:4px;margin-bottom:4px;align-items:center;flex-wrap:wrap;}
  .protoTag{font-size:10px;color:var(--accent2);border:1px solid var(--accent2);border-radius:3px;padding:1px 5px;white-space:nowrap;}
  .dirInTag{font-size:10px;color:#6ea8fe;border:1px solid #6ea8fe;border-radius:3px;padding:1px 5px;}
  .dirOutTag{font-size:10px;color:#f2b64c;border:1px solid #f2b64c;border-radius:3px;padding:1px 5px;}
  input.ckIn{accent-color:#6ea8fe;}
  input.ckOut{accent-color:#f2b64c;}
  .portRow input{flex:2;}
  .portRow select{flex:1;}
  .portRow button{flex:0 0 auto;padding:4px 7px;}
  .modalBtns{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;}
  /* context menu */
  .ctxMenu{position:fixed;background:var(--panel2);border:1px solid var(--line);border-radius:4px;
    padding:4px 0;z-index:100;min-width:190px;box-shadow:0 6px 18px rgba(0,0,0,0.55);}
  .ctxItem{padding:7px 14px;font-size:12px;cursor:pointer;color:var(--text);}
  .ctxItem:hover{background:var(--panel);color:var(--accent);}
  .ctxItem.ctxDanger{color:var(--bad);}
  .ctxItem.ctxDanger:hover{background:var(--panel);color:var(--bad);}
  .ctxItem.ctxHasSub{position:relative;}
  .ctxItem.ctxEmpty{color:var(--dim);cursor:default;}
  .ctxItem.ctxEmpty:hover{background:none;color:var(--dim);}
  .ctxSep{height:1px;background:var(--line);margin:4px 0;}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div id="topbarRow1">
      <div id="brand">FPGA HIERARCHY EDITOR</div>
      <div id="actions">
        <button id="btnDocs" title="View / edit this sheet's documentation">📄 Docs</button>
        <button id="btnProtocols" title="Define reusable protocols (AXI4-Stream, etc.) to tag ports with">🔌 Protocols</button>
        <button id="btnIpTags" title="Define IP classification tags (Third-Party IP, Reused, New Development, etc.) to tag components with">🏷️ IP Tags</button>
        <button id="btnDeviceLibrary" title="Define FPGA vendors, families, and devices with their resource capacities">🧩 Device Library</button>
        <button id="btnVisualizations" title="Alternative views of the design">🗺️ Visualizations ▾</button>
        <button id="btnClocks" title="Define clocks/resets and assign them across components — never shown on the diagram itself">⏱️ Clocks & Resets</button>
        <button id="btnHelp" title="How to use this tool">❓ Help</button>
        <button id="btnExport">Export JSON</button>
        <label class="fileBtn">Import JSON<input type="file" id="importFile" accept=".json" hidden></label>
      </div>
    </div>
    <div id="topbarRow2">
      <div id="tabs"></div>
    </div>
  </div>
  <div id="main">
    <div id="sidebar">
      <h3>Component Library</h3>
      <div id="libActions">
        <button id="btnLibraryMenu" title="Manage the component library">Component Library ▾</button>
        <input type="file" id="importLibFile" accept=".json" hidden>
      </div>
      <div id="libList"></div>
    </div>
    <div id="canvasArea">
      <div id="canvasWrap">
        <svg id="canvas"></svg>
      </div>
      <div id="peekWrap">
        <div id="peekHeader">
          <span id="peekTitle"></span>
          <button id="peekClose">× Close</button>
        </div>
        <div id="peekCanvasWrap">
          <svg id="canvas2"></svg>
        </div>
      </div>
    </div>
  </div>
</div>
<div id="modalRoot"></div>

<script>
const SVGNS = "http://www.w3.org/2000/svg";
let _idc = 1;

// ---------- layout constants (must be declared before any library/state initialization uses them) ----------
const COMP_W = 160, BOUND_W = 34, MIN_GUTTER = 60, TOP_MARGIN = 30, LEFT_MARGIN = 20;
const BANNER_H = 28; // height of the sheet-path banner spanning the top of every sheet
const PORT_MARGIN_TOP = 40;     // extra keep-out at the top of a component so port labels clear the instance/entity name lines
const PORT_MARGIN_BOTTOM = 16;  // minimum space between a port and the bottom edge of its component
const BOUNDARY_PORT_MARGIN = 16;
const PORT_W = 8, PORT_H = 16;  // port rectangle: taller than wide
const PORT_MIN_GAP = PORT_H + 6; // minimum vertical gap between two ports on the same edge
const MIN_COMPONENT_GAP = 24;    // minimum vertical gap between two components in the same column
function uid(p){ return p + (_idc++) + "_" + Math.random().toString(36).slice(2,6); }
function svgEl(tag, attrs, parent){
  const el = document.createElementNS(SVGNS, tag);
  for(const k in attrs) el.setAttribute(k, attrs[k]);
  if(parent) parent.appendChild(el);
  return el;
}

// ---------- generic right-click context menu ----------
// Menu levels currently on screen, indexed by depth (0 = the top-level menu). Lets opening a
// submenu at any depth cleanly tear down whatever was open at that depth or deeper, regardless of
// how many levels deep the tree goes.
let ctxMenuLevels = [];
function closeContextMenu(){
  document.querySelectorAll('.ctxMenu').forEach(el=> el.remove());
  ctxMenuLevels = [];
}
function buildCtxMenuLevel(items, x, y, depth){
  for(let i=ctxMenuLevels.length-1; i>=depth; i--){
    if(ctxMenuLevels[i]) ctxMenuLevels[i].remove();
  }
  ctxMenuLevels.length = depth;
  const menu = document.createElement('div');
  if(depth===0) menu.id = 'ctxMenu';
  menu.className = 'ctxMenu' + (depth>0 ? ' ctxSubMenu' : '');
  menu.style.left = x+'px';
  menu.style.top = y+'px';
  items.forEach(it=>{
    if(it.separator){
      const hr = document.createElement('div');
      hr.className = 'ctxSep';
      menu.appendChild(hr);
      return;
    }
    const row = document.createElement('div');
    row.className = 'ctxItem' + (it.danger ? ' ctxDanger' : '') + (it.submenu ? ' ctxHasSub' : '');
    row.textContent = it.label + (it.submenu ? ' ▸' : '');
    if(it.submenu){
      row.addEventListener('mouseenter', ()=>{
        const rowRect = row.getBoundingClientRect();
        const subItems = it.submenu.length ? it.submenu : [{label:'(nothing available)', action:()=>{}}];
        buildCtxMenuLevel(subItems, rowRect.right, rowRect.top, depth+1);
      });
    } else {
      row.onclick = (e)=>{ e.stopPropagation(); closeContextMenu(); it.action(); };
    }
    menu.appendChild(row);
  });
  document.body.appendChild(menu);
  ctxMenuLevels[depth] = menu;
  return menu;
}
function showContextMenu(x, y, items){
  closeContextMenu();
  buildCtxMenuLevel(items, x, y, 0);
  setTimeout(()=> document.addEventListener('click', closeContextMenu, {once:true}), 0);
}

// ---------- state ----------
function newSheet(name, parentSheetId, parentComponentId, kind){
  return {
    id: uid('sheet'), name, parentSheetId: parentSheetId||null,
    parentComponentId: parentComponentId||null, kind: kind || 'subsystem', description:'',
    numColumns: 3, components: [], connections: [], boundaryPorts: [], clocks: [], resets: [], features: []
  };
}

function libPort(name, side, offset, protocolId, protocolRole){ return { name, side, offset, protocolId: protocolId||null, protocolRole: protocolRole||'' }; }
function libComponent(name, height, ports){ return { id: uid('lib'), type:'component', name, height, ports }; }
function libSubsystem(name, height, ports){ return { id: uid('lib'), type:'subsystem', name, height, ports }; }
function libHW(name, height, ports){ return { id: uid('lib'), type:'hw', name, height, ports }; }
function libHardMacro(name, height, ports){ return { id: uid('lib'), type:'hardmacro', name, height, ports }; }
function libRegFile(name, height, ports){ return { id: uid('lib'), type:'regfile', name, height, ports }; }
function libCustom(name, height, ports){ return { id: uid('lib'), type:'custom', name, height, ports }; }
function libVendorIP(name, height, ports){ return { id: uid('lib'), type:'vendorip', name, height, ports }; }
function libFPGA(name, height, ports){ return { id: uid('lib'), type:'fpga', name, height, ports }; }
function libCCA(name, height, ports){ return { id: uid('lib'), type:'cca', name, height, ports }; }
function libFolder(name, children){ return { id: uid('fld'), type:'folder', name, children }; }

function defaultLibrary(){
  return [
    // The base classes are deliberately generic — one leaf per fundamental kind of block.
    // Every other library item (and everything a user builds) is ultimately one of these,
    // renamed and specialized per instance (e.g. a "Hard Macro" instance renamed to "PCIe
    // Interface"). Kept together, at the top of the library, for that reason.
    // resourceRoadmap: true flags a base class as slated for the future Resource Estimation
    // roadmap item — a lightweight marker only, no estimation fields exist yet.
    libFolder('Base Classes', [
      libCCA('CCA', 140, []),
      libHW('HW', 80, []),
      libFPGA('FPGA', 160, []),
      libHardMacro('Hard Macro', 80, []),
      libSubsystem('Subsystem', 140, []),
      Object.assign(libVendorIP('Vendor IP', 80, []), {resourceRoadmap:true}),
      Object.assign(libCustom('RTL', 100, []), {resourceRoadmap:true}),
      Object.assign(libRegFile('Register File (CSR)', 90, [ libPort('CSR','left',PORT_MARGIN_TOP) ]), {resourceRoadmap:true})
    ]),
    libFolder('AXI4-Stream', [
      Object.assign(libVendorIP('AXI4-Stream Master', 96, [
        libPort('TDATA','right',24), libPort('TVALID','right',50), libPort('TREADY','left',24)
      ]), {resourceRoadmap:true}),
      Object.assign(libVendorIP('AXI4-Stream Slave', 96, [
        libPort('TDATA','left',24), libPort('TVALID','left',50), libPort('TREADY','right',24)
      ]), {resourceRoadmap:true})
    ]),
    libFolder('AXI4-Lite', [
      Object.assign(libVendorIP('AXI4-Lite Master', 116, [
        libPort('AWADDR','right',22), libPort('WDATA','right',48), libPort('ARADDR','right',74), libPort('RDATA','left',40)
      ]), {resourceRoadmap:true}),
      Object.assign(libVendorIP('AXI4-Lite Slave', 116, [
        libPort('AWADDR','left',22), libPort('WDATA','left',48), libPort('ARADDR','left',74), libPort('RDATA','right',40)
      ]), {resourceRoadmap:true})
    ])
  ];
}

// ---------- base-class default colors ----------
// A component's background falls back to one of these (by type) whenever it has no explicit
// per-instance bgColor set. Gives every base class a recognizable default color while still
// letting "Set Colors..." override it per instance, and "Reset to Default" fall back to it again.
function typeDefaultBgColor(comp){
  if(comp.isFPGA) return '#c96a61';        // light red
  if(comp.isCCA) return '#0B980B';         // R:11 G:152 B:11
  if(comp.isSubsystem) return '#6b7280';   // grey
  if(comp.isHardMacro) return '#2f5aa8';   // blue
  if(comp.isHW) return '#7c5cc4';          // purple
  if(comp.isVendorIP) return '#c9822f';    // orange
  if(comp.isCustom) return '#2f8f57';      // green (RTL)
  if(comp.isRegisterFile) return '#b8960c';// yellow
  return null;
}
function freshState(){
  const s = newSheet('System', null, null, 'system');
  return { library: defaultLibrary(), protocols: defaultProtocols(), protocolGroups: [], ipTags: defaultIpTags(), deviceVendors: defaultDeviceVendors(), resourceTypes: defaultResourceTypes(),
    resourceMargins: { lut:20, ff:20, dsp:20, ram:20, other:20 },
    sheets: { [s.id]: s }, rootSheetId: s.id, activeSheetId: s.id };
}
// A user-defined, controlled vocabulary for classifying leaf IP — not free text, so reporting on
// "how much of this design is new vs. reused vs. third-party" stays meaningful across a whole
// design instead of accumulating a dozen near-duplicate spellings. Seeded with three common
// categories as a starting point; rename, delete, or add to freely via 🏷️ IP Tags in the toolbar,
// exactly like 🔌 Protocols.
function newIpTag(name){ return { id: uid('iptag'), name }; }
function defaultIpTags(){
  return [newIpTag('Third-Party IP'), newIpTag('Reused'), newIpTag('New Development')];
}
// The device library: Vendor -> Family -> Device, mirroring how real part numbers are organized.
// Resource columns live on the FAMILY, not globally, because they genuinely differ by family, not
// just by vendor — a 7-series family might declare "LUT6"/"FF"/"DSP48"/"BRAM36"/"BRAM18" while a
// different family from the same vendor declares something else entirely. `kind` lets the future
// fit-check identify which columns to sum/compare without parsing display text; `lutInputs` is
// only meaningful on a 'lut'-kind column and drives the cross-vendor LUT scaling estimate.
function newDeviceColumn(label, kind, lutInputs){
  return { id: uid('col'), label, kind: kind||'other', lutInputs: lutInputs||null };
}
// A global, extensible catalog of named resource types (LUT, FF, DSP, RAMB36, UltraRAM, ...) — a
// family's own resource columns are created by picking from this list, so the picked name becomes
// the column's title directly rather than typing a separate label. `kind` still drives fit-check
// matching (multiple named types, like RAMB36 and UltraRAM, can share kind='ram'); `lutInputs`
// only matters on a 'lut'-kind entry, and a column copies it as its own starting value (still
// editable per-family afterward, since two families both called "LUT" can differ in input size).
function newResourceType(name, kind, lutInputs){ return { id: uid('rtype'), name, kind: kind||'other', lutInputs: lutInputs||null }; }
function defaultResourceTypes(){
  return [
    newResourceType('LUT6', 'lut', 6),
    newResourceType('LUT4', 'lut', 4),
    newResourceType('FF', 'ff'),
    newResourceType('DSP', 'dsp'),
    newResourceType('RAMB36', 'ram'),
    newResourceType('UltraRAM', 'ram'),
  ];
}
function newDevice(name){ return { id: uid('dev'), name, values: {} }; } // values: columnId -> capacity string
function newDeviceFamily(name){ return { id: uid('fam'), name, columns: [], devices: [] }; }
function newDeviceVendor(name){ return { id: uid('vnd'), name, families: [] }; }
// Merges `incoming` vendors into `target` (both arrays of the deviceVendors shape), matching by
// name (case-insensitive, trimmed) at every level — vendor, family, device, and column — so the
// same named vendor/family/device from two different sources (a saved file's own copy vs. this
// session's freshly-generated defaults, or two separate CSV/file imports) is treated as one entity
// rather than duplicated. Existing entries' own ids are always kept; only genuinely new names are
// appended, and an incoming device's values are merged in without overwriting anything already set.
function mergeDeviceVendorsInto(target, incoming){
  (incoming||[]).forEach(iv=>{
    let tv = target.find(v=>v.name.trim().toLowerCase()===iv.name.trim().toLowerCase());
    if(!tv){ target.push(iv); return; }
    (iv.families||[]).forEach(ifam=>{
      let tfam = tv.families.find(f=>f.name.trim().toLowerCase()===ifam.name.trim().toLowerCase());
      if(!tfam){ tv.families.push(ifam); return; }
      // Columns are merged by label first, remapping the incoming family's own column ids to
      // whichever id the target family already uses for that same label — otherwise devices
      // merged in below would carry values keyed by ids the target's own columns don't recognize.
      const colIdMap = {};
      (ifam.columns||[]).forEach(icol=>{
        let tcol = tfam.columns.find(c=>c.label.trim().toLowerCase()===icol.label.trim().toLowerCase());
        if(!tcol){ tfam.columns.push(icol); colIdMap[icol.id] = icol.id; }
        else colIdMap[icol.id] = tcol.id;
      });
      (ifam.devices||[]).forEach(idev=>{
        let tdev = tfam.devices.find(d=>d.name.trim().toLowerCase()===idev.name.trim().toLowerCase());
        if(!tdev){
          const remapped = {};
          Object.keys(idev.values||{}).forEach(cid=> remapped[colIdMap[cid]||cid] = idev.values[cid]);
          tfam.devices.push({ id: idev.id, name: idev.name, values: remapped });
        } else {
          Object.keys(idev.values||{}).forEach(cid=>{
            const realCid = colIdMap[cid]||cid;
            if(tdev.values[realCid]===undefined) tdev.values[realCid] = idev.values[cid];
          });
        }
      });
    });
  });
}
// Rebuilds a deviceVendors array with itself, deduplicating any vendors/families/devices that
// ended up repeated (e.g. from the id-based merge bug this replaces, across several past sessions)
// — safe to call on an already-clean array, since merging something with itself is a no-op.
function dedupeDeviceVendors(vendors){
  const result = [];
  mergeDeviceVendorsInto(result, vendors);
  return result;
}
function defaultDeviceVendors(){
  return [newDeviceVendor('AMD'), newDeviceVendor('Altera'), newDeviceVendor('Microchip')];
}
function newClock(name){ return { id: uid('clk'), name, frequency:'', linkedParentPortId:null }; }
function newReset(name){ return { id: uid('rst'), name, type:'sync', clockId:null, linkedParentPortId:null }; }
// `linkedParentPortId`, when set, marks this as a pass-through clock/reset created automatically
// because a hierarchical component (Subsystem/FPGA/CCA) has a clock/reset port — see
// syncClockingBoundary. It's kept in sync with that port's name and torn down if the port is
// deleted, exactly like a boundary port mirrors a regular port.
function newClockPort(name, direction){ return { id: uid('cp'), name, direction: direction||'input', assignedClockId:null, linkedChildClockId:null }; }
function newResetPort(name, direction){ return { id: uid('rp'), name, direction: direction||'input', assignedResetId:null, linkedChildResetId:null }; }
// Sheets created before this revision (or loaded from an older export) won't have clocks/resets
// arrays yet — this is called wherever a sheet is about to be read from or written to.
function ensureSheetClocking(sheet){
  if(sheet.clocks===undefined) sheet.clocks = [];
  if(sheet.resets===undefined) sheet.resets = [];
  if(sheet.features===undefined) sheet.features = [];
}
// A protocol is a reusable, shared *definition* — components reference it by id rather than
// copying its signals, so editing a protocol here updates every port that uses it. Both roles and
// signals are optional and can be left empty; a protocol with no signals yet is fully valid — the
// point is to be able to say "this is an AXI4-Stream interface" on a diagram immediately and fill
// in the actual signal list (for later VHDL generation) whenever it's convenient.
function newProtocol(name){
  return { id: uid('proto'), name, roles: [], signals: [] };
}
function newProtocolSignal(name, direction){
  return { id: uid('sig'), name, direction: direction||'' };
}
// The protocol grouping tree — purely organizational, references state.protocols by id rather
// than containing protocol data itself, so the flat array everything else already reads (the
// dedup/migration logic, the port picker) never needs to change. Mirrors the library's own
// {type:'folder', children} shape exactly; a leaf here is {type:'protocol', protocolId}.
function protocolGroupFolder(name){ return { id: uid('pfld'), type:'folder', name, children: [] }; }
function findProtocolGroupNode(nodes, id){
  for(const n of nodes){
    if(n.id===id) return n;
    if(n.type==='folder'){ const f = findProtocolGroupNode(n.children, id); if(f) return f; }
  }
  return null;
}
function removeProtocolGroupNode(nodes, id){
  for(let i=0;i<nodes.length;i++){
    if(nodes[i].id===id){ nodes.splice(i,1); return true; }
    if(nodes[i].type==='folder' && removeProtocolGroupNode(nodes[i].children, id)) return true;
  }
  return false;
}
// Every protocolId actually referenced anywhere in the tree, so "ungrouped" protocols (including
// both built-ins, before anyone's organized anything yet) can still be found and selected rather
// than silently hidden just because they haven't been placed in a folder.
function groupedProtocolIds(nodes){
  const out = new Set();
  (function walk(list){
    list.forEach(n=>{
      if(n.type==='folder') walk(n.children);
      else if(n.type==='protocol') out.add(n.protocolId);
    });
  })(nodes);
  return out;
}
function defaultProtocols(){
  const axis = newProtocol('AXI4-Stream');
  axis.roles = ['Master','Slave'];
  axis.signals = [
    newProtocolSignal('TDATA','Master → Slave'), newProtocolSignal('TVALID','Master → Slave'), newProtocolSignal('TREADY','Slave → Master')
  ];
  const axil = newProtocol('AXI4-Lite');
  axil.roles = ['Master','Slave'];
  axil.signals = [
    newProtocolSignal('AWADDR','Master → Slave'), newProtocolSignal('WDATA','Master → Slave'),
    newProtocolSignal('ARADDR','Master → Slave'), newProtocolSignal('RDATA','Slave → Master')
  ];
  return [axis, axil];
}
let state = freshState();

function curSheet(){ return state.sheets[state.activeSheetId]; }

function findLibNode(nodes, id){
  for(const n of nodes){
    if(n.id===id) return n;
    if(n.type==='folder'){ const f = findLibNode(n.children, id); if(f) return f; }
  }
  return null;
}
function removeLibNode(nodes, id){
  for(let i=0;i<nodes.length;i++){
    if(nodes[i].id===id){ nodes.splice(i,1); return true; }
    if(nodes[i].type==='folder' && removeLibNode(nodes[i].children, id)) return true;
  }
  return false;
}
function collectFolderNames(nodes, out){
  out = out || [];
  nodes.forEach(n=>{ if(n.type==='folder'){ out.push(n.name); collectFolderNames(n.children, out); } });
  return out;
}

// ---------- sheet kinds ----------
// Every sheet is now port-boundary — its left/right margins hold small synced ports, exactly like
// a Subsystem's EXT boundary always has. A sheet's `kind` only changes: what those boundary ports
// are called/colored (System & CCA: "connectors"; FPGA: "pins"; else: plain "boundary ports"), and
// what component types are allowed in its interior columns.
// Legacy sheets saved before `kind` existed fall back here: a former root sheet behaved like
// today's 'fpga' kind, everything else behaved like 'subsystem'.
function effectiveSheetKind(sheet){
  if(sheet.kind) return sheet.kind;
  return sheet.parentSheetId ? 'subsystem' : 'fpga';
}
function boundaryLabel(sheet){
  const k = effectiveSheetKind(sheet);
  if(k==='fpga') return 'Interfaces';
  if(k==='system' || k==='cca') return 'CONN';
  return 'EXT';
}
function boundaryItemName(sheet){
  const k = effectiveSheetKind(sheet);
  if(k==='fpga') return 'pin';
  if(k==='system' || k==='cca') return 'connector';
  return 'boundary port';
}
function boundaryBandClass(sheet){
  const k = effectiveSheetKind(sheet);
  if(k==='fpga') return 'hw-band';
  if(k==='system' || k==='cca') return 'conn-band';
  return 'bound-band';
}
// CCA sheets get a flat green background across the whole sheet (columns, gutters, boundary, and
// captions) to read like a physical board at a glance. Other kinds use the normal dark theme.
function sheetPalette(sheet){
  if(effectiveSheetKind(sheet)==='cca'){
    return { col:'#0B980B', gutter:'#076407', boundary:'#0B980B', caption:'#eafff0' };
  }
  return null;
}
// A subsystem/FPGA/CCA instance's own child sheet: what kind should it be?
function childSheetKindFor(comp){
  if(comp.isFPGA) return 'fpga';
  if(comp.isCCA) return 'cca';
  return 'subsystem';
}
// Governs what a dragged library node may be dropped into this sheet's interior columns. Nothing
// is ever dropped into the boundary margin any more — that's populated only by adding ports
// (+ Left/Right Port, or Edit Ports), synced up to the parent component exactly like a Subsystem.
//   System interior: CCA only.
//   CCA interior:    FPGA or HW only.
//   FPGA interior:   Hard Macro, Register File, Vendor IP, or RTL only.
//   Subsystem/legacy interior: anything (unrestricted, original behavior).
function classifyDropTarget(sheet, nodeType){
  const kind = effectiveSheetKind(sheet);
  if(nodeType==='hw'){
    if(kind==='cca') return {allowed:true};
    return {allowed:false, reason:'HW components can only be placed on a CCA sheet.'};
  }
  if(nodeType==='fpga'){
    if(kind==='cca') return {allowed:true};
    return {allowed:false, reason:'FPGA components can only be placed on a CCA sheet.'};
  }
  if(nodeType==='cca'){
    if(kind==='system') return {allowed:true};
    return {allowed:false, reason:'CCA components can only be placed on a System sheet.'};
  }
  if(kind==='system') return {allowed:false, reason:'A System sheet only accepts CCA components in its columns.'};
  if(kind==='cca') return {allowed:false, reason:'A CCA sheet only accepts FPGA and HW components in its columns.'};
  if(kind==='fpga'){
    if(nodeType==='hardmacro' || nodeType==='regfile' || nodeType==='vendorip' || nodeType==='custom' || nodeType==='subsystem') return {allowed:true};
    return {allowed:false, reason:'An FPGA sheet only accepts Subsystem, Hard Macro, Register File, Vendor IP, and RTL components in its columns.'};
  }
  return {allowed:true};
}

// Short label of what's allowed in an interior column, shown under the "COL n" caption so users
// don't have to guess or trial-and-error a drop.
function allowedTypesCaption(sheet){
  const kind = effectiveSheetKind(sheet);
  if(kind==='system') return 'CCA';
  if(kind==='cca') return 'FPGA, HW';
  if(kind==='fpga') return 'Subsystem, Hard Macro, Register File, Vendor IP, RTL';
  return 'Any';
}
// Full hierarchy path down to this sheet, root first, joined with " :: " — shown in the banner.
function sheetPathString(sheet){
  const chain = []; let s = sheet;
  while(s){ chain.unshift(s.name); s = s.parentSheetId ? state.sheets[s.parentSheetId] : null; }
  return chain.join(' :: ');
}

// Wraps `str` to `maxChars`-wide lines: first tries splitting on ", " (so an allowed-types list
// breaks at natural item boundaries), then hard-wraps any resulting piece still too long (e.g. a
// single long word like "Interfaces" in a narrow boundary margin).
function wrapTextByChars(str, maxChars){
  const roughLines = [];
  let cur = '';
  str.split(', ').forEach((w,i)=>{
    const piece = (i>0 && cur ? ', ' : '') + w;
    if(cur && (cur+piece).length > maxChars){ roughLines.push(cur); cur = w; }
    else cur += piece;
  });
  if(cur) roughLines.push(cur);
  const lines = [];
  roughLines.forEach(line=>{
    while(line.length > maxChars){
      lines.push(line.slice(0, maxChars));
      line = line.slice(maxChars);
    }
    lines.push(line);
  });
  return lines;
}
// Renders `text`, wrapped, as stacked <text> elements starting at (x,y), one per line.
function renderWrappedCaption(parent, x, y, lineHeight, maxChars, text, cls, style){
  wrapTextByChars(text, maxChars).forEach((line, i)=>{
    svgEl('text',{x, y:y+i*lineHeight, class:cls, style:style||''},parent).textContent = line;
  });
}

function buildLayout(sheet, gutterWidths){
  const edgeW = BOUND_W;
  let x = LEFT_MARGIN;
  const boundaryLeft = { x0:x, x1:x+edgeW }; x += edgeW;
  const colX = [], gutterX = [];
  for(let i=0;i<sheet.numColumns;i++){
    gutterX.push({x0:x, x1:x+gutterWidths[i]}); x += gutterWidths[i];
    colX.push({x0:x, x1:x+COMP_W}); x += COMP_W;
  }
  gutterX.push({x0:x, x1:x+gutterWidths[sheet.numColumns]}); x += gutterWidths[sheet.numColumns];
  const boundaryRight = { x0:x, x1:x+edgeW }; x += edgeW;
  return {
    boundaryLeft, boundaryRight, colX, gutterX, totalW: x + LEFT_MARGIN,
    // Kept for backward compatibility with any component saved with a legacy hwSlot from an
    // older version of the tool (when the boundary held whole components, not synced ports).
    // Such a component will render as skipped rather than crash — move it into an interior
    // column via drag to bring it back.
    hwLeftCol: null, hwRightCol: null
  };
}

// Resolves the rectangle a component sits in: its (legacy) HW slot or its interior column.
function compSlotRect(sheet, layout, comp){
  if(comp.hwSlot) return comp.hwSlot==='left' ? layout.hwLeftCol : layout.hwRightCol;
  return layout.colX[comp.columnIndex];
}

function portAbs(sheet, layout, ref){
  if(ref.kind === 'boundary'){
    const p = sheet.boundaryPorts.find(b=>b.id===ref.portId);
    if(!p) return null;
    const x = p.side==='left' ? layout.boundaryLeft.x1 : layout.boundaryRight.x0;
    return { x, y:p.y, side:p.side, owner:null, port:p };
  } else {
    const comp = sheet.components.find(c=>c.id===ref.componentId);
    if(!comp) return null;
    const port = comp.ports.find(p=>p.id===ref.portId);
    if(!port) return null;
    const col = compSlotRect(sheet, layout, comp);
    if(!col) return null;
    const x = port.side==='left' ? col.x0 : col.x1;
    return { x, y: comp.y + port.offset, side:port.side, owner:comp, port };
  }
}

function computeLayout(sheet){
  let gw = new Array(sheet.numColumns+1).fill(MIN_GUTTER);
  let layout = buildLayout(sheet, gw);
  const spans = sheet.connections.map(c=>{
    const a = portAbs(sheet, layout, c.from), b = portAbs(sheet, layout, c.to);
    if(!a||!b) return null;
    return { lo: Math.min(a.x,b.x), hi: Math.max(a.x,b.x) };
  }).filter(Boolean);
  const counts = new Array(sheet.numColumns+1).fill(0);
  spans.forEach(s=>{
    layout.gutterX.forEach((g,i)=>{ if(s.hi > g.x0 && s.lo < g.x1) counts[i]++; });
  });
  gw = counts.map(c => Math.min(260, MIN_GUTTER + c*16));
  layout = buildLayout(sheet, gw);
  return layout;
}

function columnOf(ref, sheet){
  if(ref.kind==='boundary'){
    const p = sheet.boundaryPorts.find(b=>b.id===ref.portId);
    return p.side==='left' ? -1 : sheet.numColumns;
  }
  const comp = sheet.components.find(c=>c.id===ref.componentId);
  return comp.hwSlot ? ('hw-'+comp.hwSlot) : comp.columnIndex;
}

function nearestColumn(layout, mx){
  let best=0, bestD=Infinity;
  layout.colX.forEach((c,i)=>{ const cx=(c.x0+c.x1)/2; const d=Math.abs(mx-cx); if(d<bestD){bestD=d;best=i;} });
  return best;
}

// ---------- min-height / margin enforcement ----------
function enforceMinHeight(comp){
  let minH = PORT_MARGIN_TOP + PORT_MARGIN_BOTTOM;
  comp.ports.forEach(p=>{
    if(p.offset < PORT_MARGIN_TOP) p.offset = PORT_MARGIN_TOP;
    minH = Math.max(minH, p.offset + PORT_MARGIN_BOTTOM);
  });
  if(comp.height < minH) comp.height = minH;
}

// ---------- alignment ----------
function setPortAbsY(sheet, ref, y){
  if(ref.kind==='boundary'){
    const p = sheet.boundaryPorts.find(b=>b.id===ref.portId);
    p.y = Math.max(BOUNDARY_PORT_MARGIN, y);
  } else {
    const comp = sheet.components.find(c=>c.id===ref.componentId);
    const port = comp.ports.find(p=>p.id===ref.portId);
    let offset = y - comp.y;
    if(offset < PORT_MARGIN_TOP){
      const shift = PORT_MARGIN_TOP - offset;
      comp.y -= shift; comp.height += shift;
      comp.ports.forEach(p=>{ if(p.id!==port.id) p.offset += shift; });
      offset = PORT_MARGIN_TOP;
    }
    if(offset > comp.height - PORT_MARGIN_BOTTOM){
      comp.height = offset + PORT_MARGIN_BOTTOM;
    }
    port.offset = offset;
  }
}
function refKey(ref){ return ref.kind==='boundary' ? 'b:'+ref.portId : 'c:'+ref.componentId+':'+ref.portId; }
function refsEqual(a,b){ return refKey(a)===refKey(b); }
function refTouches(ref, kind, componentId, portId){
  return ref.kind===kind && ref.portId===portId && (kind!=='component' || ref.componentId===componentId);
}
function connTouches(conn, kind, componentId, portId){
  return refTouches(conn.from,kind,componentId,portId) || refTouches(conn.to,kind,componentId,portId);
}

// ---------- overlap avoidance ----------
// Returns the list of {y} for ports that share the same edge as `ref` (siblings it must not overlap).
function siblingPortYs(sheet, ref){
  if(ref.kind==='boundary'){
    const self = sheet.boundaryPorts.find(b=>b.id===ref.portId);
    return sheet.boundaryPorts.filter(b=>b!==self && b.side===self.side).map(b=>b.y);
  } else {
    const comp = sheet.components.find(c=>c.id===ref.componentId);
    const self = comp.ports.find(p=>p.id===ref.portId);
    return comp.ports.filter(p=>p!==self && p.side===self.side).map(p=>comp.y+p.offset);
  }
}
// Nudges y up or down (toward its original direction of approach) until it clears every sibling port on the same edge.
function resolveOverlap(sheet, ref, y){
  const siblings = siblingPortYs(sheet, ref);
  for(let iter=0; iter<8; iter++){
    let moved = false;
    for(const sy of siblings){
      if(Math.abs(y-sy) < PORT_MIN_GAP){
        y = (y <= sy) ? sy - PORT_MIN_GAP : sy + PORT_MIN_GAP;
        moved = true;
      }
    }
    if(!moved) break;
  }
  return y;
}

function realign(sheet, startRef, targetY, visited){
  visited = visited || new Set();
  const key = refKey(startRef);
  if(visited.has(key)) return;
  visited.add(key);
  setPortAbsY(sheet, startRef, targetY);
  sheet.connections.forEach(c=>{
    if(refsEqual(c.from, startRef)) realign(sheet, c.to, targetY, visited);
    else if(refsEqual(c.to, startRef)) realign(sheet, c.from, targetY, visited);
  });
}

// ---------- subsystem linking ----------
function instantiatePorts(templatePorts){
  return templatePorts.map(p=>({ id:uid('p'), name:p.name, side:p.side, offset:p.offset, groupId:'', linkedBoundaryPortId:null,
    protocolId: p.protocolId||null, protocolRole: p.protocolRole||'' }));
}
// Library-template features reference ports by name (library ports have no ids yet); instance
// features reference ports by id. This translates a template's features onto a freshly
// instantiated port list.
function instantiateFeatures(templateFeatures, instancePorts){
  return (templateFeatures||[]).map(f=>({
    id: uid('feat'), name: f.name,
    steps: (f.steps||[]).map(s=>{
      const port = instancePorts.find(p=>p.name===s.portKey);
      return { id: uid('step'), kind:'port-event', portKey: port ? port.id : null, direction: s.direction, label: s.label||'' };
    })
  }));
}
function linkSheetToComponent(childSheet, comp){
  comp.ports.forEach(p=>{
    const sideCount = childSheet.boundaryPorts.filter(b=>b.side===p.side).length;
    const startY = 60 + sideCount*30;
    const bp = { id: uid('bp'), side:p.side, name:p.name, groupId:'', y: startY, linkedParentPortId: p.id };
    childSheet.boundaryPorts.push(bp);
    bp.y = resolveOverlap(childSheet, {kind:'boundary', portId:bp.id}, startY);
    p.linkedBoundaryPortId = bp.id;
  });
}
// Keeps a hierarchical component's clock/reset ports in sync with a matching local, pass-through
// clock/reset on its OWN child sheet — the mechanism that makes a subsystem's internal clock
// wiring self-contained and portable. The child sheet never sees what its ports are actually wired
// to one level up; it just sees a local clock/reset named after the port. Call this any time a
// component's clockPorts/resetPorts change (after Edit Properties → Clocking saves, and right
// after a hierarchical component + its child sheet are first created).
function syncClockingBoundary(comp){
  if(!comp.childSheetId) return;
  const childSheet = state.sheets[comp.childSheetId];
  if(!childSheet) return;
  ensureSheetClocking(childSheet);
  const livePortIds = new Set((comp.clockPorts||[]).map(p=>p.id));
  const liveResetPortIds = new Set((comp.resetPorts||[]).map(p=>p.id));
  // Drop pass-throughs whose source port no longer exists, and clean up anything that had
  // assigned itself to one.
  childSheet.clocks = childSheet.clocks.filter(c=>{
    if(!c.linkedParentPortId || livePortIds.has(c.linkedParentPortId)) return true;
    childSheet.components.forEach(cc=> (cc.clockPorts||[]).forEach(p=>{ if(p.assignedClockId===c.id) p.assignedClockId=null; }));
    return false;
  });
  childSheet.resets = childSheet.resets.filter(r=>{
    if(!r.linkedParentPortId || liveResetPortIds.has(r.linkedParentPortId)) return true;
    childSheet.components.forEach(cc=> (cc.resetPorts||[]).forEach(p=>{ if(p.assignedResetId===r.id) p.assignedResetId=null; }));
    return false;
  });
  // Create or rename pass-throughs for every current port.
  (comp.clockPorts||[]).forEach(p=>{
    let c = p.linkedChildClockId ? childSheet.clocks.find(x=>x.id===p.linkedChildClockId) : null;
    if(!c){ c = newClock(p.name); c.linkedParentPortId = p.id; childSheet.clocks.push(c); p.linkedChildClockId = c.id; }
    else c.name = p.name;
  });
  (comp.resetPorts||[]).forEach(p=>{
    let r = p.linkedChildResetId ? childSheet.resets.find(x=>x.id===p.linkedChildResetId) : null;
    if(!r){ r = newReset(p.name); r.linkedParentPortId = p.id; childSheet.resets.push(r); p.linkedChildResetId = r.id; }
    else r.name = p.name;
  });
}
function drillInto(comp){
  if(!comp.isSubsystem) return; // atomic components are leaves — only subsystems have hierarchy
  const parentSheet = curSheet();
  if(!comp.childSheetId){
    const sh = newSheet(comp.instanceName, parentSheet.id, comp.id, childSheetKindFor(comp));
    linkSheetToComponent(sh, comp);
    state.sheets[sh.id] = sh;
    comp.childSheetId = sh.id;
  }
  state.activeSheetId = comp.childSheetId;
  armedPort = null;
  render();
}
function renameInstance(comp){
  const nm = prompt('Instance name (this component\'s label in the diagram — its entity/type "'+comp.entityName+'" stays the same):', comp.instanceName);
  if(nm===null || !nm.trim()) return;
  comp.instanceName = nm.trim();
  if(comp.childSheetId){
    const sh = state.sheets[comp.childSheetId];
    if(sh) sh.name = comp.instanceName;
  }
  render();
}
function flipComponent(comp){
  comp.ports.forEach(p=>{ p.side = (p.side==='left') ? 'right' : 'left'; });
  syncLinkedComponent(comp);
  render();
}
function deleteComponent(sheet, comp){
  if(!confirm('Delete component "'+comp.instanceName+'" and its connections?')) return;
  sheet.components = sheet.components.filter(c=>c!==comp);
  sheet.connections = sheet.connections.filter(c=>{
    const touchesA = c.from.kind==='component' && c.from.componentId===comp.id;
    const touchesB = c.to.kind==='component' && c.to.componentId===comp.id;
    return !(touchesA || touchesB);
  });
  if(selectedComponent && selectedComponent.componentId===comp.id) selectedComponent = null;
  render();
}
// Paste the current clipboard onto `sheet` at (columnIndex, y).
//   Copy → a brand-new instance sharing a linkedId with the source, so ports/features/description/
//     colors/resources/height stay identical on both from then on (see syncLinkedComponent), but
//     instanceName stays independent per instance — the one thing that's allowed to differ between
//     copies, the same way a VHDL label is unique to its own instantiation even when the entity
//     underneath is shared — and NOT position (sheet, columnIndex, y). A hierarchical component
//     (Subsystem/CCA/FPGA) keeps the exact same childSheetId as the source, so both drill into the
//     literal same sheet — "duplicate subcomponents map to the same sheet."
//   Cut → the *same* instance relocates: removed from its old sheet, added to the new one. Its
//     connections only survive the move if pasted back onto the same sheet it came from (a
//     connection references components on one specific sheet, so moving sheets invalidates them).
function pasteClipboard(sheet, columnIndex, y){
  if(!clipboard) return;
  const srcSheet = state.sheets[clipboard.sheetId];
  const srcComp = srcSheet && srcSheet.components.find(c=>c.id===clipboard.componentId);
  if(!srcComp){ clipboard = null; return; }

  const check = classifyDropTarget(sheet, componentNodeType(srcComp));
  if(!check.allowed){ alert(check.reason); return; }

  if(clipboard.mode==='cut'){
    const sameSheet = sheet===srcSheet;
    if(!sameSheet){
      srcSheet.components = srcSheet.components.filter(c=>c!==srcComp);
      srcSheet.connections = srcSheet.connections.filter(c=>{
        const touchesA = c.from.kind==='component' && c.from.componentId===srcComp.id;
        const touchesB = c.to.kind==='component' && c.to.componentId===srcComp.id;
        return !(touchesA || touchesB);
      });
      sheet.components.push(srcComp);
    }
    srcComp.columnIndex = columnIndex;
    srcComp.y = Math.max(TOP_MARGIN, y);
    srcComp.hwSlot = null;
    clipboard = null; // one-shot
    if(selectedComponent && selectedComponent.componentId===srcComp.id) selectedComponent = null;
    render();
    return;
  }

  // Copy: establish a link group on the source the first time it's ever duplicated.
  if(!srcComp.linkedId) srcComp.linkedId = uid('link');
  const dup = JSON.parse(JSON.stringify(srcComp));
  dup.id = uid('comp');
  dup.columnIndex = columnIndex;
  dup.y = Math.max(TOP_MARGIN, y);
  dup.hwSlot = null;
  // Port ids are kept identical to the source (via the clone) — that's what lets a boundary port
  // on a shared child sheet, or a connection's port ref, still resolve correctly to whichever
  // instance is currently in view.
  sheet.components.push(dup);
  render();
}

// Split view: open a subsystem's own sheet in a second panel alongside the current one, both
// fully interactive and independently laid out. Avoids trying to reconcile two different grids
// in one space — each sheet just gets its own.
function showSubsystemAlongside(comp){
  if(!comp.isSubsystem || !comp.childSheetId) return;
  peekSheetId = comp.childSheetId;
  render();
}
function closePeek(){
  peekSheetId = null;
  renderPeek();
}

// A subsystem's description IS its sheet's description (single source of truth) — reading or
// writing one always reflects the other. Atomic/HW/Hard Macro components keep their own text.
function getCompDescription(comp){
  if(comp.isSubsystem && comp.childSheetId){
    const sh = state.sheets[comp.childSheetId];
    return sh ? (sh.description||'') : (comp.description||'');
  }
  return comp.description||'';
}
function setCompDescription(comp, text){
  if(comp.isSubsystem && comp.childSheetId){
    const sh = state.sheets[comp.childSheetId];
    if(sh){ sh.description = text; return; }
  }
  comp.description = text;
}
function autosizeTextarea(ta){
  ta.style.height = 'auto';
  ta.style.height = (ta.scrollHeight+2)+'px';
}
function componentKindLabel(comp){
  return comp.isFPGA ? 'FPGA' : comp.isCCA ? 'CCA' : comp.isHW ? 'HW' : comp.isVendorIP ? 'vendor IP' : comp.isHardMacro ? 'hard macro' : comp.isRegisterFile ? 'register file (CSR)' : comp.isCustom ? 'RTL component (WIP)' : comp.isSubsystem ? 'subsystem' : 'component';
}

function editComponentColors(comp){
  const root = document.getElementById('modalRoot');

  modal.innerHTML = `<h3>Colors — ${escapeHtml(comp.instanceName)}</h3>
    <label>Text color</label><input type="color" id="cText" value="${comp.textColor || '#cfd8e3'}">
    <label>Background color</label><input type="color" id="cBg" value="${comp.bgColor || typeDefaultBgColor(comp) || '#182233'}">
    <div class="modalBtns">
      <button id="cReset">Reset to Default</button>
      <button id="cCancel">Cancel</button>
      <button id="cSave" style="border-color:var(--accent);color:var(--accent);">Save</button>
    </div>`;
  overlay.appendChild(modal); root.appendChild(overlay);
  modal.querySelector('#cCancel').onclick = ()=>{ root.innerHTML=''; };

// Feature editor — works for both a placed instance (steps reference ports by id) and a library
// template (steps reference ports by name, since template ports have no id yet). `portOptions` is
// a list of {key, label} pairs the step's port-picker offers; `entity.features` is mutated in place.
// `embedContainer`, if given, renders directly into it (no overlay/title/Close button of its own)
// so this same editor can live inside the Edit Properties modal's Features tab.
function editFeaturesModal(entity, portOptions, isTemplate, embedContainer){
  const root = document.getElementById('modalRoot');
  if(entity.features===undefined) entity.features = [];
  let selectedFeatureId = entity.features.length ? entity.features[0].id : null;
  // Only a placed subsystem instance has a child sheet to call into — library templates and
  // non-subsystem entities can only ever have port-event steps.
  const childSheet = (!isTemplate && entity.childSheetId) ? state.sheets[entity.childSheetId] : null;
  // Features are fully live (no Save button) — every mutation below syncs immediately to any
  // linked duplicate of this component. A library template has no linkedId, so this is a no-op.
  function syncEntity(){ if(!isTemplate) syncLinkedComponent(entity); }

  function draw(){
    let container;
    if(embedContainer){
      container = embedContainer;
    } else {
      root.innerHTML = '';
      const overlay = document.createElement('div'); overlay.className='overlay';
      const modal = document.createElement('div'); modal.className='modal';
      modal.style.width = '480px';
      overlay.appendChild(modal); root.appendChild(overlay);
      container = modal;
    }
    const feat = entity.features.find(f=>f.id===selectedFeatureId) || null;

    container.innerHTML = `${embedContainer ? '' : `<h3>Features — ${escapeHtml(entity.instanceName || entity.name || '')}${isTemplate ? ' (library template)' : ''}</h3>`}
      <label>Feature</label>
      <select id="fSelect">
        ${entity.features.length ? entity.features.map(f=>`<option value="${f.id}" ${f.id===selectedFeatureId?'selected':''}>${escapeHtml(f.name)}</option>`).join('') : '<option value="">(none yet)</option>'}
      </select>
      <div style="display:flex;gap:6px;margin-top:6px;">
        <button id="fNew">+ New Feature</button>
        ${feat ? '<button id="fRename">Rename</button><button id="fDelete" style="color:var(--bad);">Delete</button>' : ''}
      </div>
      ${feat ? `
      <label style="margin-top:14px;">Steps for "${escapeHtml(feat.name)}"</label>
      <div id="fSteps"></div>
      <div style="display:flex;gap:6px;margin-top:4px;">
        <button id="fAddPortStep">+ Add Port Step</button>
        ${childSheet ? '<button id="fAddFeatureStep">+ Add Feature Step</button>' : ''}
      </div>
      ${childSheet ? `
      <div id="fFeatureStepPicker" style="display:none;margin-top:8px;padding:8px;background:var(--bg);border:1px solid var(--line);border-radius:4px;">
        <label>Child component</label>
        <select id="fpComp">
          ${childSheet.components.length ? childSheet.components.map(c=>`<option value="${c.id}">${escapeHtml(c.instanceName)}</option>`).join('') : '<option value="">(no components on this sheet)</option>'}
        </select>
        <label>Feature</label>
        <select id="fpFeat"></select>
        <div style="display:flex;gap:6px;margin-top:6px;">
          <button id="fpCancel">Cancel</button>
          <button id="fpAdd" style="border-color:var(--accent);color:var(--accent);">Add</button>
        </div>
      </div>` : ''}
      ` : '<div style="color:var(--dim);font-size:11px;margin-top:14px;">No features defined yet.</div>'}
      ${embedContainer ? '' : '<div class="modalBtns"><button id="fClose">Close</button></div>'}`;

    container.querySelector('#fSelect').addEventListener('change', (e)=>{ selectedFeatureId = e.target.value || null; draw(); });
    container.querySelector('#fNew').onclick = ()=>{
      const nm = prompt('Feature name:', 'New Feature'); if(!nm || !nm.trim()) return;
      const f = { id: uid('feat'), name: nm.trim(), steps: [] };
      entity.features.push(f);
      selectedFeatureId = f.id;
      syncEntity();
      draw();
    };
    if(feat){
      container.querySelector('#fRename').onclick = ()=>{
        const nm = prompt('Feature name:', feat.name); if(!nm || !nm.trim()) return;
        feat.name = nm.trim(); syncEntity(); draw();
      };
      container.querySelector('#fDelete').onclick = ()=>{
        if(confirm('Delete feature "'+feat.name+'"?')){
          entity.features = entity.features.filter(f=>f.id!==feat.id);
          selectedFeatureId = entity.features.length ? entity.features[0].id : null;
          syncEntity();
          draw();
        }
      };
      const stepsWrap = container.querySelector('#fSteps');
      if(feat.steps.length===0){
        stepsWrap.innerHTML = '<div style="color:var(--dim);font-size:11px;">No steps yet — add one below.</div>';
      }
      feat.steps.forEach((s,i)=>{
        const row = document.createElement('div');
        row.style.cssText = 'display:flex;gap:4px;margin-bottom:4px;align-items:center;';
        if(s.kind==='feature-ref'){
          const childComp = childSheet && childSheet.components.find(c=>c.id===s.componentId);
          const childFeat = childComp && childComp.features && childComp.features.find(f=>f.id===s.featureId);
          const broken = !childComp || !childFeat;
          const desc = broken ? '⚠ broken reference' : (childComp.instanceName+' . '+childFeat.name);
          row.innerHTML = `
            <div style="flex:2;font-size:12px;padding:5px 6px;${broken?'color:var(--bad);border:1px solid var(--bad);border-radius:3px;':'color:var(--accent);'}"
              title="${broken?'The referenced component or feature no longer exists — fix by removing this step':'Calls a feature on another component'}">${escapeHtml(desc)}</div>
            <input data-i="${i}" class="sLabel" placeholder="what happens (optional)" value="${escapeHtml(s.label||'')}" style="flex:3;">
            <button data-i="${i}" class="sUp" title="Move up">↑</button>
            <button data-i="${i}" class="sDown" title="Move down">↓</button>
            <button data-i="${i}" class="sDel">×</button>`;
        } else {
          row.innerHTML = `
            <select data-i="${i}" class="sPort" style="flex:2;">
              ${portOptions.length ? portOptions.map(o=>`<option value="${escapeHtml(o.key)}" ${o.key===s.portKey?'selected':''}>${escapeHtml(o.label)}</option>`).join('') : '<option value="">(no ports)</option>'}
            </select>
            <select data-i="${i}" class="sDir" style="flex:1;">
              <option value="in" ${s.direction==='in'?'selected':''}>in</option>
              <option value="out" ${s.direction==='out'?'selected':''}>out</option>
            </select>
            <input data-i="${i}" class="sLabel" placeholder="what happens (optional)" value="${escapeHtml(s.label||'')}" style="flex:3;">
            <button data-i="${i}" class="sUp" title="Move up">↑</button>
            <button data-i="${i}" class="sDown" title="Move down">↓</button>
            <button data-i="${i}" class="sDel">×</button>`;
        }
        stepsWrap.appendChild(row);
      });
      stepsWrap.querySelectorAll('.sPort').forEach(el=> el.onchange=(e)=>{ feat.steps[+e.target.dataset.i].portKey = e.target.value; syncEntity(); });
      stepsWrap.querySelectorAll('.sDir').forEach(el=> el.onchange=(e)=>{ feat.steps[+e.target.dataset.i].direction = e.target.value; syncEntity(); });
      stepsWrap.querySelectorAll('.sLabel').forEach(el=> el.oninput=(e)=>{ feat.steps[+e.target.dataset.i].label = e.target.value; syncEntity(); });
      stepsWrap.querySelectorAll('.sUp').forEach(el=> el.onclick=(e)=>{
        const i=+e.target.dataset.i;
        if(i>0){ const t=feat.steps[i-1]; feat.steps[i-1]=feat.steps[i]; feat.steps[i]=t; syncEntity(); draw(); }
      });
      stepsWrap.querySelectorAll('.sDown').forEach(el=> el.onclick=(e)=>{
        const i=+e.target.dataset.i;
        if(i<feat.steps.length-1){ const t=feat.steps[i+1]; feat.steps[i+1]=feat.steps[i]; feat.steps[i]=t; syncEntity(); draw(); }
      });
      stepsWrap.querySelectorAll('.sDel').forEach(el=> el.onclick=(e)=>{
        feat.steps.splice(+e.target.dataset.i,1); syncEntity(); draw();
      });
      container.querySelector('#fAddPortStep').onclick = ()=>{
        if(portOptions.length===0){ alert('This component has no ports yet — add ports first (Edit Ports) before building a feature step.'); return; }
        feat.steps.push({ id: uid('step'), kind:'port-event', portKey: portOptions[0].key, direction:'out', label:'' });
        syncEntity();
        draw();
      };
      if(childSheet){
        const picker = container.querySelector('#fFeatureStepPicker');
        const compSel = container.querySelector('#fpComp');
        const featSel = container.querySelector('#fpFeat');
        function refreshFeatOptions(){
          const c = childSheet.components.find(x=>x.id===compSel.value);
          const feats = (c && c.features) || [];
          featSel.innerHTML = feats.length
            ? feats.map(f=>`<option value="${f.id}">${escapeHtml(f.name)}</option>`).join('')
            : '<option value="">(this component has no features)</option>';
        }
        if(compSel.value) refreshFeatOptions();
        compSel.addEventListener('change', refreshFeatOptions);
        container.querySelector('#fAddFeatureStep').onclick = ()=>{
          if(childSheet.components.length===0){ alert('This subsystem has no components on its sheet yet.'); return; }
          picker.style.display = picker.style.display==='none' ? 'block' : 'none';
        };
        container.querySelector('#fpCancel').onclick = ()=>{ picker.style.display='none'; };
        container.querySelector('#fpAdd').onclick = ()=>{
          const cid = compSel.value, fid = featSel.value;
          if(!cid || !fid){ alert('Pick a component and one of its features.'); return; }
          feat.steps.push({ id: uid('step'), kind:'feature-ref', componentId: cid, featureId: fid, label:'' });
          picker.style.display = 'none';
          syncEntity();
          draw();
        };
      }
    }
    if(!embedContainer){
      container.querySelector('#fClose').onclick = ()=>{ root.innerHTML=''; render(); };
    }
  }
  draw();
}

// ---------- ports editor (shared by components AND sheet boundaries) ----------
// Both "a component's own ports" and "a sheet's own boundary pins/connectors/ports" are edited
// through the exact same UI — only how a port is added/renamed/deleted (and what it syncs to)
// differs, which is what an adapter abstracts over.
//   adapter.title         — modal header text
//   adapter.itemLabelCap  — singular capitalized noun for buttons/placeholders ("Port"/"Pin"/"Connector")
//   adapter.list()        — current ports as [{raw, name, side, groupId}]
//   adapter.addPort(name, side, groupId)
//   adapter.renamePort(raw, name)
//   adapter.setSide(raw, side)
//   adapter.setGroup(raw, groupId)
//   adapter.deletePort(raw)
// A copy-pasted "duplicate" component shares a linkedId with its source; whenever any shared
// field on one changes, this copies that field to every other component (on any sheet) with the
// same linkedId — never touching placement (sheet membership, columnIndex, y, hwSlot, id,
// childSheetId). Guarded on a truthy linkedId so two ordinary unlinked components (both
// linkedId===null) never accidentally get treated as siblings.
function syncLinkedComponent(comp){
  if(!comp || !comp.linkedId) return;
  Object.values(state.sheets).forEach(sh=>{
    sh.components.forEach(other=>{
      if(other===comp || other.linkedId!==comp.linkedId) return;
      other.ports = JSON.parse(JSON.stringify(comp.ports));
      other.features = JSON.parse(JSON.stringify(comp.features));
      other.description = comp.description;
      other.textColor = comp.textColor;
      other.bgColor = comp.bgColor;
      other.resources = JSON.parse(JSON.stringify(comp.resources));
      other.resourceNotes = comp.resourceNotes;
      other.height = comp.height;
      other.portsLocked = comp.portsLocked;
      other.bsp = JSON.parse(JSON.stringify(comp.bsp));
      other.clockPorts = JSON.parse(JSON.stringify(comp.clockPorts));
      other.resetPorts = JSON.parse(JSON.stringify(comp.resetPorts));
      syncClockingBoundary(other);
    });
  });
}
function componentPortsAdapter(comp, sheet, clockPortsGetter){
  return {
    title: 'Edit Ports — ' + comp.instanceName,
    itemLabelCap: 'Port',
    supportsProtocols: true,
    supportsClockAssociation: true,
    supportsGroupId: false,
    // Defaults to the component's own already-saved clock ports, but editPropertiesModal passes a
    // getter pointing at the Clocking tab's draft instead — so a clock port added there is
    // immediately available to bind a port to, without needing to Save first (see the ports tab
    // instantiation below for why this has to be a lazy function, not a direct reference).
    clockPortOptions: ()=> (clockPortsGetter ? clockPortsGetter() : comp.clockPorts) || [],
    locked: comp.portsLocked,
    list: ()=> comp.ports.map(p=>({raw:p, name:p.name, side:p.side, groupId:p.groupId, protocolId:p.protocolId||null, protocolRole:p.protocolRole||'', clockPortId:p.clockPortId||null})),
    addPort: (name, side, groupId, extra)=>{
      const sideCount = comp.ports.filter(p=>p.side===side).length;
      let offset = PORT_MARGIN_TOP + sideCount*28;
      if(offset > comp.height - PORT_MARGIN_BOTTOM) comp.height = offset + PORT_MARGIN_BOTTOM;
      const port = { id: uid('p'), name, side, offset, groupId, linkedBoundaryPortId:null,
        protocolId: (extra && extra.protocolId) || null, protocolRole: (extra && extra.protocolRole) || '', clockPortId: null };
      comp.ports.push(port);
      const compRef = { kind:'component', componentId:comp.id, portId:port.id };
      const adjY = resolveOverlap(sheet, compRef, comp.y+offset);
      setPortAbsY(sheet, compRef, adjY);
      const childSheet = state.sheets[comp.childSheetId];
      if(childSheet){
        const startY = 60 + childSheet.boundaryPorts.filter(p=>p.side===side).length*30;
        const bp = { id: uid('bp'), side, name, groupId, y: startY, linkedParentPortId: port.id };
        childSheet.boundaryPorts.push(bp);
        bp.y = resolveOverlap(childSheet, {kind:'boundary', portId:bp.id}, startY);
        port.linkedBoundaryPortId = bp.id;
      }
      syncLinkedComponent(comp);
      return port;
    },
    renamePort: (p, name)=>{
      p.name = name;
      if(p.linkedBoundaryPortId && comp.childSheetId){
        const childSheet = state.sheets[comp.childSheetId];
        const bp = childSheet && childSheet.boundaryPorts.find(b=>b.id===p.linkedBoundaryPortId);
        if(bp) bp.name = name;
      }
      syncLinkedComponent(comp);
    },
    setSide: (p, side)=>{
      p.side = side;
      if(p.linkedBoundaryPortId && comp.childSheetId){
        const childSheet = state.sheets[comp.childSheetId];
        const bp = childSheet && childSheet.boundaryPorts.find(b=>b.id===p.linkedBoundaryPortId);
        if(bp) bp.side = side;
      }
      syncLinkedComponent(comp);
    },
    setGroup: (p, groupId)=>{ p.groupId = groupId; syncLinkedComponent(comp); },
    setClockPort: (p, clockPortId)=>{ p.clockPortId = clockPortId || null; syncLinkedComponent(comp); },
    setProtocol: (p, protocolId, protocolRole)=>{ p.protocolId = protocolId || null; p.protocolRole = protocolRole || ''; syncLinkedComponent(comp); },
    deletePort: (p)=>{
      comp.ports = comp.ports.filter(x=>x!==p);
      sheet.connections = sheet.connections.filter(c=> !connTouches(c,'component',comp.id,p.id));
      if(p.linkedBoundaryPortId && comp.childSheetId){
        const childSheet = state.sheets[comp.childSheetId];
        if(childSheet){
          childSheet.boundaryPorts = childSheet.boundaryPorts.filter(b=>b.id!==p.linkedBoundaryPortId);
          childSheet.connections = childSheet.connections.filter(c=> !connTouches(c,'boundary',null,p.linkedBoundaryPortId));
        }
      }
      syncLinkedComponent(comp);
    }
  };
}
// Editing a sheet's own boundary — the mirror image of componentPortsAdapter: syncs outward to
// the parent component's ports instead of inward to a child sheet.
function boundaryPortsAdapter(sheet){
  const label = boundaryItemName(sheet); // 'pin' / 'connector' / 'boundary port'
  const labelCap = label.charAt(0).toUpperCase()+label.slice(1);
  return {
    title: 'Edit ' + labelCap + 's — ' + sheet.name,
    itemLabelCap: labelCap,
    supportsGroupId: true,
    list: ()=> sheet.boundaryPorts.map(p=>({raw:p, name:p.name, side:p.side, groupId:p.groupId})),
    addPort: (name, side, groupId)=>{
      const startY = 60 + sheet.boundaryPorts.filter(p=>p.side===side).length*30;
      const bp = { id: uid('bp'), side, name, groupId, y: startY, linkedParentPortId: null };
      sheet.boundaryPorts.push(bp);
      bp.y = resolveOverlap(sheet, {kind:'boundary', portId:bp.id}, startY);
      const psheet = state.sheets[sheet.parentSheetId];
      const pcomp = (psheet && sheet.parentComponentId) ? psheet.components.find(c=>c.id===sheet.parentComponentId) : null;
      if(pcomp){
        const sideCount = pcomp.ports.filter(p=>p.side===side).length;
        let offset = PORT_MARGIN_TOP + sideCount*28;
        if(offset > pcomp.height - PORT_MARGIN_BOTTOM) pcomp.height = offset + PORT_MARGIN_BOTTOM;
        const port = { id: uid('p'), name, side, offset, groupId, linkedBoundaryPortId: bp.id };
        pcomp.ports.push(port);
        const ref = { kind:'component', componentId:pcomp.id, portId:port.id };
        const adjY = resolveOverlap(psheet, ref, pcomp.y+offset);
        setPortAbsY(psheet, ref, adjY);
        bp.linkedParentPortId = port.id;
        syncLinkedComponent(pcomp);
      }
    },
    renamePort: (p, name)=>{
      p.name = name;
      if(p.linkedParentPortId && sheet.parentSheetId && sheet.parentComponentId){
        const psheet = state.sheets[sheet.parentSheetId];
        const pcomp = psheet && psheet.components.find(c=>c.id===sheet.parentComponentId);
        const pport = pcomp && pcomp.ports.find(pp=>pp.id===p.linkedParentPortId);
        if(pport){ pport.name = name; syncLinkedComponent(pcomp); }
      }
    },
    setSide: (p, side)=>{
      p.side = side;
      if(p.linkedParentPortId && sheet.parentSheetId && sheet.parentComponentId){
        const psheet = state.sheets[sheet.parentSheetId];
        const pcomp = psheet && psheet.components.find(c=>c.id===sheet.parentComponentId);
        const pport = pcomp && pcomp.ports.find(pp=>pp.id===p.linkedParentPortId);
        if(pport){ pport.side = side; syncLinkedComponent(pcomp); }
      }
    },
    setGroup: (p, groupId)=>{ p.groupId = groupId; },
    deletePort: (p)=>{
      sheet.boundaryPorts = sheet.boundaryPorts.filter(x=>x!==p);
      sheet.connections = sheet.connections.filter(c=> !connTouches(c,'boundary',null,p.id));
      if(p.linkedParentPortId && sheet.parentSheetId && sheet.parentComponentId){
        const psheet = state.sheets[sheet.parentSheetId];
        const pcomp = psheet && psheet.components.find(c=>c.id===sheet.parentComponentId);
        if(pcomp){
          pcomp.ports = pcomp.ports.filter(pp=>pp.id!==p.linkedParentPortId);
          psheet.connections = psheet.connections.filter(c=> !connTouches(c,'component',pcomp.id,p.linkedParentPortId));
          syncLinkedComponent(pcomp);
        }
      }
    }
  };
}
// Renders the row-list + add/save UI for an adapter directly into `container` — used both by the
// standalone Edit Ports/Pins/Connectors modal and by the Ports tab inside Edit Properties, so the
// editing experience is identical everywhere a set of ports can be changed.
function makePortRows(adapter){
  return adapter.list().map(p=>({ raw:p.raw, name:p.name, side:p.side, groupId:p.groupId||'',
    protocolId:p.protocolId||null, protocolRole:p.protocolRole||'', clockPortId:p.clockPortId||null, isNew:false, deleted:false }));
}
function commitPortRows(adapter, rows){
  if(adapter.locked) return; // locked components' ports never change — see insertLibraryComponent
  rows.forEach(row=>{
    if(row.deleted){
      if(!row.isNew) adapter.deletePort(row.raw);
      return;
    }
    const name = row.name.trim() || adapter.itemLabelCap.toUpperCase();
    if(row.isNew){
      const created = adapter.addPort(name, row.side, row.groupId.trim(), { protocolId: row.protocolId, protocolRole: row.protocolRole });
      if(adapter.supportsClockAssociation && row.clockPortId && created) adapter.setClockPort(created, row.clockPortId);
    } else {
      if(row.raw.name !== name) adapter.renamePort(row.raw, name);
      adapter.setSide(row.raw, row.side);
      adapter.setGroup(row.raw, row.groupId.trim());
      if(adapter.supportsClockAssociation) adapter.setClockPort(row.raw, row.clockPortId);
      if(adapter.supportsProtocols && adapter.setProtocol) adapter.setProtocol(row.raw, row.protocolId, row.protocolRole);
    }
  });
}
// Renders the row-list UI against an existing `rows` array, mutating it in place as the user
// edits (add/delete/rename/move/group/assign-protocol), without committing anything itself.
// `closeFn`, if given, adds this editor's own Save+Close (the standalone right-click Edit
// Ports/Pins/Connectors case); omitted, it's just the row list with no buttons of its own
// (embedded in Edit Properties, where the single outer Save button commits it instead).
function renderPortsRowsUI(container, adapter, rows, closeFn){
  if(adapter.locked){
    container.innerHTML = `
      <div style="color:var(--dim);font-size:11px;margin-bottom:8px;">This component's ${escapeHtml(adapter.itemLabelCap.toLowerCase())}s come from a library-defined interface (not a Base Class) and are locked — they can't be added, removed, renamed, or retyped.</div>
      <div id="pRows"></div>
      ${closeFn ? '<div class="modalBtns"><button id="pClose">Close</button></div>' : ''}`;
    const wrap = container.querySelector('#pRows');
    rows.forEach(r=>{
      if(r.deleted) return;
      const proto = r.protocolId ? state.protocols.find(p=>p.id===r.protocolId) : null;
      const tag = r.protocolId
        ? `<span class="protoTag" title="Protocol-tagged port">🔌 ${escapeHtml(proto ? proto.name : 'deleted protocol')}${r.protocolRole?' ('+escapeHtml(r.protocolRole)+')':''}</span>`
        : '';
      const clockTag = r.clockPortId && adapter.clockPortOptions
        ? (()=>{ const cp=(adapter.clockPortOptions()||[]).find(x=>x.id===r.clockPortId); return cp ? `<span class="protoTag" title="Bound to this component's own clock port">⏱️ ${escapeHtml(cp.name)}</span>` : ''; })()
        : '';
      const row = document.createElement('div'); row.className='portRow';
      row.innerHTML = `<div style="flex:2;">${escapeHtml(r.name)}</div><div style="flex:0 0 50px;color:var(--dim);">${escapeHtml(r.side)}</div>${tag}${clockTag}`;
      wrap.appendChild(row);
    });
    if(closeFn) container.querySelector('#pClose').onclick = closeFn;
    return;
  }
  let pickerOpen = false;
  function draw(){
    container.innerHTML = `
      <div id="pRows"></div>
      <div style="display:flex;gap:6px;margin-top:6px;">
        <button id="pAddRow">+ Add ${escapeHtml(adapter.itemLabelCap)}</button>
      </div>
      ${closeFn ? '<div class="modalBtns"><button id="pSave" style="border-color:var(--accent);color:var(--accent);">Save</button><button id="pClose">Close</button></div>' : ''}`;
    const wrap = container.querySelector('#pRows');
    rows.forEach((r,i)=>{
      if(r.deleted) return;
      const proto = r.protocolId ? state.protocols.find(p=>p.id===r.protocolId) : null;
      const protoSelect = adapter.supportsProtocols
        ? `<select data-i="${i}" class="pProto" title="Protocol this port speaks, if any" style="flex:1;">
             <option value="">(none)</option>
             ${state.protocols.map(p=>`<option value="${p.id}" ${r.protocolId===p.id?'selected':''}>${escapeHtml(p.name)}</option>`).join('')}
           </select>`
        : '';
      const roles = (proto && proto.roles) || [];
      const roleSelect = adapter.supportsProtocols
        ? `<select data-i="${i}" class="pRole" title="Role within that protocol, if it has any" style="flex:1;" ${!proto || !roles.length ? 'disabled' : ''}>
             ${!proto ? '<option value="">—</option>'
               : !roles.length ? '<option value="">(no roles)</option>'
               : '<option value="">(none)</option>' + roles.map(role=>`<option value="${escapeHtml(role)}" ${r.protocolRole===role?'selected':''}>${escapeHtml(role)}</option>`).join('')}
           </select>`
        : '';
      const clockOpts = adapter.supportsClockAssociation ? adapter.clockPortOptions() : [];
      const clockSelect = adapter.supportsClockAssociation
        ? `<select data-i="${i}" class="pClock" title="Which of this component's own clock ports this signal is synchronous to — the clock domain it's actually wired to is set in ⏱️ Clocks & Resets" style="flex:1;">
             <option value="">(no clock)</option>
             ${clockOpts.map(cp=>`<option value="${cp.id}" ${r.clockPortId===cp.id?'selected':''}>${escapeHtml(cp.name)}</option>`).join('')}
           </select>`
        : '';
      const groupInput = adapter.supportsGroupId
        ? `<input value="${escapeHtml(r.groupId)}" data-i="${i}" class="pGroup" placeholder="group ID (opt.)" style="flex:1;">`
        : '';
      const row = document.createElement('div'); row.className='portRow';
      row.innerHTML = `<input value="${escapeHtml(r.name)}" data-i="${i}" class="pName" placeholder="name" style="flex:2;">
        <select data-i="${i}" class="pSide" style="flex:0 0 60px;">
          <option value="left" ${r.side==='left'?'selected':''}>left</option>
          <option value="right" ${r.side==='right'?'selected':''}>right</option>
        </select>
        ${groupInput}
        ${protoSelect}
        ${roleSelect}
        ${clockSelect}
        <button data-i="${i}" class="pDel" title="Delete">×</button>`;
      wrap.appendChild(row);
    });
    wrap.querySelectorAll('.pName').forEach(el=> el.oninput=(e)=>{ rows[+e.target.dataset.i].name = e.target.value; });
    wrap.querySelectorAll('.pSide').forEach(el=> el.onchange=(e)=>{ rows[+e.target.dataset.i].side = e.target.value; });
    if(adapter.supportsGroupId) wrap.querySelectorAll('.pGroup').forEach(el=> el.oninput=(e)=>{ rows[+e.target.dataset.i].groupId = e.target.value; });
    wrap.querySelectorAll('.pProto').forEach(el=> el.onchange=(e)=>{
      const row = rows[+e.target.dataset.i];
      row.protocolId = e.target.value || null;
      row.protocolRole = ''; // changing protocol invalidates whichever role was picked for the old one
      draw(); // role options depend on the newly-selected protocol, so the role <select> needs rebuilding
    });
    wrap.querySelectorAll('.pRole').forEach(el=> el.onchange=(e)=>{ rows[+e.target.dataset.i].protocolRole = e.target.value; });
    wrap.querySelectorAll('.pClock').forEach(el=> el.onchange=(e)=>{ rows[+e.target.dataset.i].clockPortId = e.target.value || null; });
    wrap.querySelectorAll('.pDel').forEach(el=> el.onclick=(e)=>{
      const i = +e.target.dataset.i;
      if(rows[i].isNew) rows.splice(i,1); else rows[i].deleted = true;
      draw();
    });
    container.querySelector('#pAddRow').onclick = ()=>{
      rows.push({ raw:null, name: adapter.itemLabelCap.toUpperCase()+(rows.filter(r=>!r.deleted).length+1), side:'left', groupId:'', protocolId:null, protocolRole:'', clockPortId:null, isNew:true, deleted:false });
      draw();
    };
    if(closeFn){
      container.querySelector('#pSave').onclick = ()=>{ commitPortRows(adapter, rows); render(); closeFn(); };
      container.querySelector('#pClose').onclick = closeFn;
    }
  }
  draw();
}
