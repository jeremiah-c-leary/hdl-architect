}

let armedPort = null;

// ---------- Clock View (graphical, in-place editing of clock assignments) ----------
// Shares the functional diagram's sheet data completely — same components, same columnIndex/y, so
// dragging here moves the component in the functional view too, and vice versa. What differs is
// what's drawn: only CLOCK ports (resets aren't shown here — this view is for clocks specifically;
// resets are still edited via Edit Properties → Clocking). Input is always on the left, output
// always on the right — no per-port `side`, direction alone decides it — and gutters carry colored
// domain bars instead of wires. A domain's bar spans whichever gutters lie between its
// furthest-apart involved columns, in EITHER direction — a generator sitting to the right of
// something it feeds just means the bar reaches backward, which is a visible signal worth
// noticing, not an error to route around.
function clockDomainColor(sheet, kind, domainId){
  const idx = kind==='clock' ? sheet.clocks.findIndex(c=>c.id===domainId)
    : sheet.clocks.length + sheet.resets.findIndex(r=>r.id===domainId);
  if(idx<0) return '#5a6578';
  return CLOCK_CHAIN_PALETTE[idx % CLOCK_CHAIN_PALETTE.length];
}
// Direction of a pass-through clock/reset, as seen from THIS sheet: comes from the PARENT
// component's own port that created it. A parent INPUT port is something this sheet receives
// (enters on the left); a parent OUTPUT port is something this sheet drives out (exits on the
// right).
function boundaryClockDirection(sheet, domain){
  if(!domain.linkedParentPortId || !sheet.parentSheetId || !sheet.parentComponentId) return null;
  const psheet = state.sheets[sheet.parentSheetId];
  const pcomp = psheet && psheet.components.find(c=>c.id===sheet.parentComponentId);
  if(!pcomp) return null;
  const pport = (pcomp.clockPorts||[]).find(p=>p.id===domain.linkedParentPortId) || (pcomp.resetPorts||[]).find(p=>p.id===domain.linkedParentPortId);
  return pport ? pport.direction : null;
}
function trySetClockAssignment(sheet, comp, port, domainId){
  if(domainId){
    const existingCols = [];
    sheet.components.forEach(c=> (c.clockPorts||[]).forEach(p=>{
      if(p!==port && p.assignedClockId===domainId) existingCols.push(c.columnIndex);
    }));
    if(existingCols.length && existingCols.every(c=>c===comp.columnIndex)){
      alert('Everything else on this clock is in the same column as this component, so there\'s no gutter to route it through. Move one of them to a different column first — this may mean a level of hierarchy is missing.');
      return false;
    }
  }
  port.assignedClockId = domainId;
  syncClockingBoundary(comp);
  syncLinkedComponent(comp);
  return true;
}

function renderCanvas(sheet, svgId, liveDrag){
  ensureSheetClocking(sheet);
  sheet.components.forEach(normalizeComponent);
  sheet.components.forEach(enforceMinHeight);
  if(!liveDrag){
    // Only enforce "no overlap" and "everything wired stays horizontal" at rest — never mid-drag,
    // or the component you're trying to move past another would get shoved away as you approach it.
    settleSheet(sheet);
  }
  const layout = computeLayout(sheet);
  const svg = document.getElementById(svgId);
  svg.innerHTML='';

  let maxY = 300;
  sheet.components.forEach(c=> maxY = Math.max(maxY, c.y + c.height + (c.childSheetId || c.isHW ? 90 : 60)));
  if(sheet.parentSheetId) sheet.boundaryPorts.forEach(p=> maxY = Math.max(maxY, p.y + 60));
  const bodyH = maxY + TOP_MARGIN;
  const totalH = bodyH + BANNER_H;
  svg.setAttribute('width', layout.totalW);
  svg.setAttribute('height', totalH);
  svg.setAttribute('viewBox', `0 0 ${layout.totalW} ${totalH}`);

  // Banner: full-width bar naming the sheet's complete hierarchy path, always at the very top,
  // outside the translated body group below (so it never scrolls with column content). Each
  // segment is independently clickable — same navigation the old toolbar breadcrumb offered,
  // just living where your eyes already are instead of requiring a trip to the toolbar. Segment
  // widths are estimated (fontSize*0.58/char, same convention wrapAllocLabel uses) rather than
  // measured, so this doesn't need a measure-then-position two-pass render.
  svgEl('rect',{x:0,y:0,width:layout.totalW,height:BANNER_H,class:'sheet-banner'},svg);
  const bannerChain = []; { let s = sheet; while(s){ bannerChain.unshift(s); s = s.parentSheetId ? state.sheets[s.parentSheetId] : null; } }
  const bannerFontSize = 13;
  const bannerSegGap = 4; // fixed gap used symmetrically on both sides of a separator — bold text
                           // renders wider than the per-char estimate accounts for, so without
                           // this the gap on either side could get visually absorbed
  let bannerX = 10;
  bannerChain.forEach((s,i)=>{
    const seg = svgEl('text',{x:bannerX,y:BANNER_H/2+4,class:'sheet-banner-text sheet-banner-seg'},svg);
    seg.textContent = s.name;
    seg.onclick = ()=>{ state.activeSheetId = s.id; render(); };
    bannerX += s.name.length * bannerFontSize * 0.58 + bannerSegGap;
    if(i<bannerChain.length-1){
      const sep = svgEl('text',{x:bannerX,y:BANNER_H/2+4,class:'sheet-banner-text sheet-banner-sep'},svg);
      sep.textContent = '::';
      bannerX += 2 * bannerFontSize * 0.58 + bannerSegGap;
    }
  });

  // Everything else (bands, captions, components, ports, connections) is drawn in sheet-local
  // coordinates as before, just shifted down by the banner's height.
  const body = svgEl('g',{transform:`translate(0,${BANNER_H})`},svg);

  const pal = sheetPalette(sheet);
  const boundaryLeftRect = svgEl('rect',{x:layout.boundaryLeft.x0,y:0,width:layout.boundaryLeft.x1-layout.boundaryLeft.x0,height:bodyH,class:boundaryBandClass(sheet), style: pal?('fill:'+pal.boundary+';'):''},body);
  const boundaryRightRect = svgEl('rect',{x:layout.boundaryRight.x0,y:0,width:layout.boundaryRight.x1-layout.boundaryRight.x0,height:bodyH,class:boundaryBandClass(sheet), style: pal?('fill:'+pal.boundary+';'):''},body);
  [boundaryLeftRect, boundaryRightRect].forEach(r=>{
    r.oncontextmenu = (e)=>{
      e.preventDefault(); e.stopPropagation();
      const bLabel = boundaryItemName(sheet);
      const bLabelCap = bLabel.charAt(0).toUpperCase()+bLabel.slice(1);
      // The boundary margin represents this sheet's own container's interface — so editing it is
      // really editing that container's own Ports tab, which already has all this logic (protocol
      // tags, clock binding, locked-vs-editable, etc.) — no need for a second, separate editor that
      // only handles a subset of it. Only the root System sheet has no owning component to open a
      // Properties window for, so it alone keeps the old standalone editor as a fallback.
      const parentSheet = sheet.parentSheetId ? state.sheets[sheet.parentSheetId] : null;
      const ownerComp = parentSheet ? parentSheet.components.find(c=>c.id===sheet.parentComponentId) : null;
      const items = [
        { label: 'Edit ' + bLabelCap + 's…', action: ()=> ownerComp
            ? editPropertiesModal(ownerComp, parentSheet, 'ports')
            : editPortsModal(boundaryPortsAdapter(sheet)) }
      ];
      if(ownerComp) items.push({ label: 'Edit Properties…', action: ()=> editPropertiesModal(ownerComp, parentSheet) });
      // The System sheet has no owning component, but Features are exactly how you'd tie
      // together two things that only share System as a common ancestor (two CCAs, say) — see
      // systemPseudoComponent for how this reuses the normal Feature editor unmodified.
      if(sheet.kind==='system'){
        const sysComp = systemPseudoComponent(sheet);
        items.push({ label: 'Edit Features…', action: ()=> editFeaturesModal(sysComp, sheet.boundaryPorts.map(p=>({key:p.id, label:p.name+' ('+p.side+')'})), false) });
      }
      showContextMenu(e.clientX, e.clientY, items);
    };
  });
  layout.gutterX.forEach((g,gi)=>{
    const gutterRect = svgEl('rect',{x:g.x0,y:0,width:g.x1-g.x0,height:bodyH,class:'gutter-band', style: pal?('fill:'+pal.gutter+';'):''},body);
    gutterRect.oncontextmenu = (e)=>{
      e.preventDefault(); e.stopPropagation();
      showContextMenu(e.clientX, e.clientY, [
        { label: 'Add Column', action: ()=> insertColumnAt(sheet, gi) }
      ]);
    };
  });
  const colAllowed = allowedTypesCaption(sheet);
  layout.colX.forEach((c,i)=>{
    const colRect = svgEl('rect',{x:c.x0,y:0,width:c.x1-c.x0,height:bodyH,class:'col-band', style: pal?('fill:'+pal.col+';'):''},body);
    svgEl('text',{x:c.x0+4,y:14,class:'col-caption', style: pal?('fill:'+pal.caption+';'):''},body).textContent = 'COL '+i;
    renderWrappedCaption(body, c.x0+4, 23, 9, 26, colAllowed, 'col-caption-sub', pal?('fill:'+pal.caption+';'):'');
    colRect.oncontextmenu = (e)=>{
      e.preventDefault(); e.stopPropagation();
      const svgBounds = document.getElementById(svgId).getBoundingClientRect();
      const dropY = Math.max(TOP_MARGIN, (e.clientY - svgBounds.top) - BANNER_H);
      const options = allowedBaseClassNodes(sheet).map(node=>({
        label: node.name,
        action: ()=>{ insertLibraryComponent(sheet, node, i, dropY - node.height/2); render(); }
      }));
      const menuItems = [{ label: 'Add Component', submenu: options }];
      if(clipboard){
        menuItems.push({ label: clipboard.mode==='cut' ? 'Paste (Move Here)' : 'Paste (Duplicate)',
          action: ()=> pasteClipboard(sheet, i, dropY) });
      }
      menuItems.push({ label: 'Remove Column', danger:true, action: ()=> removeColumnAt(sheet, i) });
      showContextMenu(e.clientX, e.clientY, menuItems);
    };
  });
  renderWrappedCaption(body, layout.boundaryLeft.x0+3, 14, 9, 5, boundaryLabel(sheet), 'col-caption', pal?('fill:'+pal.caption+';'):'');
  renderWrappedCaption(body, layout.boundaryRight.x0+3, 14, 9, 5, boundaryLabel(sheet), 'col-caption', pal?('fill:'+pal.caption+';'):'');

  sheet.connections.forEach(conn=>{
    const a = portAbs(sheet, layout, conn.from), b = portAbs(sheet, layout, conn.to);
    if(!a||!b) return;
    const line = svgEl('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,class:'conn-line'},body);
    line.oncontextmenu = (e)=>{
      e.preventDefault(); e.stopPropagation();
      const items = [];
      const fromComp = conn.from.kind==='component' ? sheet.components.find(c=>c.id===conn.from.componentId) : null;
      const toComp = conn.to.kind==='component' ? sheet.components.find(c=>c.id===conn.to.componentId) : null;
      const eitherLocked = (fromComp && fromComp.portsLocked) || (toComp && toComp.portsLocked);
      if(conn.from.kind==='component' && conn.to.kind==='component' && !eitherLocked){
        // Which end is physically on the left/right of this wire, regardless of each port's own
        // .side — that's what "Master on left" etc. actually refers to.
        const leftRef = a.x <= b.x ? conn.from : conn.to;
        const rightRef = a.x <= b.x ? conn.to : conn.from;
        const protoItems = state.protocols.map(proto=>{
          if(proto.roles && proto.roles.length===2){
            const [r0, r1] = proto.roles;
            return { label: proto.name, submenu: [
              { label: `${r0} → ${r1}`, action: ()=> assignProtocolToConnection(sheet, leftRef, rightRef, proto.id, r0, r1) },
              { label: `${r1} ← ${r0}`, action: ()=> assignProtocolToConnection(sheet, leftRef, rightRef, proto.id, r1, r0) }
            ] };
          }
          return { label: proto.name, action: ()=> assignProtocolToConnection(sheet, leftRef, rightRef, proto.id, '', '') };
        });
        if(protoItems.length===0) protoItems.push({ label:'(none defined — use 🔌 Protocols)', action:()=>{} });
        items.push({ label:'Assign Protocol', submenu: protoItems });
        const fromPort = resolvePortRef(sheet, conn.from), toPort = resolvePortRef(sheet, conn.to);
        if((fromPort && fromPort.protocolId) || (toPort && toPort.protocolId)){
          items.push({ label:'Clear Protocol', action: ()=>{
            if(fromPort){ fromPort.protocolId=null; fromPort.protocolRole=''; }
            if(toPort){ toPort.protocolId=null; toPort.protocolRole=''; }
            if(fromComp) syncLinkedComponent(fromComp);
            if(toComp) syncLinkedComponent(toComp);
            render();
          } });
        }
        items.push({ separator:true });
      }
      items.push({ label:'Delete Connection', danger:true, action: ()=>{
        if(confirm('Delete this connection?')){ sheet.connections = sheet.connections.filter(c=>c!==conn); render(); }
      } });
      showContextMenu(e.clientX, e.clientY, items);
    };
  });

  // EXT boundary ports (hierarchical link to the parent sheet) — not used on the root sheet,
  // which uses HW columns full of HW components instead.
  sheet.boundaryPorts.forEach(p=>{
    const x = p.side==='left' ? layout.boundaryLeft.x0+6 : layout.boundaryRight.x0+6;
    const w = BOUND_W-12;
    let linked = true;
    if(p.linkedParentPortId){
      linked = false;
      if(sheet.parentSheetId && sheet.parentComponentId){
        const psheet = state.sheets[sheet.parentSheetId];
        const pcomp = psheet && psheet.components.find(c=>c.id===sheet.parentComponentId);
        if(pcomp && pcomp.ports.some(pp=>pp.id===p.linkedParentPortId)) linked = true;
      }
    } else if(p.groupId){
      linked = false;
      if(sheet.parentSheetId && sheet.parentComponentId){
        const psheet = state.sheets[sheet.parentSheetId];
        const pcomp = psheet && psheet.components.find(c=>c.id===sheet.parentComponentId);
        if(pcomp && pcomp.ports.some(pp=>pp.groupId===p.groupId)) linked = true;
      }
    }
    const armed = armedPort && armedSheetId===sheet.id && armedPort.kind==='boundary' && armedPort.portId===p.id;
    const rect = svgEl('rect',{x, y:p.y-6, width:w, height:12,
      class:'bport-rect'+(linked?'':' unlinked')+(armed?' armed':'')},body);
    svgEl('text',{x: p.side==='left'? x+w+4 : x-4, y:p.y+3,
      class:'port-label', 'text-anchor': p.side==='left'?'start':'end'},body).textContent =
      p.name + (p.groupId? ' ['+p.groupId+']':'');
    rect.style.cursor='pointer';
    attachPortDrag(rect, sheet, svgId, layout, {kind:'boundary', portId:p.id});
    rect.oncontextmenu=(e)=>{ e.preventDefault();
      showContextMenu(e.clientX, e.clientY, [
        { label: 'Move to Other Side', action: ()=>{
            boundaryPortsAdapter(sheet).setSide(p, p.side==='left' ? 'right' : 'left');
            render();
          } },
        { label: 'Delete', action: ()=>{
            if(!confirm('Delete boundary port "'+p.name+'"?')) return;
            sheet.boundaryPorts = sheet.boundaryPorts.filter(x=>x!==p);
            sheet.connections = sheet.connections.filter(c=> !connTouches(c,'boundary',null,p.id));
            if(p.linkedParentPortId && sheet.parentSheetId && sheet.parentComponentId){
              const psheet = state.sheets[sheet.parentSheetId];
              const pcomp = psheet && psheet.components.find(c=>c.id===sheet.parentComponentId);
              if(pcomp){
                pcomp.ports = pcomp.ports.filter(pp=>pp.id!==p.linkedParentPortId);
                psheet.connections = psheet.connections.filter(c=> !connTouches(c,'component',pcomp.id,p.linkedParentPortId));
                syncLinkedComponent(pcomp);
              }
            }
            render();
          } }
      ]);
    };
    rect.ondblclick=(e)=>{ e.stopPropagation();
      const nm = prompt('Port name:', p.name); if(nm===null) return;
      const gid = prompt('Hierarchy group ID (blank = none). Ports sharing an ID roll up to the same parent port:', p.groupId||'');
      if(gid===null) return;
      p.name = nm; p.groupId = gid.trim();
      if(p.linkedParentPortId && sheet.parentSheetId && sheet.parentComponentId){
        const psheet = state.sheets[sheet.parentSheetId];
        const pcomp = psheet && psheet.components.find(c=>c.id===sheet.parentComponentId);
        const pport = pcomp && pcomp.ports.find(pp=>pp.id===p.linkedParentPortId);
        if(pport){ pport.name = nm; syncLinkedComponent(pcomp); }
      }
      render();
    };
  });

  sheet.components.forEach(comp=>{
    const col = compSlotRect(sheet, layout, comp);
    if(!col) return;
    const g = svgEl('g',{},body);
    const effectiveBg = comp.bgColor || typeDefaultBgColor(comp);
    const rectStyle = (comp.childSheetId ? 'stroke-dasharray:4,3;' : '') + (effectiveBg ? `fill:${effectiveBg};` : '');
    const isSelected = selectedComponent && selectedComponent.sheetId===sheet.id && selectedComponent.componentId===comp.id;
    const rect = svgEl('rect',{x:col.x0,y:comp.y,width:col.x1-col.x0,height:comp.height,rx:3,
      class:'comp-rect'+(isSelected?' selected':''), style: rectStyle},g);
    svgEl('title',{},rect).textContent = comp.instanceName+' : '+(getCompDescription(comp) || '(no description)')+'\n\nClick to select, then Ctrl/Cmd+click another component to auto-wire them.';
    const nameStyle = 'font-weight:600;' + (comp.textColor ? `fill:${comp.textColor};` : '');
    svgEl('text',{x:col.x0+8,y:comp.y+16,class:'comp-label',style:nameStyle},g).textContent =
      comp.instanceName + (comp.childSheetId ? '  ⤷' : '');
    svgEl('text',{x:col.x0+8,y:comp.y+28,class:'comp-label',style:'font-size:9px;fill:var(--dim);'},g).textContent =
      ': ' + comp.entityName;

    const handle = svgEl('rect',{x:col.x0+COMP_W/2-14,y:comp.y+comp.height-4,width:28,height:6,class:'resize-handle'},g);
    attachResizeDrag(handle, comp, sheet, svgId);
    const topHandle = svgEl('rect',{x:col.x0+COMP_W/2-14,y:comp.y-2,width:28,height:6,class:'resize-handle'},g);
    attachTopResizeDrag(topHandle, comp, sheet, svgId);

    comp.ports.forEach(p=>{
      const cx = p.side==='left' ? col.x0 : col.x1;
      const px = cx - PORT_W/2, py = comp.y + p.offset - PORT_H/2;
      const armed = armedPort && armedSheetId===sheet.id && armedPort.kind==='component' && armedPort.componentId===comp.id && armedPort.portId===p.id;
      const prect = svgEl('rect',{x:px,y:py,width:PORT_W,height:PORT_H,class:'port-rect'+(armed?' armed':'')},g);
      // label placed INSIDE the component so wires (drawn outside, at the edge) never cross the text
      const labelX = p.side==='left' ? col.x0+6 : col.x1-6;
      const protoInfo = p.protocolId ? state.protocols.find(pr=>pr.id===p.protocolId) : null;
      const labelText = p.name + (p.groupId? ' ['+p.groupId+']':'');
      const portLabelEl = svgEl('text',{x:labelX, y:comp.y+p.offset+3, style:'fill:'+(comp.textColor || 'var(--text)')+';',
        class:'port-label','text-anchor': p.side==='left'?'start':'end'},g);
      portLabelEl.textContent = labelText;
      if(p.protocolId){
        svgEl('title',{},portLabelEl).textContent = 'Protocol: ' + (protoInfo ? protoInfo.name : '(deleted protocol)') + (p.protocolRole ? ' — '+p.protocolRole : '');
      }
      attachPortDrag(prect, sheet, svgId, layout, {kind:'component', componentId:comp.id, portId:p.id});
      prect.oncontextmenu=(e)=>{ e.preventDefault(); e.stopPropagation();
        if(comp.portsLocked){ alert('This port is locked — it comes from a library-defined interface (not a Base Class) and can\'t be changed.'); return; }
        showContextMenu(e.clientX, e.clientY, [
          { label: 'Move to Other Side', action: ()=>{
              componentPortsAdapter(comp, sheet).setSide(p, p.side==='left' ? 'right' : 'left');
              render();
            } },
          { label: 'Delete', action: ()=>{
              if(!confirm('Delete port "'+p.name+'"?')) return;
              comp.ports = comp.ports.filter(x=>x!==p);
              sheet.connections = sheet.connections.filter(c=> !connTouches(c,'component',comp.id,p.id));
              if(p.linkedBoundaryPortId && comp.childSheetId){
                const childSheet = state.sheets[comp.childSheetId];
                if(childSheet){
                  childSheet.boundaryPorts = childSheet.boundaryPorts.filter(b=>b.id!==p.linkedBoundaryPortId);
                  childSheet.connections = childSheet.connections.filter(c=> !connTouches(c,'boundary',null,p.linkedBoundaryPortId));
                }
              }
              syncLinkedComponent(comp);
              render();
            } }
        ]);
      };
      prect.ondblclick=(e)=>{ e.stopPropagation();
        if(comp.portsLocked){ alert('This port is locked — it comes from a library-defined interface (not a Base Class) and can\'t be changed.'); return; }
        const nm = prompt('Port name:', p.name); if(nm===null) return;
        const gid = prompt('Hierarchy group ID (blank = none):', p.groupId||'');
        if(gid===null) return;
        p.name = nm; p.groupId = gid.trim();
        if(p.linkedBoundaryPortId && comp.childSheetId){
          const childSheet = state.sheets[comp.childSheetId];
          const bp = childSheet && childSheet.boundaryPorts.find(b=>b.id===p.linkedBoundaryPortId);
          if(bp) bp.name = nm;
        }
        syncLinkedComponent(comp);
        render();
      };
    });

    rect.addEventListener('pointerdown', (e)=>{
      if(e.button !== 0) return; // right/middle click: leave it to oncontextmenu, don't touch drag/selection
      e.stopPropagation();
      const startX=e.clientX, startY=e.clientY, origY=comp.y;
      const layoutAtStart = layout;
      let didDrag = false;
      function move(ev){
        if(Math.abs(ev.clientX-startX)>3 || Math.abs(ev.clientY-startY)>3) didDrag = true;
        if(!didDrag) return;
        const dy = ev.clientY-startY;
        comp.y = Math.max(TOP_MARGIN, origY+dy);
        const mx = col.x0 + (ev.clientX-startX) + COMP_W/2;
        // Boundary "HW slots" no longer exist (HW is a normal interior-column component now) —
        // a component carrying a legacy hwSlot from an older diagram is demoted to an ordinary
        // interior column the first time it's dragged.
        comp.hwSlot = null;
        comp.columnIndex = nearestColumn(layoutAtStart, mx);
        renderCanvas(sheet, svgId, true);
      }
      function up(ev){
        document.removeEventListener('pointermove',move);
        document.removeEventListener('pointerup',up);
        // Only rebuild the canvas if the component actually moved. Rebuilding on a plain click
        // (even with zero movement) would swap out this rect's DOM node mid-click and silently
        // break the browser's native double-click detection.
        if(didDrag){
          comp.ports.forEach(p=>{
            const involved = sheet.connections.some(c=> connTouches(c,'component',comp.id,p.id));
            if(involved) realign(sheet, {kind:'component',componentId:comp.id,portId:p.id}, comp.y+p.offset);
          });
          render();
        } else {
          handleComponentClick(sheet, comp, rect, ev.ctrlKey || ev.metaKey);
        }
      }
      document.addEventListener('pointermove',move);
      document.addEventListener('pointerup',up);
    });
    rect.addEventListener('dblclick',(e)=>{ e.stopPropagation(); if(comp.isSubsystem) drillInto(comp); });
    rect.oncontextmenu=(e)=>{
      e.preventDefault();
      const menuItems = [
        { label: 'Edit Properties…', action: ()=> editPropertiesModal(comp, sheet) },
        { separator:true }
      ];
      if(comp.isSubsystem){
        const drillLabel = comp.isFPGA ? 'FPGA' : comp.isCCA ? 'CCA' : 'Subsystem';
        menuItems.push({ label: comp.childSheetId ? `Open ${drillLabel} Sheet` : `Create ${drillLabel} Sheet (drill in)`, action: ()=> drillInto(comp) });
        if(comp.childSheetId){
          menuItems.push({ label: `Show ${drillLabel} Alongside`, action: ()=> showSubsystemAlongside(comp) });
        }
      }
      menuItems.push({ label: 'Flip Ports (Left ↔ Right)', action: ()=> flipComponent(comp) });
      menuItems.push({ separator:true });
      menuItems.push({ label: 'Copy', action: ()=>{ clipboard = { mode:'copy', componentId:comp.id, sheetId:sheet.id }; } });
      menuItems.push({ label: 'Cut', action: ()=>{ clipboard = { mode:'cut', componentId:comp.id, sheetId:sheet.id }; } });
      menuItems.push({ label: 'Add to Library…', action: ()=> openAddToLibraryModal(comp) });
      menuItems.push({ separator:true });
      menuItems.push({ label: 'Delete Component', danger:true, action: ()=> deleteComponent(sheet, comp) });
      showContextMenu(e.clientX, e.clientY, menuItems);
    };
  });
}

// bottom-edge handle: moves the bottom edge only (height changes, top/y fixed)
function attachResizeDrag(handle, comp, sheet, svgId){
  handle.addEventListener('pointerdown',(e)=>{
    e.stopPropagation();
    const startY=e.clientY, origH=comp.height;
    function move(ev){
      let h = Math.max(30, origH + (ev.clientY-startY));
      const minRequired = comp.ports.reduce((m,p)=>Math.max(m, p.offset+PORT_MARGIN_BOTTOM), PORT_MARGIN_TOP+PORT_MARGIN_BOTTOM);
      comp.height = Math.max(h, minRequired);
      renderCanvas(sheet, svgId, true);
    }
    function up(){ document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up); render(); }
    document.addEventListener('pointermove',move);
    document.addEventListener('pointerup',up);
  });
}
// top-edge handle: moves the top edge only. Ports keep their absolute position (their offset
// is adjusted to compensate), so existing wiring doesn't shift when you pull the top edge up or down.
function attachTopResizeDrag(handle, comp, sheet, svgId){
  handle.addEventListener('pointerdown',(e)=>{
    e.stopPropagation();
    const startY=e.clientY, origY=comp.y, origH=comp.height;
    const origOffsets = comp.ports.map(p=>p.offset);
    const minAbsY = comp.ports.length
      ? Math.min(...comp.ports.map((p,i)=>origY+origOffsets[i])) - PORT_MARGIN_TOP
      : origY;
    function move(ev){
      const dy = ev.clientY-startY;
      let newY = origY + dy;
      if(newY > minAbsY) newY = minAbsY;
      let newH = (origY+origH) - newY;
      if(newH < PORT_MARGIN_TOP+PORT_MARGIN_BOTTOM){
        newH = PORT_MARGIN_TOP+PORT_MARGIN_BOTTOM;
        newY = (origY+origH) - newH;
      }
      comp.y = newY;
      comp.height = newH;
      comp.ports.forEach((p,i)=>{ p.offset = (origY+origOffsets[i]) - newY; });
      renderCanvas(sheet, svgId, true);
    }
    function up(){ document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up); render(); }
    document.addEventListener('pointermove',move);
    document.addEventListener('pointerup',up);
  });
}

function attachPortDrag(el, sheet, svgId, layout, ref){
  let didDrag=false;
  el.addEventListener('pointerdown',(e)=>{
    e.stopPropagation();
    didDrag=false;
    const startY=e.clientY;
    const abs = portAbs(sheet, layout, ref);
    const origY = abs.y;
    function move(ev){
      if(Math.abs(ev.clientY-startY)>3) didDrag=true;
      if(!didDrag) return;
      setPortAbsY(sheet, ref, origY + (ev.clientY-startY));
      renderCanvas(sheet, svgId, true);
    }
    function up(){
      document.removeEventListener('pointermove',move);
      document.removeEventListener('pointerup',up);
      if(didDrag){
        const a = portAbs(sheet, layout, ref);
        const adjY = resolveOverlap(sheet, ref, a.y);
        realign(sheet, ref, adjY);
        render();
      } else {
        setTimeout(()=> handlePortClick(sheet, ref), 0);
      }
    }
    document.addEventListener('pointermove',move);
    document.addEventListener('pointerup',up);
  });
}

function handlePortClick(sheet, ref){
  if(!armedPort){ armedPort = ref; armedSheetId = sheet.id; render(); return; }
  if(armedSheetId !== sheet.id){
    alert('Ports can only be connected within the same sheet.');
    armedPort = null; armedSheetId = null; render(); return;
  }
  if(refsEqual(armedPort, ref)){ armedPort=null; armedSheetId=null; render(); return; }
  const colA = columnOf(armedPort, sheet), colB = columnOf(ref, sheet);
  if(colA === colB){
    alert('These two ports are in the same column, so a horizontal connection isn\'t possible.\n\nThis may mean a level of hierarchy is missing between them.');
    armedPort = null; armedSheetId = null; render(); return;
  }
  const exists = sheet.connections.some(c=>
    (refsEqual(c.from,armedPort)&&refsEqual(c.to,ref)) || (refsEqual(c.to,armedPort)&&refsEqual(c.from,ref)));
  if(exists){ armedPort=null; armedSheetId=null; render(); return; }
  const layout = computeLayout(sheet);
  const a = portAbs(sheet, layout, armedPort);
  sheet.connections.push({ id: uid('conn'), from: armedPort, to: ref });
  realign(sheet, ref, a.y);
  armedPort = null; armedSheetId = null;
  render();
}

// Click a component (selects it) then Ctrl/Cmd+click a second component on the same sheet to
// create one new port on each — facing each other, based on which is in the leftmost column —
// plus a connection between them, all in one step. A plain select-click deliberately avoids
// render() (see the comment at its call site) — it just toggles the 'selected' class directly so
// the DOM node backing this rect isn't replaced mid-click, which would otherwise silently break
// the browser's native double-click detection for drilling into a subsystem.
//
// If a port is already armed (clicked, waiting for a second port to complete a normal wire — see
// handlePortClick), clicking a component's body instead is unambiguous: no modifier key needed,
// this always means "make a new port on this component and wire it to the armed one," inheriting
// the source port's protocol (and the *other* role, if the protocol defines more than one) so a
// vendor IP block with predefined AXI4 ports can be wired out to a fresh block in one click.
function handleComponentClick(sheet, comp, rectEl, isQuickConnectModifier){
  if(armedPort){
    if(armedSheetId !== sheet.id){
      alert('Ports can only be connected within the same sheet.');
      armedPort=null; armedSheetId=null; render(); return;
    }
    if(armedPort.kind==='component' && armedPort.componentId===comp.id){
      armedPort=null; armedSheetId=null; render(); return; // clicked the armed port's own component — just cancel
    }
    quickConnectPortToComponent(sheet, armedPort, comp);
    armedPort=null; armedSheetId=null; selectedComponent=null;
    render();
    return;
  }
  if(isQuickConnectModifier && selectedComponent && selectedComponent.sheetId===sheet.id && selectedComponent.componentId!==comp.id){
    const compA = sheet.components.find(c=>c.id===selectedComponent.componentId);
    selectedComponent = null;
    if(compA) quickConnect(sheet, compA, comp);
    render();
    return;
  }
  const svg = rectEl.ownerSVGElement;
  if(svg) svg.querySelectorAll('.comp-rect.selected').forEach(el=> el.classList.remove('selected'));
  if(selectedComponent && selectedComponent.sheetId===sheet.id && selectedComponent.componentId===comp.id){
    selectedComponent = null; // clicking the already-selected component again deselects it
  } else {
    selectedComponent = { sheetId: sheet.id, componentId: comp.id };
    rectEl.classList.add('selected');
  }
}
function quickConnect(sheet, compA, compB){
  if(compA.portsLocked || compB.portsLocked){
    const locked = compA.portsLocked ? compA : compB;
    alert('"'+locked.instanceName+'" has a fixed, library-defined interface and can\'t get a new port this way.\n\nClick one of its existing ports instead, then click the target component — that inherits its protocol/role without modifying it.');
    return;
  }
  if(compA.columnIndex===compB.columnIndex && !compA.hwSlot && !compB.hwSlot){
    alert('These two components are in the same column, so a horizontal connection isn\'t possible.\n\nThis may mean a level of hierarchy is missing between them.');
    return;
  }
  const aOnLeft = compA.columnIndex < compB.columnIndex;
  const sideA = aOnLeft ? 'right' : 'left';
  const sideB = aOnLeft ? 'left' : 'right';
  componentPortsAdapter(compA, sheet).addPort(compB.instanceName, sideA, '');
  componentPortsAdapter(compB, sheet).addPort(compA.instanceName, sideB, '');
  const portA = compA.ports[compA.ports.length-1];
  const portB = compB.ports[compB.ports.length-1];
  const refA = { kind:'component', componentId:compA.id, portId:portA.id };
  const refB = { kind:'component', componentId:compB.id, portId:portB.id };
  const layout = computeLayout(sheet);
  const a = portAbs(sheet, layout, refA);
  sheet.connections.push({ id: uid('conn'), from: refA, to: refB });
  if(a) realign(sheet, refB, a.y);
}
// Resolves a connection endpoint ref to its actual port object (component ports only — boundary
// ports don't carry protocol tags).
function resolvePortRef(sheet, ref){
  if(ref.kind!=='component') return null;
  const comp = sheet.components.find(c=>c.id===ref.componentId);
  return comp ? comp.ports.find(p=>p.id===ref.portId) || null : null;
}
// Right-click a connection → Assign Protocol: tags both existing endpoints with a protocol (and,
// for a two-role protocol, opposite roles per the chosen left/right orientation) without touching
// their names — this is a retrofit onto ports that already exist and are already wired, unlike
// the port-to-component quick-connect which creates a brand-new port. Both endpoints' owning
// components must be unlocked — a locked component's ports already have their type/role fixed by
// the library, so this menu simply won't be offered for a connection touching one (see the
// oncontextmenu handler that builds this menu).
function assignProtocolToConnection(sheet, leftRef, rightRef, protocolId, leftRole, rightRole){
  const leftPort = resolvePortRef(sheet, leftRef);
  const rightPort = resolvePortRef(sheet, rightRef);
  const leftComp = leftRef.kind==='component' ? sheet.components.find(c=>c.id===leftRef.componentId) : null;
  const rightComp = rightRef.kind==='component' ? sheet.components.find(c=>c.id===rightRef.componentId) : null;
  if(leftPort){ leftPort.protocolId = protocolId; leftPort.protocolRole = leftRole || ''; }
  if(rightPort){ rightPort.protocolId = protocolId; rightPort.protocolRole = rightRole || ''; }
  if(leftComp) syncLinkedComponent(leftComp);
  if(rightComp) syncLinkedComponent(rightComp);
  render();
}
// Wires an already-armed port to a brand-new port on `targetComp`. If the source port is
// protocol-tagged, the new port inherits that protocol; if the protocol defines more than one
// role, the new port gets whichever role isn't the source's (Master↔Slave and so on) rather than
// duplicating it. A plain (non-protocol) source port just carries its own name over. Only the
// target needs to accept a new port — the source port is used as-is, never modified, so this
// works fine even when the source component is portsLocked (that's the whole point: wiring out
// from something with a fixed, predefined interface).
function quickConnectPortToComponent(sheet, sourceRef, targetComp){
  let sourcePort, targetSide;
  if(sourceRef.kind==='component'){
    const sourceComp = sheet.components.find(c=>c.id===sourceRef.componentId);
    sourcePort = sourceComp && sourceComp.ports.find(p=>p.id===sourceRef.portId);
    if(!sourceComp || !sourcePort) return;
    if(targetComp.portsLocked){
      alert('"'+targetComp.instanceName+'" has a fixed, library-defined interface and can\'t get a new port this way.');
      return;
    }
    if(sourceComp.columnIndex===targetComp.columnIndex && !sourceComp.hwSlot && !targetComp.hwSlot){
      alert('These two components are in the same column, so a horizontal connection isn\'t possible.\n\nThis may mean a level of hierarchy is missing between them.');
      return;
    }
    targetSide = sourceComp.columnIndex < targetComp.columnIndex ? 'left' : 'right';
  } else if(sourceRef.kind==='boundary'){
    // A boundary port always sits at the sheet's outer edge, entirely outside the column grid —
    // so there's no "same column" conflict to check, and the new port simply faces the same
    // direction the boundary port itself is on (both ends of the line face each other).
    sourcePort = sheet.boundaryPorts.find(p=>p.id===sourceRef.portId);
    if(!sourcePort) return;
    if(targetComp.portsLocked){
      alert('"'+targetComp.instanceName+'" has a fixed, library-defined interface and can\'t get a new port this way.');
      return;
    }
    targetSide = sourcePort.side;
  } else {
    return;
  }

  let newName, protocolId = null, role = '';
  if(sourcePort.protocolId){
    const proto = state.protocols.find(p=>p.id===sourcePort.protocolId);
    protocolId = sourcePort.protocolId;
    if(proto && proto.roles && proto.roles.length>1 && sourcePort.protocolRole){
      role = proto.roles.find(r=>r!==sourcePort.protocolRole) || sourcePort.protocolRole;
    } else {
      role = sourcePort.protocolRole || '';
    }
    newName = (proto ? proto.name : 'Protocol') + (role ? '_'+role : '');
  } else {
    newName = sourcePort.name;
  }

  componentPortsAdapter(targetComp, sheet).addPort(newName, targetSide, '', {protocolId, protocolRole:role});
  const newPort = targetComp.ports[targetComp.ports.length-1];
  const refNew = { kind:'component', componentId:targetComp.id, portId:newPort.id };
  const layout = computeLayout(sheet);
  const a = portAbs(sheet, layout, sourceRef);
  sheet.connections.push({ id: uid('conn'), from: sourceRef, to: refNew });
  if(a) realign(sheet, refNew, a.y);
}

// ---------- column insert/remove (right-click driven — see col-band/gutter-band handlers) ----------
// Inserts a new empty column at `atIndex` (0..numColumns), shifting every component at or past
// that index one column to the right.
function insertColumnAt(sheet, atIndex){
  sheet.components.forEach(c=>{ if(!c.hwSlot && c.columnIndex>=atIndex) c.columnIndex += 1; });
  sheet.numColumns += 1;
  render();
}
// Removes the column at `colIndex`. Components that were in it are moved into the neighboring
// column (the previous one, or the next one if removing column 0) rather than deleted; anything
// past the removed column shifts left to close the gap.
function removeColumnAt(sheet, colIndex){
  if(sheet.numColumns<=1) return;
  const occupied = sheet.components.some(c=>!c.hwSlot && c.columnIndex===colIndex);
  if(occupied){
    if(!confirm('Components exist in this column. Remove it anyway? (They will be moved into the neighboring column.)')) return;
  }
  const fallback = colIndex>0 ? colIndex-1 : 0;
  sheet.components.forEach(c=>{
    if(c.hwSlot) return;
    if(c.columnIndex===colIndex) c.columnIndex = fallback;
    else if(c.columnIndex>colIndex) c.columnIndex -= 1;
  });
  sheet.numColumns -= 1;
  render();
}

document.getElementById('importFile').addEventListener('change',(e)=>{
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!data.sheets || !data.rootSheetId) throw new Error('bad file');
      // Only the diagram (sheets) is replaced — the current component library is left as-is,
      // whether it's the default one or one loaded separately via Import Library. Protocols are
      // merged rather than replaced: anything the imported diagram references gets added if
      // missing, but existing protocols (and any edits made to them) are left alone. Clocks/resets
      // ride along inside each sheet, so they're replaced wholesale along with it.
      state.sheets = data.sheets;
      Object.values(state.sheets).forEach(ensureSheetClocking); // older exports won't have them yet
      state.rootSheetId = data.rootSheetId;
      state.activeSheetId = data.rootSheetId;
      // Migrate the old, abbreviated AXI4 direction convention to full role names, matching the
      // new role-pair dropdown — before dedup runs, so an old-format "M→S" and the new-format
      // "Master → Slave" compare as the same entry rather than as spurious near-duplicates. Only
      // this one, specifically-known abbreviation is touched; an arbitrary custom protocol's own
      // existing direction text is left exactly as it is — there's no general way to know what an
      // unfamiliar abbreviation was short for.
      if(Array.isArray(data.protocols)){
        const knownAbbrev = { 'M→S':'Master → Slave', 'S→M':'Slave → Master' };
        data.protocols.forEach(p=> (p.signals||[]).forEach(s=>{
          if(knownAbbrev[s.direction]) s.direction = knownAbbrev[s.direction];
        }));
      }
      // Dedupe by CONTENT, not id — a freshly-initialized default set gets new random ids every
      // session (see defaultProtocols/defaultIpTags), so the same conceptual "AXI4-Lite" or
      // "Reused" never matched by id alone across different loads, and just kept accumulating as a
      // new, redundant entry every time. Any incoming entry whose content already matches an
      // existing one gets its id remapped across this file's own just-loaded ports/components
      // instead of being appended — which also retroactively cleans up a file that already has
      // this duplication baked in, not just prevents new duplication going forward.
      if(Array.isArray(data.protocols)){
        // Each signal carries its own randomly-generated id too (see newProtocolSignal), so two
        // otherwise-identical protocols never matched here either — comparing by name+direction
        // per signal, the only semantically meaningful part, the same reasoning as excluding the
        // protocol's own id above.
        const signalKey = s=> (s.name||'')+'|'+(s.direction||'');
        const sameProtocol = (a,b)=> a.name===b.name
          && JSON.stringify(a.roles||[])===JSON.stringify(b.roles||[])
          && JSON.stringify((a.signals||[]).map(signalKey))===JSON.stringify((b.signals||[]).map(signalKey));
        const idRemap = new Map();
        data.protocols.forEach(p=>{
          const existing = state.protocols.find(sp=>sameProtocol(sp,p));
          if(existing){ if(existing.id!==p.id) idRemap.set(p.id, existing.id); }
          else state.protocols.push(p);
        });
        if(idRemap.size){
          Object.values(state.sheets).forEach(sh=>{
            sh.components.forEach(c=> (c.ports||[]).forEach(p=>{
              if(p.protocolId && idRemap.has(p.protocolId)) p.protocolId = idRemap.get(p.protocolId);
            }));
          });
          // The incoming grouping tree's own leaf references need the same remap, or they'd point
          // at an id that dedup just discarded rather than the surviving, deduped entry.
          if(Array.isArray(data.protocolGroups)){
            (function remapTree(nodes){
              nodes.forEach(n=>{
                if(n.type==='folder') remapTree(n.children);
                else if(n.type==='protocol' && idRemap.has(n.protocolId)) n.protocolId = idRemap.get(n.protocolId);
              });
            })(data.protocolGroups);
          }
        }
      }
      if(Array.isArray(data.protocolGroups)){
        if(state.protocolGroups.length===0) state.protocolGroups = data.protocolGroups;
        else state.protocolGroups.push(...data.protocolGroups);
      }
      if(Array.isArray(data.ipTags)){
        const idRemap = new Map();
        data.ipTags.forEach(t=>{
          const existing = state.ipTags.find(st=>st.name===t.name);
          if(existing){ if(existing.id!==t.id) idRemap.set(t.id, existing.id); }
          else state.ipTags.push(t);
        });
        if(idRemap.size) Object.values(state.sheets).forEach(sh=>{
          sh.components.forEach(c=>{ if(c.ipTagId && idRemap.has(c.ipTagId)) c.ipTagId = idRemap.get(c.ipTagId); });
        });
      }
      if(Array.isArray(data.deviceVendors)){
        state.deviceVendors = dedupeDeviceVendors(state.deviceVendors);
        mergeDeviceVendorsInto(state.deviceVendors, dedupeDeviceVendors(data.deviceVendors));
      }
      if(Array.isArray(data.resourceTypes)){
        const existingTypeIds = new Set(state.resourceTypes.map(t=>t.id));
        data.resourceTypes.forEach(t=>{ if(!existingTypeIds.has(t.id)) state.resourceTypes.push(t); });
      }
      if(data.resourceMargins && typeof data.resourceMargins==='object'){
        state.resourceMargins = Object.assign({lut:20,ff:20,dsp:20,ram:20,other:20}, data.resourceMargins);
      }
      armedPort=null; armedSheetId=null; peekSheetId=null; selectedComponent=null;
      render();
    }catch(err){ alert('Could not load file: '+err.message); }
  };
  reader.readAsText(file);
  e.target.value='';
});

// ---------- shared component creation (used by drag-drop AND right-click "Add Component") ----------
// Creates a new instance of a library node on `sheet` at the given interior column/y, applying
// the same empty-ports/child-sheet rules regardless of how it was placed.
// Whether a library node lives directly in the Base Classes folder (vs. everything else: AXI4
// items, and anything a user defines under their own categories).
function isBaseClassNode(node){
  const bc = state.library.find(n=>n.type==='folder' && n.name==='Base Classes');
  return !!(bc && bc.children.some(c=>c.id===node.id));
}
function insertLibraryComponent(sheet, node, columnIndex, y){
  // Subsystem/HW/Hard Macro/RTL/FPGA/CCA start empty ONLY as Base Classes (the generic starting
  // points) — a non-Base-Class item of one of these types (e.g. something added to the library
  // via "Add to Library…" on a placed component) keeps its template's ports, same as Vendor IP
  // and Register File already do, since its whole purpose is to carry a specific, reusable
  // interface forward.
  const forceEmptyPorts = isBaseClassNode(node) && (node.type==='subsystem' || node.type==='hw' || node.type==='hardmacro' || node.type==='custom' || node.type==='fpga' || node.type==='cca');
  const comp = {
    id: uid('comp'), entityName: node.name, instanceName: node.name,
    columnIndex, hwSlot: null,
    y: Math.max(TOP_MARGIN, y), height: node.height,
    childSheetId: null, isSubsystem: node.type==='subsystem' || node.type==='fpga' || node.type==='cca', isHW: node.type==='hw',
    isHardMacro: node.type==='hardmacro', isRegisterFile: node.type==='regfile', isCustom: node.type==='custom',
    isVendorIP: node.type==='vendorip', isFPGA: node.type==='fpga', isCCA: node.type==='cca',
    resourceRoadmap: !!node.resourceRoadmap,
    // Anything that isn't a Base Class comes from a library-defined, named interface (e.g. an
    // AXI4-Stream Master) — its ports' identity is fixed once it's in the library, so instances
    // lock them: no add/delete/rename/retype/reprotocol. Base Classes stay fully editable, since
    // they're deliberately generic starting points.
    portsLocked: !isBaseClassNode(node),
    linkedId: null,
    // Subsystems, FPGAs, CCAs, HW, Hard Macros, and RTL (WIP) components always start with no
    // ports, regardless of whatever the library template defines — ports are added afterward via
    // Edit Ports. A Register File or Vendor IP keeps whatever its template defines (e.g. a
    // Register File's one CSR interface, or an AXI4-Stream Master's TDATA/TVALID/TREADY).
    ports: forceEmptyPorts ? [] : instantiatePorts(node.ports)
  };
  // Features reference specific ports, so a component whose ports were just wiped starts with no
  // features either — define them on the instance once its real ports exist.
  comp.features = forceEmptyPorts ? [] : instantiateFeatures(node.features, comp.ports);
  // A non-Base-Class library item (e.g. one saved via "Add to Library…") may carry a captured
  // Resources tab template forward, same as its ports — apply it before normalizeComponent runs,
  // so normalizeComponent sees an already-defined value rather than filling in a blank default.
  if(node.resources) comp.resources = JSON.parse(JSON.stringify(node.resources));
  if(node.resourceNotes!==undefined) comp.resourceNotes = node.resourceNotes;
  normalizeComponent(comp); // fills in description/colors/resources/etc. immediately, so anything
                             // that touches those fields (e.g. syncLinkedComponent) is safe even
                             // before this component has been through a render() cycle
  // Every non-container component (plus FPGA and plain Subsystem, both of which have their own
  // internal clocking structure to define even though they're containers in every other sense)
  // gets one default clock port and one default reset port, both input by default — freely
  // renamed, redirected to output, or removed afterward in the Clocking tab. CCA alone stays a
  // pure container with no ports here.
  if(!comp.isCCA){
    comp.clockPorts = [ newClockPort('CLK', 'input') ];
    comp.resetPorts = [ newResetPort('RST', 'input') ];
  }
  sheet.components.push(comp);
  if(node.type==='subsystem' || node.type==='fpga' || node.type==='cca'){
    const sh = newSheet(comp.instanceName, sheet.id, comp.id, childSheetKindFor(comp));
    linkSheetToComponent(sh, comp);
    state.sheets[sh.id] = sh;
    comp.childSheetId = sh.id;
    syncClockingBoundary(comp); // FPGA/Subsystem already have default clock/reset ports at this
                                 // point; CCA has none, so this is a no-op for it
  }
  return comp;
}
// Maps a placed component back to the library node `type` string it would have come from — used
// to re-run classifyDropTarget when pasting a copied/cut component onto a (possibly different)
// sheet, so the same placement rules apply as a fresh drag from the library.
function componentNodeType(comp){
  if(comp.isFPGA) return 'fpga';
  if(comp.isCCA) return 'cca';
  if(comp.isHW) return 'hw';
  if(comp.isHardMacro) return 'hardmacro';
  if(comp.isRegisterFile) return 'regfile';
  if(comp.isCustom) return 'custom';
  if(comp.isVendorIP) return 'vendorip';
  if(comp.isSubsystem) return 'subsystem';
  return 'component';
}
// Base Classes currently allowed on this sheet, for the right-click "Add Component" submenu.
function allowedBaseClassNodes(sheet){
  const folder = state.library.find(n=>n.type==='folder' && n.name==='Base Classes');
  if(!folder) return [];
  return folder.children.filter(n=> n.type!=='folder' && classifyDropTarget(sheet, n.type).allowed);
}

  const check = classifyDropTarget(sheet, node.type);
  if(!check.allowed){ alert(check.reason); return; }
  const layout = computeLayout(sheet);
  const svgRect = document.getElementById('canvas').getBoundingClientRect();
  const mx = e.clientX - svgRect.left, my = (e.clientY - svgRect.top) - BANNER_H;
  insertLibraryComponent(sheet, node, nearestColumn(layout, mx), my - node.height/2);
  render();
});

// ---------- keyboard shortcuts ----------
document.addEventListener('keydown', (e)=>{
  const activeTag = (document.activeElement && document.activeElement.tagName) || '';
  if(activeTag==='INPUT' || activeTag==='TEXTAREA' || activeTag==='SELECT') return; // don't hijack typing

  if(e.key === 'Escape'){
    const modalRoot = document.getElementById('modalRoot');
    if(modalRoot.firstChild){ modalRoot.innerHTML=''; render(); return; }
    closeContextMenu();
    if(armedPort || selectedComponent){ armedPort=null; armedSheetId=null; selectedComponent=null; render(); }
    return;
  }
  if(e.key==='Delete' || e.key==='Backspace'){
    if(!selectedComponent) return;
    const sheet = state.sheets[selectedComponent.sheetId];
    const comp = sheet && sheet.components.find(c=>c.id===selectedComponent.componentId);
    if(sheet && comp){ e.preventDefault(); deleteComponent(sheet, comp); }
    return;
  }
  const mod = e.ctrlKey || e.metaKey;
  if(mod && (e.key==='c' || e.key==='C')){
    if(selectedComponent){ e.preventDefault(); clipboard = { mode:'copy', componentId:selectedComponent.componentId, sheetId:selectedComponent.sheetId }; }
    return;
  }
  if(mod && (e.key==='x' || e.key==='X')){
    if(selectedComponent){ e.preventDefault(); clipboard = { mode:'cut', componentId:selectedComponent.componentId, sheetId:selectedComponent.sheetId }; }
    return;
  }
  if(mod && (e.key==='v' || e.key==='V')){
    if(!clipboard) return;
    e.preventDefault();
    const sheet = curSheet();
    const srcSheet = state.sheets[clipboard.sheetId];
    const srcComp = srcSheet && srcSheet.components.find(c=>c.id===clipboard.componentId);
    let col = 0, y = TOP_MARGIN + 20;
    if(srcComp){ col = Math.min(srcComp.columnIndex, Math.max(0, sheet.numColumns-1)); y = srcComp.y; }
    pasteClipboard(sheet, col, y);
    return;
  }
});

render();
</script>
